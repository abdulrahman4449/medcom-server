// Every issue a crew has raised, open or closed, with what they actually said.
//
// The inbox above is a to-do list and empties as things are dealt with, which is
// right for working through them and wrong for looking back. Once an issue was
// closed the reason it was raised effectively disappeared — so the department
// had no way to see what keeps going wrong, which is the whole reason for
// collecting them.
// ---------- statistics ----------
//
// UHU per person rather than per truck. A medic works a different unit most
// weeks, so a figure attached to MEDIC 1 says nothing about anybody; attached to
// the name and ID on the seat, it is the measure the department actually reports.
//
// Two readings, because they answer different questions: the share of the shift
// spent on a call, and the number of calls completed. A crew can be busy on one
// long critical transfer or on nine short ones, and neither number alone tells
// you which.
const STAT_RANGES = [
  { key: "shift", label: "This shift" },
  { key: "month", label: "This month" },
  { key: "quarter", label: "This quarter" },
  { key: "year", label: "This year" },
];

function statRangeWindow(key, now) {
  const d = new Date(now);
  if (key === "shift") {
    const w = shiftWindowAt(now);
    return { start: w.start, end: w.start + SHIFT_MS, label: "this shift" };
  }
  if (key === "month") {
    const start = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
    return { start, end: new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime(), label: "this month" };
  }
  if (key === "quarter") {
    const q = Math.floor(d.getMonth() / 3) * 3;
    return { start: new Date(d.getFullYear(), q, 1).getTime(), end: new Date(d.getFullYear(), q + 3, 1).getTime(), label: "this quarter" };
  }
  return { start: new Date(d.getFullYear(), 0, 1).getTime(), end: new Date(d.getFullYear() + 1, 0, 1).getTime(), label: "this year" };
}

// Who was on which truck, when, and for how long — read off the sign-on and
// sign-off lines rather than the current roster, so somebody who worked Tuesday
// still counts on Friday.
function staffStatsFor(log, requests, units, win, now, checklistRuns) {
  const people = new Map();
  const person = (id, name) => {
    const k = (id || name || "").toUpperCase();
    if (!people.has(k)) {
      people.set(k, {
        id: id || "", name: name || "", shiftMs: 0, onCallMs: 0, calls: 0,
        units: new Set(),
        // Which shift windows they worked. A set, so a medic who changes
        // truck mid-shift is one shift, not two.
        shifts: new Set(),
      });
    }
    return people.get(k);
  };

  // Time actually worked, paired from sign-on to sign-off.
  //
  // This used to add up the *rostered* twelve hours behind each sign-on, which
  // was wrong the moment anybody moved. Somebody who ran Medic 1 for six hours
  // and then took Bravo on Medic 2 for six signed on twice, so twelve hours of
  // work was counted as twenty-four — and their UHU came out at half what it
  // should have been. The people most likely to move around are the ones
  // covering gaps, so the measure punished exactly the wrong staff.
  //
  // Pairing on to off counts the clock they were actually signed on for, once,
  // however many trucks they sat in. A seat still open at the end of the window
  // is counted up to now.
  const openSeats = new Map();
  const seatKey = (d) => `${d.accountId || d.name}::${d.unitId || ""}::${d.seat || ""}`;

  [...(log || [])]
    .filter((e) => e && e.detail && e.detail.role === "team")
    .sort((a, b) => (a.ts || 0) - (b.ts || 0))
    .forEach((e) => {
      const d = e.detail;
      const k = seatKey(d);
      if (d.kind === "on") {
        openSeats.set(k, { at: e.ts, d });
        if (d.unitId) person(d.accountId, d.name).units.add(d.unitName || d.unitId);
        person(d.accountId, d.name).shifts.add(shiftWindowAt(d.shiftStart || e.ts).start);
      } else if (d.kind === "off") {
        const started = openSeats.get(k);
        openSeats.delete(k);
        if (!started) return;
        const from = Math.max(started.at, win.start);
        const to = Math.min(e.ts, win.end);
        if (to > from) person(d.accountId, d.name).shiftMs += to - from;
      }
    });

  // Anyone still on a seat when the window closes.
  openSeats.forEach(({ at, d }) => {
    const from = Math.max(at, win.start);
    const to = Math.min(now, win.end);
    if (to > from) person(d.accountId, d.name).shiftMs += to - from;
    if (d.unitId) person(d.accountId, d.name).units.add(d.unitName || d.unitId);
  });

  // Time on call, and calls completed, credited to whoever actually held the
  // seats while the call was running — read from the same crew index the log
  // sheet uses, so the app and the spreadsheet credit the same people.
  const crewIndex = medicCrewIndex(units, log, now);
  (requests || []).forEach((r) => {
    if (!r || !r.createdAt || r.createdAt < win.start || r.createdAt >= win.end) return;
    const busy = callBusyMs(r, now);
    const from = callStartTs(r);
    const to = callEndTs(r, now);
    const stays = (crewIndex.get(r.assignedUnitId) || []).filter((c) => {
      const w = stayWindow(c, now);
      return w.start && w.start <= (to || from) && w.end >= from;
    });
    if (!stays.length) return;
    const seen = new Set();
    stays.forEach((c) => {
      const k = (c.accountId || c.name || "").toUpperCase();
      if (!k || seen.has(k)) return;
      seen.add(k);
      const p = person(c.accountId, c.name);
      p.onCallMs += busy;
      if (r.status === "completed") p.calls += 1;
    });
  });

  // The lists each person filed inside the window, credited by name.
  (checklistRuns || []).forEach((r) => {
    if (!r || !r.at || r.at < win.start || r.at >= win.end) return;
    const p = person(r.byAccountId, r.byName);
    p.checklistsFiled = (p.checklistsFiled || 0) + 1;
  });

  return Array.from(people.values())
    .filter((p) => p.name)
    .map((p) => ({
      ...p,
      unitList: Array.from(p.units).join(", "),
      shiftsWorked: p.shifts.size,
      // Measured against the shift, not against time signed on.
      //
      // Six hours on calls in a twelve-hour shift is 50%. That is what the
      // department means by UHU and what the figure gets compared against
      // elsewhere. Dividing by time-signed-on instead flattered whoever left
      // early: run six hours of calls and sign out after eight, and you scored
      // 75% for the same work as somebody who stayed the full twelve.
      //
      // Over a month it is measured against the shifts actually worked, so
      // somebody who worked ten shifts is judged on ten, not on the calendar.
      uhu:
        p.shifts.size > 0
          ? Math.min(100, (p.onCallMs / (p.shifts.size * SHIFT_MS)) * 100)
          : 0,
      // Checklist compliance, against the shifts they actually worked.
      //
      // One list per person per shift is the expectation, so somebody who
      // worked ten shifts and filed eight is at 80%. Measured per person rather
      // than per truck because it is a thing a person did or did not do — and
      // it is credited to whoever filed it, not to whoever was rostered.
      checklistsFiled: p.checklistsFiled || 0,
      checklistCompliance:
        p.shifts.size > 0
          ? Math.min(100, ((p.checklistsFiled || 0) / p.shifts.size) * 100)
          : 0,
    }))
    .sort((a, b) => b.uhu - a.uhu);
}

// Where the month's patients were collected from, per station.
function originStats(requests, win) {
  const rows = new Map();
  PATIENT_ORIGINS.forEach((o) => rows.set(o, { origin: o, main: 0, ccc: 0, total: 0 }));
  let unstated = 0;
  (requests || []).forEach((r) => {
    if (!r || !r.createdAt || r.createdAt < win.start || r.createdAt >= win.end) return;
    const o = (r.patientOrigin || "").trim();
    if (!o) {
      unstated += 1;
      return;
    }
    if (!rows.has(o)) rows.set(o, { origin: o, main: 0, ccc: 0, total: 0 });
    const row = rows.get(o);
    row[stationOf(r) === "ccc" ? "ccc" : "main"] += 1;
    row.total += 1;
  });
  return { rows: Array.from(rows.values()).filter((r) => r.total > 0).sort((a, b) => b.total - a.total), unstated };
}

// What administration needs to be able to answer: how often the department had
// nothing to send, at which station, for how long, and when. Open gaps are shown
// first and loudly — those are happening now.
// The banner for a gap that is running now. Its own component because it is
// shown in two places — under each station's board at the top of the admin
// screen, and on the desk that declared it — and they must not drift apart.
function LiveCoverageBanner({ gap }) {
  const [tick, setTick] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setTick(Date.now()), 1000);
    return () => clearInterval(t);
  }, [gap && gap.id]);
  if (!gap) return null;
  return (
    <div style={styles.coverageOn}>
      <AlertTriangle size={14} style={{ verticalAlign: -2, marginRight: 7 }} />
      NO COVERAGE — {msDurationStr(tick - gap.startedAt)}
      <span style={styles.coverageSince}>
        since {clockStr(gap.startedAt)} · declared by {gap.startedBy}
        {gap.unitsOut && gap.unitsOut.length ? ` · ${gap.unitsOut.join(", ")} out` : ""}
        {" · ends by itself when a team is back in service"}
      </span>
    </div>
  );
}

function CoveragePanel({ coverage, units, requests }) {
  const [open, setOpen] = useState(false);
  const [tick, setTick] = useState(Date.now());
  // Which operational day is being read. "Every gap ever" is not a question
  // anybody asks — the question is always about a particular day, usually one
  // somebody has just been asked about.
  const [day, setDay] = useState(() => opDayKey(opDayStart(Date.now())));

  const all = (coverage || []).slice().sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));
  // The days that actually have something on them, newest first.
  const days = [];
  all.forEach((c) => {
    const k = opDayKey(opDayStart(c.startedAt));
    if (!days.some((d) => d.key === k)) {
      days.push({ key: k, label: opDayLabel(opDayStart(c.startedAt)), start: opDayStart(c.startedAt) });
    }
  });
  const list = all.filter((c) => opDayKey(opDayStart(c.startedAt)) === day);
  const live = all.filter((c) => !c.endedAt);

  useEffect(() => {
    if (!live.length) return;
    const t = setInterval(() => setTick(Date.now()), 1000);
    return () => clearInterval(t);
  }, [live.length]);

  // Totals per station, so a month can be summarised without counting rows.
  const totals = STATIONS.map((st) => {
    const mine = list.filter((c) => c.station === st.key);
    const ms = mine.reduce((sum, c) => sum + ((c.endedAt || tick) - c.startedAt), 0);
    return { station: st, count: mine.length, ms };
  });

  return (
    <>
      {/* The count follows the day being read, not the whole history: a header
          saying "48 on record" above a list showing one day's worth reads as a
          contradiction, which is what made it look like the filter was doing
          nothing. */}
      <FoldingSection
        title="NO COVERAGE — RECORD"
        count={list.length}
        countLabel={
          live.length
            ? `on the selected day · ${live.length} running now`
            : "on the selected day"
        }
        open={open}
        onToggle={() => setOpen((v) => !v)}
      >
        {/* One day at a time. */}
        <div style={styles.archTabs}>
          <select style={{ ...styles.input, maxWidth: 260 }} value={day} onChange={(e) => setDay(e.target.value)}>
            {days.length === 0 && <option value={day}>{opDayLabel(opDayStart(Date.now()))}</option>}
            {days.map((d) => (
              <option key={d.key} value={d.key}>
                {d.label}
                {d.key === opDayKey(opDayStart(Date.now())) ? " — today" : ""}
              </option>
            ))}
          </select>
        </div>

        <div style={{ ...styles.archTabs, marginTop: 8 }}>
          {totals.map((t) => (
            <div key={t.station.key} style={styles.coverageTotal}>
              <div style={styles.coverageTotalName}>{t.station.label}</div>
              <div style={styles.coverageTotalVal}>
                {t.count} {t.count === 1 ? "period" : "periods"}
              </div>
              <div style={styles.coverageTotalMeta}>{msDurationStr(t.ms)} total</div>
            </div>
          ))}
        </div>

        <InfoNote label="What counts as no coverage?">
          Every staffed team at that station is out with a patient. Zahrawi is not counted — it runs
          its own service, and its being free does not mean the fleet can answer a call. A period is
          declared by the desk and ends by itself the moment any team is back in service.
        </InfoNote>

        {list.length === 0 ? (
          <div style={styles.emptyState}>
            No periods recorded on {days.find((d) => d.key === day)
              ? days.find((d) => d.key === day).label
              : opDayLabel(opDayStart(Date.now()))}.
          </div>
        ) : (
          <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
            {list.map((c) => (
              <div key={c.id} style={c.endedAt ? styles.coverageRowPast : styles.coverageRowLive}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={styles.coverageRowHead}>
                    {stationLabel(c.station)}
                    <span style={styles.coverageRowWhen}>{gregDateTimeStr(c.startedAt)}</span>
                  </div>
                  <div style={styles.coverageRowMeta}>
                    {c.endedAt
                      ? `${clockStr(c.startedAt)} → ${clockStr(c.endedAt)}`
                      : `${clockStr(c.startedAt)} → still running`}
                    {c.unitsOut && c.unitsOut.length ? ` · ${c.unitsOut.join(", ")} out` : ""}
                    {c.startedBy ? ` · declared by ${c.startedBy}` : ""}
                  </div>
                </div>
                <div style={c.endedAt ? styles.coverageDur : styles.coverageDurLive}>
                  {msDurationStr((c.endedAt || tick) - c.startedAt)}
                </div>
              </div>
            ))}
          </div>
        )}
      </FoldingSection>
    </>
  );
}

// Administration's side of the checklist: what is on each list, and what came
// back today. Editing here changes what crews see on their next sign-on.
function ChecklistAdmin({ checklists, setChecklists, checklistRuns, units, addLog, user }) {
  const [open, setOpen] = useState(false);
  const [part, setPart] = useState("medic");
  const [draft, setDraft] = useState("");
  const items = (checklists && checklists[part]) || [];
  const today = opDayKey(opDayStart(Date.now()));

  async function save(next) {
    const merged = { ...emptyChecklists(), ...(checklists || {}), [part]: next };
    setChecklists(merged);
    await writeKey(CHECKLIST_KEY, merged);
  }

  async function addItem() {
    const text = draft.trim();
    if (!text) return;
    await save([...items, { id: uid("ci"), text }]);
    setDraft("");
    await addLog(
      `${user.name || "Admin"} added "${text}" to the ${part === "medic" ? "medic" : "EMT"} checklist`,
      "status"
    );
  }

  async function removeItem(it) {
    if (!window.confirm(`Remove "${it.text}" from the list?\n\nLists already filed keep their answers.`)) return;
    await save(items.filter((x) => x.id !== it.id));
    await addLog(`${user.name || "Admin"} removed "${it.text}" from the ${part} checklist`, "status");
  }

  function move(it, dir) {
    const i = items.findIndex((x) => x.id === it.id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= items.length) return;
    const next = items.slice();
    next[i] = items[j];
    next[j] = items[i];
    save(next);
  }

  // What came back today, per truck — the exceptions first, because a list
  // where everything was fine needs no attention.
  const staffed = (units || []).filter(isStaffed);
  const todayRuns = CHECKLIST_PARTS.map((pt) => ({
    part: pt,
    done: staffed.map((u) => ({
      unit: u,
      run: checklistRunFor(checklistRuns, u.id, pt.key, today),
    })),
  }));

  const totalExpected = staffed.length * CHECKLIST_PARTS.length;
  const totalDone = todayRuns.reduce((n, g) => n + g.done.filter((d) => d.run).length, 0);

  return (
    <FoldingSection
      title="VEHICLE CHECKLISTS"
      count={totalExpected ? Math.round((totalDone / totalExpected) * 100) : 0}
      countLabel={`% done today · ${totalDone} of ${totalExpected}`}
      open={open}
      onToggle={() => setOpen((v) => !v)}
    >
      <div style={styles.archTabs}>
        {CHECKLIST_PARTS.map((pt) => (
          <button
            key={pt.key}
            style={pt.key === part ? styles.archTabOn : styles.archTab}
            onClick={() => setPart(pt.key)}
          >
            {pt.label}
            <span style={styles.archTabCount}>{((checklists || {})[pt.key] || []).length}</span>
          </button>
        ))}
      </div>

      <InfoNote label="How the checklist works">
        Each list is checked once a day per vehicle — the medic list by whoever is in Alpha, the EMT
        list by Bravo. Every item is answered available, not available, or not complete, and the
        answers appear here and in the statistics. Changing the list here changes what crews see
        next time they sign on; lists already filed keep the answers they were given.
      </InfoNote>

      <div style={{ marginTop: 12, display: "flex", gap: 8 }}>
        <input
          style={styles.input}
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          placeholder="Add an item, e.g. Oxygen cylinder above half"
          onKeyDown={(e) => {
            if (e.key === "Enter") addItem();
          }}
        />
        <button style={styles.primaryBtnSm} disabled={!draft.trim()} onClick={addItem}>
          Add
        </button>
      </div>

      {items.length === 0 ? (
        <div style={styles.emptyState}>
          Nothing on this list yet. Crews see no checklist until something is added.
        </div>
      ) : (
        <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
          {items.map((it, idx) => (
            <div key={it.id} style={styles.checkAdminRow}>
              <span style={styles.checkAdminNum}>{idx + 1}</span>
              <span style={{ flex: 1, minWidth: 0 }}>{it.text}</span>
              <button style={styles.checkMoveBtn} onClick={() => move(it, -1)} disabled={idx === 0}>↑</button>
              <button style={styles.checkMoveBtn} onClick={() => move(it, 1)} disabled={idx === items.length - 1}>↓</button>
              <button style={styles.checkRemoveBtn} onClick={() => removeItem(it)}>Remove</button>
            </div>
          ))}
        </div>
      )}

      <div style={styles.sectionHeader}>TODAY</div>
      {staffed.length === 0 ? (
        <div style={styles.emptyState}>No crews signed on.</div>
      ) : (
        todayRuns.map((g) => (
          <div key={g.part.key} style={{ marginTop: 8 }}>
            <div style={styles.uhuStationHead}>{g.part.label}</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
              {g.done.map(({ unit, run }) => {
                const flags = run ? checklistFlags(run, (checklists || {})[g.part.key] || []) : [];
                return (
                  <div key={unit.id} style={styles.checkTodayRow}>
                    <span style={styles.checkTodayUnit}>
                      {unit.name}
                      <span style={styles.checkTodayStation}>{stationShort(stationOf(unit))}</span>
                    </span>
                    {run ? (
                      <span style={flags.length ? styles.checkTodayFlag : styles.checkTodayOk}>
                        {flags.length
                          ? `${flags.length} flagged — ${flags.map((f) => f.item.text).join(", ")}`
                          : "all available"}
                      </span>
                    ) : (
                      <span style={styles.checkTodayMissing}>not done</span>
                    )}
                    {run && <span style={styles.checkTodayWho}>{run.byName}</span>}
                  </div>
                );
              })}
            </div>
          </div>
        ))
      )}
    </FoldingSection>
  );
}

function Statistics({ log, requests, units, checklistRuns }) {
  const [open, setOpen] = useState(false);
  const [range, setRange] = useState("shift");
  const [mode, setMode] = useState("uhu");
  const [search, setSearch] = useState("");
  const now = Date.now();
  const win = statRangeWindow(range, now);
  const allStaff = staffStatsFor(log, requests, units, win, now, checklistRuns);
  // Searching by name or ID. On a department this size the list runs past a
  // screenful within a week, and the question is usually about one person.
  const q = (search || "").trim().toLowerCase();
  const staff = q
    ? allStaff.filter(
        (p) =>
          (p.name || "").toLowerCase().includes(q) || (p.id || "").toLowerCase().includes(q)
      )
    : allStaff;
  const origins = originStats(requests, win);
  const inWindow = (requests || []).filter((r) => r && r.createdAt >= win.start && r.createdAt < win.end);

  function download() {
    const wb = XLSX.utils.book_new();
    const rangeLabel = STAT_RANGES.find((x) => x.key === range).label;
    XLSX.utils.book_append_sheet(
      wb,
      autoFitSheet(
        XLSX.utils.json_to_sheet(
          staff.map((p) => ({
            "EMPLOYEE ID": p.id,
            "FULL NAME": p.name,
            "MEDIC TEAM": p.unitList,
            "Total shift in minutes": Math.round(p.shiftMs / 60000),
            "Total patient care time in minutes": Math.round(p.onCallMs / 60000),
            "UHU %": Number(p.uhu.toFixed(1)),
            "TOTAL CALLS": p.calls,
            "CHECKLISTS FILED": p.checklistsFiled,
            "SHIFTS WORKED": p.shiftsWorked,
            "CHECKLIST COMPLIANCE %": Number(p.checklistCompliance.toFixed(0)),
          }))
        ),
        0
      ),
      `UHU ${rangeLabel}`.slice(0, 31)
    );
    XLSX.utils.book_append_sheet(
      wb,
      autoFitSheet(
        XLSX.utils.json_to_sheet(
          origins.rows.map((r) => ({
            "PATIENT INITIAL LOCATION": r.origin,
            "MAIN OFFICE": r.main,
            CCC: r.ccc,
            TOTAL: r.total,
          }))
        ),
        0
      ),
      "PATIENT INITIAL LOCATION"
    );
    const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `medcom-statistics-${range}-${new Date().toISOString().slice(0, 10)}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  return (
    <FoldingSection
      title="STATISTICS"
      count={staff.length}
      countLabel="staff with recorded time"
      open={open}
      onToggle={() => setOpen((v) => !v)}
    >
      <div style={styles.archTabs}>
        {STAT_RANGES.map((r) => (
          <button
            key={r.key}
            style={r.key === range ? styles.archTabOn : styles.archTab}
            onClick={() => setRange(r.key)}
          >
            {r.label}
          </button>
        ))}
      </div>
      <div style={{ ...styles.archTabs, marginTop: 8 }}>
        <button style={mode === "uhu" ? styles.archTabOn : styles.archTab} onClick={() => setMode("uhu")}>
          UHU — share of shift on a call
        </button>
        <button style={mode === "calls" ? styles.archTabOn : styles.archTab} onClick={() => setMode("calls")}>
          Calls completed
        </button>
        <button style={mode === "check" ? styles.archTabOn : styles.archTab} onClick={() => setMode("check")}>
          Checklist compliance
        </button>
      </div>

      <input
        style={{ ...styles.input, marginTop: 10 }}
        value={search}
        onChange={(e) => setSearch(e.target.value)}
        placeholder="Search by name or ID"
      />

      <div style={styles.savedNote}>
        {inWindow.length} call{inWindow.length === 1 ? "" : "s"} raised {win.label}.
        {q && ` Showing ${staff.length} of ${allStaff.length} staff.`}
      </div>
      <InfoNote label="How this is counted">
        Per person, by name and ID, not per truck — a medic works a different unit most weeks, so a
        figure attached to a truck says nothing about anybody. UHU is time on calls measured against
        the shift: six hours on calls in a twelve-hour shift is 50%.
      </InfoNote>

      {staff.length === 0 ? (
        <div style={styles.emptyState}>No signed-on time recorded in this period.</div>
      ) : (
        <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
          {staff.map((p) => (
            <div key={(p.id || p.name)} style={styles.statRow}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={styles.statName}>
                  {p.name} {p.id && <span style={styles.statId}>{p.id}</span>}
                </div>
                <div style={styles.statMeta}>
                  {p.unitList || "—"} · {Math.round(p.onCallMs / 60000)} min on call over{" "}
                  {p.shiftsWorked} {p.shiftsWorked === 1 ? "shift" : "shifts"} ·{" "}
                  {Math.round(p.shiftMs / 60000)} min signed on
                </div>
              </div>
              {mode === "uhu" ? (
                <div style={{ minWidth: 116 }}>
                  <div style={styles.statBarTrack}>
                    <div style={{ ...styles.statBarFill, width: `${Math.max(2, p.uhu)}%` }} />
                  </div>
                  <div style={styles.statValue}>{p.uhu.toFixed(1)}%</div>
                </div>
              ) : mode === "check" ? (
                <div style={{ minWidth: 116 }}>
                  <div style={styles.statBarTrack}>
                    <div
                      style={{
                        ...styles.statBarFill,
                        width: `${Math.max(2, p.checklistCompliance)}%`,
                        background:
                          p.checklistCompliance >= 80
                            ? "linear-gradient(90deg,#3DDC97,#2FBF82)"
                            : "linear-gradient(90deg,#FFB020,#FF7A86)",
                      }}
                    />
                  </div>
                  <div style={styles.statValue}>
                    {p.checklistCompliance.toFixed(0)}% · {p.checklistsFiled}/{p.shiftsWorked}
                  </div>
                </div>
              ) : (
                <div style={styles.statCalls}>{p.calls}</div>
              )}
            </div>
          ))}
        </div>
      )}

      <div style={styles.sectionHeader}>PATIENT INITIAL LOCATION — {win.label.toUpperCase()}</div>
      {origins.rows.length === 0 ? (
        <div style={styles.emptyState}>Nothing recorded against a location yet.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          <div style={{ ...styles.statOriginRow, color: "#5E7488", fontWeight: 700 }}>
            <span style={{ flex: 1 }}>LOCATION</span>
            <span style={styles.statOriginNum}>MAIN</span>
            <span style={styles.statOriginNum}>CCC</span>
            <span style={styles.statOriginNum}>TOTAL</span>
          </div>
          {origins.rows.map((r) => (
            <div key={r.origin} style={styles.statOriginRow}>
              <span style={{ flex: 1, minWidth: 0 }}>{r.origin}</span>
              <span style={styles.statOriginNum}>{r.main}</span>
              <span style={styles.statOriginNum}>{r.ccc}</span>
              <span style={{ ...styles.statOriginNum, fontWeight: 800 }}>{r.total}</span>
            </div>
          ))}
          {origins.unstated > 0 && (
            <div style={styles.formHint}>
              {origins.unstated} call{origins.unstated === 1 ? "" : "s"} with no location recorded.
            </div>
          )}
        </div>
      )}

      <button style={{ ...styles.primaryBtnSm, marginTop: 14 }} onClick={download}>
        <Share2 size={12} /> Download as Excel ({STAT_RANGES.find((x) => x.key === range).label})
      </button>
    </FoldingSection>
  );
}

function IssuesRaised({ requests, viewer }) {
  const [open, setOpen] = useState(false);
  const rows = escalatedCalls(requests, viewer);
  const all = [];
  rows.forEach((row) => {
    (row.escalations || []).forEach((e) => all.push({ e, req: row.req }));
  });
  all.sort((a, b) => (b.e.raisedAt || 0) - (a.e.raisedAt || 0));
  const openCount = all.filter((x) => escalationIsOpen(x.e)).length;

  return (
    <FoldingSection
      title="ISSUES RAISED BY CREWS"
      count={all.length}
      countLabel={openCount ? `on record · ${openCount} still open` : "on record"}
      open={open}
      onToggle={() => setOpen((v) => !v)}
    >
      {all.length === 0 ? (
        <div style={styles.emptyState}>No issues have been raised.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {all.slice(0, 60).map(({ e, req }) => (
            <div key={e.id} style={styles.issueRow}>
              <div style={styles.issueHead}>
                <span style={escalationIsOpen(e) ? styles.issueOpen : styles.issueClosed}>
                  {escalationIsOpen(e) ? "OPEN" : "RESOLVED"}
                </span>
                <span style={styles.issueWho}>
                  {e.unitName || "Crew"}
                  {e.raisedByName ? ` · ${e.raisedByName}` : ""}
                </span>
                <span style={styles.issueWhen}>{gregDateTimeStr(e.raisedAt)}</span>
              </div>
              {/* The reason, kept whether the issue is open or long since
                  closed. This is the part that used to vanish. */}
              <div style={styles.issueText}>{e.message}</div>
              <div style={styles.issueCall}>
                on {req.nature} · {callRoute(req)} · {stationLabel(stationOf(req))}
              </div>
              {(e.replies || []).length > 0 && (
                <div style={styles.issueReply}>
                  Reply: {e.replies[e.replies.length - 1].message}
                </div>
              )}
            </div>
          ))}
          {all.length > 60 && (
            <div style={styles.formHint}>Showing the 60 most recent of {all.length}.</div>
          )}
        </div>
      )}
    </FoldingSection>
  );
}

function SavedLogs({ submissions, requests }) {
  const [station, setStation] = useState(STATIONS[0].key);
  const [busy, setBusy] = useState(null);
  // Folded by default. Within a month this is sixty submissions, and it is
  // reference rather than something an administrator is watching.
  const [open, setOpen] = useState(false);
  // Somebody asking about a log is always asking about a particular day —
  // usually one they have just been telephoned about — so "which day" is the
  // question the panel answers first.
  const [dateFilter, setDateFilter] = useState("");

  const mine = (submissions || [])
    .filter((x) => x && x.station === station)
    .filter((x) => !dateFilter || x.dayKey === dateFilter)
    .sort((a, b) => (b.windowStart || 0) - (a.windowStart || 0));

  // Only dates that actually have a submission, newest first — no empty days to
  // page through.
  const availableDays = [];
  (submissions || [])
    .filter((x) => x && x.station === station)
    .sort((a, b) => (b.windowStart || 0) - (a.windowStart || 0))
    .forEach((x) => {
      if (!availableDays.some((d) => d.key === x.dayKey)) {
        availableDays.push({ key: x.dayKey, label: x.dayLabel });
      }
    });

  // Grouped by the operational day, so the day shift and the night that
  // followed it sit together under one date the way the department thinks
  // about them.
  const days = [];
  mine.forEach((sub) => {
    const found = days.find((d) => d.key === sub.dayKey);
    if (found) found.subs.push(sub);
    else days.push({ key: sub.dayKey, label: sub.dayLabel, dayStart: sub.dayStart, subs: [sub] });
  });

  async function download(sub) {
    setBusy(sub.id);
    try {
      await exportSubmission(sub, requests);
    } finally {
      setBusy(null);
    }
  }

  const openCount = (submissions || []).filter((x) => x && x.status === "open").length;

  return (
    <FoldingSection
      title="LOG SHEET ARCHIVE"
      count={(submissions || []).length}
      countLabel={openCount ? `submitted · ${openCount} completing` : "submitted"}
      open={open}
      onToggle={() => setOpen((v) => !v)}
    >

      {/* Each station keeps its own archive, because each station submits its
          own shifts. */}
      <div style={styles.archTabs}>
        {STATIONS.map((st) => {
          const n = (submissions || []).filter((x) => x && x.station === st.key).length;
          const on = st.key === station;
          return (
            <button
              key={st.key}
              style={on ? styles.archTabOn : styles.archTab}
              onClick={() => setStation(st.key)}
            >
              {st.label}
              <span style={styles.archTabCount}>{n}</span>
            </button>
          );
        })}
      </div>

      {/* Jump to a date, or clear it to see them all. */}
      <div style={{ marginTop: 10, display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
        <select
          style={{ ...styles.input, maxWidth: 250 }}
          value={dateFilter}
          onChange={(e) => setDateFilter(e.target.value)}
        >
          <option value="">All dates ({availableDays.length})</option>
          {availableDays.map((d) => (
            <option key={d.key} value={d.key}>{d.label}</option>
          ))}
        </select>
        {dateFilter && (
          <button style={styles.ghostBtnSm} onClick={() => setDateFilter("")}>Clear</button>
        )}
      </div>

      <InfoNote label="How this works">
        Each desk submits its own shift. A day holds the day shift and the night that follows it.
        A shift submitted with a call still running is filed straight away and completes itself
        once that call closes and its crew signs out, so the overtime is counted.
      </InfoNote>

      {days.length === 0 ? (
        <div style={styles.emptyState}>
          Nothing submitted for {stationLabel(station)} yet.
        </div>
      ) : (
        <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 14 }}>
          {days.map((d) => (
            <div key={d.key}>
              <div style={styles.archDay}>{d.label}</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {d.subs.map((sub) => (
                  <div key={sub.id} style={styles.savedRow}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={styles.savedDay}>
                        {sub.shiftLabel}
                        {sub.status === "open" && (
                          <span style={styles.archOpenTag}>completing…</span>
                        )}
                      </div>
                      <div style={styles.savedMeta}>
                        {sub.callCount} {sub.callCount === 1 ? "call" : "calls"} · submitted{" "}
                        {gregDateTimeStr(sub.submittedAt)}
                        {sub.submittedBy ? ` by ${sub.submittedBy}` : ""}
                        {sub.status === "open" && sub.openRequestIds && sub.openRequestIds.length
                          ? ` · waiting on ${sub.openRequestIds.length} call${
                              sub.openRequestIds.length === 1 ? "" : "s"
                            } to close`
                          : ""}
                        {sub.finalisedAt ? ` · completed ${gregDateTimeStr(sub.finalisedAt)}` : ""}
                      </div>
                    </div>
                    <button
                      style={styles.primaryBtnSm}
                      disabled={busy === sub.id}
                      onClick={() => download(sub)}
                    >
                      <Share2 size={12} /> {busy === sub.id ? "Preparing…" : "Download"}
                    </button>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </FoldingSection>
  );
}

function AdminView({ user, units, requests, scheduled, accounts, log, saveUnits, saveAccounts, saveRequests, saveScheduled, addLog, audioCtxRef, submissions, coverage, checklists, setChecklists, checklistRuns }) {
  // Signing out somebody who went home without doing it. Their hours are closed
  // at the end of the shift they signed on for rather than at this moment —
  // administration pressing a button hours later is not evidence that they
  // worked until now.
  async function relieveSeat(unit, slot, member) {
    const endedAt = member.shiftEnd || Date.now();
    const ok = window.confirm(
      `Sign ${member.name} out of ${seatLabel(slot)} on ${unit.name}?\n\n` +
        `Their shift ended at ${clockStr(endedAt)} and the truck is not out. Their hours are ` +
        `recorded to the end of that shift, not to now.\n\nThis is recorded as done by you.`
    );
    if (!ok) return;
    const fresh = await readKey("ems:units", units);
    const u = fresh.find((x) => x.id === unit.id);
    if (!u || !u[slot]) return;
    const waiting = queuedReliefFor(u, slot);
    await saveUnits(
      fresh.map((x) =>
        x.id === unit.id
          ? {
              ...x,
              [slot]: waiting
                ? {
                    accountId: waiting.accountId,
                    name: waiting.name,
                    shift: waiting.shift,
                    shiftStart: waiting.shiftStart,
                    shiftEnd: waiting.shiftEnd,
                    signedOnAt: waiting.queuedAt,
                  }
                : null,
              relief: waiting ? { ...(x.relief || {}), [slot]: null } : x.relief,
              lastCrew: {
                ...(x.lastCrew || {}),
                [slot]: { ...member, signedOffAt: endedAt, relievedByAdmin: true },
              },
            }
          : x
      )
    );
    await addLog(
      `${unit.name} — ${member.name} (${seatLabel(slot)}) signed out by ${user.name || "Admin"} ` +
        `· did not sign out at the end of their shift`,
      "shift",
      {
        kind: "off",
        role: "team",
        name: member.name,
        accountId: member.accountId,
        unitId: unit.id,
        unitName: unit.name,
        station: stationOf(unit),
        seat: slot,
        shift: member.shift || null,
        shiftStart: member.shiftStart || null,
        shiftEnd: member.shiftEnd || null,
        overtimeMs: 0,
        relievedByAdmin: true,
      }
    );
  }

  const [crewName, setCrewName] = useState("");
  const [crewId, setCrewId] = useState("");
  const [crewError, setCrewError] = useState("");
  const [crewBusy, setCrewBusy] = useState(false);

  // Adding a truck to a station. One box is shared between the two station
  // sections and remembers which one is being typed into, so a name half-typed
  // under CCC can never be added to the Main Office by accident.
  // The account lists start folded: an administrator opens this screen to look
  // at the board, not to add an ID.
  const [openCrew, setOpenCrew] = useState(false);
  const [openDisp, setOpenDisp] = useState(false);
  const [openAdm, setOpenAdm] = useState(false);

  const [newUnitName, setNewUnitName] = useState("");
  const [newUnitStation, setNewUnitStation] = useState(null);
  const [unitError, setUnitError] = useState("");

  async function addUnit(station) {
    const name = newUnitName.trim().toUpperCase();
    setUnitError("");
    if (!name) return;
    const fresh = await readKey("ems:units", units);
    // Only a clash inside the same station matters. Both stations run a MEDIC 1
    // and always will.
    if (fresh.some((u) => stationOf(u) === station && (u.name || "").toUpperCase() === name)) {
      setUnitError(`${stationLabel(station)} already has a ${name}.`);
      return;
    }
    const unit = {
      id: uid("unit"),
      name,
      station,
      status: "oos",
      assignedRequestId: null,
      alpha: null,
      bravo: null,
    };
    await saveUnits([...fresh, unit]);
    setNewUnitName("");
    setNewUnitStation(null);
    await addLog(`${name} added to ${stationLabel(station)} by ${user.name || "Admin"}`, "status");
  }

  const [adminName, setAdminName] = useState("");
  const [adminId, setAdminId] = useState("");
  const [adminError, setAdminError] = useState("");
  const [adminBusy, setAdminBusy] = useState(false);

  const [dispName, setDispName] = useState("");
  const [dispId, setDispId] = useState("");
  const [dispError, setDispError] = useState("");
  const [dispBusy, setDispBusy] = useState(false);

  // { role, message } — scoped so the message renders under the roster the
  // admin actually clicked in, not always under the admin list.
  const [removeError, setRemoveError] = useState(null);
  const [removingId, setRemovingId] = useState(null);
  // Which live call's escalation thread is unfolded on the monitor below.
  const [escFor, setEscFor] = useState(null);

  async function addCrewAccount() {
    if (!crewName.trim() || !crewId.trim()) return;
    setCrewBusy(true);
    setCrewError("");
    const accts = await readKey("ems:accounts", accounts);
    if (accts.some((a) => a.id.toLowerCase() === crewId.trim().toLowerCase())) {
      setCrewBusy(false);
      setCrewError("That ID already exists.");
      return;
    }
    const next = [
      ...accts,
      {
        id: crewId.trim(),
        name: crewName.trim(),
        role: "crew",
        // Teams aren't fixed: the medic is chosen at every sign-in, so an
        // account is never tied to one.
        team: null,
        passwordHash: null,
        createdAt: Date.now(),
      },
    ];
    await saveAccounts(next);
    await addLog(`Admin added crew ID for ${crewName.trim()}`, "status");
    setCrewName("");
    setCrewId("");
    setCrewBusy(false);
  }

  async function addAdminAccount() {
    if (!adminName.trim() || !adminId.trim()) return;
    setAdminBusy(true);
    setAdminError("");
    const accts = await readKey("ems:accounts", accounts);
    if (accts.some((a) => a.id.toLowerCase() === adminId.trim().toLowerCase())) {
      setAdminBusy(false);
      setAdminError("That ID already exists.");
      return;
    }
    const next = [
      ...accts,
      { id: adminId.trim(), name: adminName.trim(), role: "admin", team: null, passwordHash: null, createdAt: Date.now() },
    ];
    await saveAccounts(next);
    await addLog(`Admin added a new admin ID for ${adminName.trim()}`, "status");
    setAdminName("");
    setAdminId("");
    setAdminBusy(false);
  }

  async function addDispatcherAccount() {
    if (!dispName.trim() || !dispId.trim()) return;
    setDispBusy(true);
    setDispError("");
    const accts = await readKey("ems:accounts", accounts);
    if (accts.some((a) => a.id.toLowerCase() === dispId.trim().toLowerCase())) {
      setDispBusy(false);
      setDispError("That ID already exists.");
      return;
    }
    const next = [
      ...accts,
      { id: dispId.trim(), name: dispName.trim(), role: "dispatcher", team: null, passwordHash: null, createdAt: Date.now() },
    ];
    await saveAccounts(next);
    await addLog(`Admin added a dispatcher ID for ${dispName.trim()}`, "status");
    setDispName("");
    setDispId("");
    setDispBusy(false);
  }

  // Removing an account is a clean delete: the same ID can be added again
  // later. Anyone sitting in a seat right now is stood down first, and a unit
  // left completely unstaffed (and not on a call) drops back out of service —
  // the same handling as a normal sign-out.
  async function removeAccount(account) {
    const seat = currentSeat(account);
    const isSelf = user && user.accountId === account.id;
    const lastAdmin = account.role === "admin" && accounts.filter((a) => a.role === "admin").length <= 1;

    if (isSelf) {
      setRemoveError({ role: account.role, message: "You can't remove the account you're signed in with." });
      return;
    }
    if (lastAdmin) {
      setRemoveError({
        role: account.role,
        message: "That's the only admin left — add another admin before removing this one.",
      });
      return;
    }
    const warning = seat
      ? `Remove ${account.name} (${account.id})?\n\nThey are on duty right now (${seat}) and will be stood down.\n\nYou can add this ID again later.`
      : `Remove ${account.name} (${account.id})?\n\nYou can add this ID again later.`;
    if (!window.confirm(warning)) return;

    setRemoveError(null);
    setRemovingId(account.id);

    const freshUnits = await readKey("ems:units", units);
    let unitsTouched = false;
    const nextUnits = freshUnits.map((u) => {
      const inAlpha = u.alpha && u.alpha.accountId === account.id;
      const inBravo = u.bravo && u.bravo.accountId === account.id;
      if (!inAlpha && !inBravo) return u;
      unitsTouched = true;
      const cleared = { ...u, alpha: inAlpha ? null : u.alpha, bravo: inBravo ? null : u.bravo };
      if (!cleared.alpha && !cleared.bravo && !cleared.assignedRequestId) cleared.status = "oos";
      return cleared;
    });
    if (unitsTouched) await saveUnits(nextUnits);

    const accts = await readKey("ems:accounts", accounts);
    await saveAccounts(accts.filter((a) => a.id !== account.id));
    await addLog(
      `Admin removed ${ROLE_LABELS[account.role] || account.role} ID for ${account.name}${seat ? ` (stood down from ${seat})` : ""}`,
      "status"
    );
    setRemovingId(null);
  }

  // Where (if anywhere) this account is actually seated right now — live,
  // not just what team they're rostered to.
  function currentSeat(account) {
    for (const u of units) {
      if (u.alpha && u.alpha.accountId === account.id) return `${u.name} — Alpha`;
      if (u.bravo && u.bravo.accountId === account.id) return `${u.name} — Bravo`;
    }
    return null;
  }

  const crewAccounts = accounts.filter((a) => a.role === "crew");
  const adminAccounts = accounts.filter((a) => a.role === "admin");
  const dispatcherAccounts = accounts.filter((a) => a.role === "dispatcher");
  const active = requests.filter((r) => r.status !== "completed").sort((a, b) => b.createdAt - a.createdAt);
  // An admin sees every escalation on the board — the inbox below, the banner
  // on each live call, and the same banner on every call in the history.
  const escViewer = escalationViewer(user, null, null);

  // Shared trash control for every roster row. Disabled (with the reason in the
  // tooltip) for the account you're signed in with and for the last admin.
  function RemoveBtn({ account }) {
    const isSelf = user && user.accountId === account.id;
    const lastAdmin = account.role === "admin" && adminAccounts.length <= 1;
    const blocked = isSelf || lastAdmin;
    const title = isSelf
      ? "You can't remove the account you're signed in with"
      : lastAdmin
      ? "The only admin can't be removed"
      : `Remove ${account.name}`;
    return (
      <button
        style={{ ...styles.removeBtn, opacity: blocked ? 0.3 : 1, cursor: blocked ? "not-allowed" : "pointer" }}
        title={title}
        disabled={blocked || removingId === account.id}
        onClick={() => removeAccount(account)}
      >
        {removingId === account.id ? "…" : <Trash size={13} />}
      </button>
    );
  }

  // Removal feedback, shown under whichever roster the admin clicked in.
  function RemoveError({ role }) {
    if (!removeError || removeError.role !== role) return null;
    return <div style={styles.loginError}>{removeError.message}</div>;
  }

  return (
    <div>
      {/* One board per station rather than one board for the department. A
          combined count answers a question nobody at either station is asking:
          "three available" means nothing if two of them are at the other end
          of the city. */}
      {STATIONS.map((st) => {
        const gap = openCoverageGap(coverage, st.key);
        return (
          <div key={st.key} style={{ marginBottom: 10 }}>
            <div style={styles.stationBoardLabel}>{st.label}</div>
            <StatusBoard units={atStation(units, st.key)} />
            {/* Directly under this station's own board. An administrator opening
                the app must see that a station cannot answer a call in the same
                glance that tells them who is free — not after scrolling. */}
            {gap && <LiveCoverageBanner gap={gap} />}
          </div>
        );
      })}

      {/* The kept days, near the top: it is the thing an administrator comes
          back to this screen for, and it should not be at the bottom of a long
          scroll. */}
      <SavedLogs submissions={submissions} requests={requests} />

      {/* The standing record of what crews have reported — the reasons stay
          readable long after each issue is closed. */}
      {/* The standing record. What is happening right now is shown at the top,
          under each station's own board. */}
      <CoveragePanel coverage={coverage} units={units} requests={requests} />

      {/* What is on each list, and what came back today. */}
      <ChecklistAdmin
        checklists={checklists}
        setChecklists={setChecklists}
        checklistRuns={checklistRuns}
        units={units}
        addLog={addLog}
        user={user}
      />

      {/* Per-person UHU and the month's patient-origin table. */}
      <Statistics log={log} requests={requests} units={units} checklistRuns={checklistRuns} />

      <IssuesRaised requests={requests} viewer={escViewer} />

      {/* Straight under the board, above the rosters. An issue a crew took the
          trouble to write down is the one thing on this screen that has
          somebody waiting on the other end of it. */}
      <EscalationInbox
        requests={requests}
        units={units}
        viewer={escViewer}
        saveRequests={saveRequests}
        addLog={addLog}
      />

      <FoldingSection
        title="ADD TEAM MEMBER ID"
        count={accounts.filter((a) => a.role === "crew").length}
        countLabel="on file"
        open={openCrew}
        onToggle={() => setOpenCrew((v) => !v)}
      >
      <div style={styles.requestForm}>
        <div style={styles.formRow}>
          <div style={{ flex: 1 }}>
            <label style={styles.label}>Name</label>
            <input style={styles.input} value={crewName} onChange={(e) => setCrewName(e.target.value)} placeholder="e.g. R. Chen" />
          </div>
          <div style={{ flex: 1 }}>
            <label style={styles.label}>ID</label>
            <input style={styles.input} value={crewId} onChange={(e) => setCrewId(e.target.value)} placeholder="e.g. F1122334" />
          </div>
        </div>
        <InfoNote label="More about this">
          Team members aren't tied to a medic — they choose the unit they're working, and Alpha or
          Bravo on it, at every sign-in.
        </InfoNote>
        {crewError && <div style={styles.loginError}>{crewError}</div>}
        <button style={styles.primaryBtnSm} disabled={crewBusy} onClick={addCrewAccount}>
          <Plus size={14} /> Add ID
        </button>

        {crewAccounts.length > 0 && (
          <div style={styles.accountList}>
            {crewAccounts.map((a) => {
              const seat = currentSeat(a);
              return (
                <div key={a.id} style={styles.accountRow}>
                  <span style={styles.accountRowName}>{a.name}</span>
                  <span style={styles.accountRowMeta}>{a.id}</span>
                  <span style={seat ? styles.accountActiveTag : styles.accountPendingTag}>
                    {seat ? `Online — ${seat}` : a.passwordHash ? "Offline" : "Pending first login"}
                  </span>
                  <RemoveBtn account={a} />
                </div>
              );
            })}
          </div>
        )}
        <RemoveError role="crew" />
      </div>
      </FoldingSection>

      <FoldingSection
        title="ADD DISPATCHER"
        count={accounts.filter((a) => a.role === "dispatcher").length}
        countLabel="on file"
        open={openDisp}
        onToggle={() => setOpenDisp((v) => !v)}
      >
      <div style={styles.requestForm}>
        <div style={styles.formRow}>
          <div style={{ flex: 1 }}>
            <label style={styles.label}>Name</label>
            <input style={styles.input} value={dispName} onChange={(e) => setDispName(e.target.value)} placeholder="e.g. J. Alvarez" />
          </div>
          <div style={{ flex: 1 }}>
            <label style={styles.label}>ID</label>
            <input style={styles.input} value={dispId} onChange={(e) => setDispId(e.target.value)} placeholder="e.g. D1000002" />
          </div>
        </div>
        <div style={styles.formHint}>Dispatchers can also join a team as crew when a unit is short-staffed.</div>

// ---------- UHU panel ----------

// Crews see only their own team's UHU (this replaces the log sheet for them);
// dispatch and admin see the whole fleet plus a combined total.
function UhuPanel({ units, requests, focusUnitId }) {
  const [now, setNow] = useState(Date.now());

  // Own ticker so a running call's time counts up second by second even when
  // nothing else on the board changes.
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const rows = computeUhu(units, requests, now);
  const focus = focusUnitId ? rows.find((r) => r.unit.id === focusUnitId) : null;
  const fleetMs = rows.reduce((sum, r) => sum + r.totalMs, 0);
  const fleetCalls = rows.reduce((sum, r) => sum + r.calls, 0);

  // Grouped by station and then ordered by unit, not ranked by time. Both
  // stations run a MEDIC 1, and a list sorted by hours put them in the order
  // "MEDIC 1, MEDIC 2, MEDIC 1" with nothing to say the last one was CCC's.
  // Reading a roster is easier when the trucks are in the order they are named.
  const groups = STATIONS.map((st) => ({
    station: st,
    rows: rows
      .filter((r) => stationOf(r.unit) === st.key)
      .sort((a, b) =>
        a.unit.name.localeCompare(b.unit.name, undefined, { numeric: true, sensitivity: "base" })
      ),
  })).filter((g) => g.rows.length);

  return (
    <div style={styles.uhuPanel}>
      <div style={styles.logHeader}>
        <Clock size={13} color="#93A7B8" />
        <span>UHU — TIME ON CALL</span>
        <span style={styles.uhuScope}>this shift</span>
      </div>

      {focus ? (
        <div style={styles.uhuFocus}>
          <div style={styles.uhuFocusUnit}>{focus.unit.name}</div>
          <div style={styles.uhuFocusTotal}>{msDurationStr(focus.totalMs)}</div>
          <div style={styles.uhuFocusCaption}>
            total time on call across {focus.calls} {focus.calls === 1 ? "call" : "calls"}
          </div>
          {focus.activeCall ? (
            <div style={styles.uhuLiveBox}>
              <div style={styles.uhuLiveRow}>
                <Circle size={8} fill="#FF4D5E" style={{ animation: "pulse-dot 1.4s ease-in-out infinite" }} />
                <span style={styles.uhuLiveLabel}>ON A CALL NOW</span>
                <span style={styles.uhuLiveTime}>{msDurationStr(focus.activeMs)}</span>
              </div>
              <div style={styles.uhuLiveNature}>{focus.activeCall.nature}</div>
            </div>
          ) : (
            <div style={styles.uhuIdleBox}>Not on a call — the clock is stopped.</div>
          )}
        </div>
      ) : (
        <React.Fragment>
          <div style={styles.uhuList}>
            {groups.length === 0 && <div style={styles.logEmpty}>No teams on the board yet.</div>}
            {groups.map((g) => (
              <React.Fragment key={g.station.key}>
                {/* Only worth a heading when both stations are in the list. A
                    desk sees its own station and needs no heading at all. */}
                {groups.length > 1 && <div style={styles.uhuStationHead}>{g.station.label}</div>}
                {g.rows.map((row) => (
              <div key={row.unit.id} style={styles.uhuRow}>
                <div style={styles.uhuRowMain}>
                  <span style={styles.uhuRowName}>{row.unit.name}</span>
                  {row.activeCall && (
                    <Circle size={7} fill="#FF4D5E" style={{ animation: "pulse-dot 1.4s ease-in-out infinite" }} />
                  )}
                </div>
                <div style={styles.uhuRowRight}>
                  <span style={styles.uhuRowTime}>{msDurationStr(row.totalMs)}</span>
                  <span style={styles.uhuRowCalls}>
                    {row.calls} {row.calls === 1 ? "call" : "calls"}
                    {row.activeCall ? ` · +${msDurationStr(row.activeMs)} running` : ""}
                  </span>
                </div>
              </div>
                ))}
              </React.Fragment>
            ))}
          </div>
          <div style={styles.uhuFooter}>
            <span>FLEET TOTAL</span>
            <span style={styles.uhuFooterTime}>
              {msDurationStr(fleetMs)} · {fleetCalls} {fleetCalls === 1 ? "call" : "calls"}
            </span>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

// ---------- log sheet ----------

const LOG_COLORS = {
  call: "#FFB020",
  assign: "#35C4E8",
  status: "#93A7B8",
  clear: "#3DDC97",
  shift: "#818CF8",
};

// The two lines the log sheet still carries, colour-coded so a desk can tell
// them apart down the edge of the panel without reading the sentence.
const BOARD_EVENTS = {
  ack: { label: "ACKNOWLEDGED", color: "#3DDC97" },
  enroute: { label: "EN ROUTE", color: "#35C4E8" },
};

// The log sheet doubles as the shift record: every sign-on, sign-off, swap and
// overtime crossing lands here as a "shift" entry carrying a structured detail
// record, and the Shift Swaps tab shows nothing else — who came on, which of
// the two 12-hour shifts they're working, who they relieved, and how much
// overtime came with it.
//
// The activity tab is deliberately narrow. Dispatch and admin used to get every
// line the app wrote, which on a busy shift buried the two answers a desk
// actually watches for — did the crew hear the call, and are they rolling —
// under codings, bookings, status flips and closures. Those are all still
// written and still exported; this panel shows the acknowledgement and the
// en-route stamp, and points at the spreadsheet for the rest.
function LogSheet({ log, units, station }) {
  const [tab, setTab] = useState("all");
  const [feedOpen, setFeedOpen] = useState(true);
  const now = Date.now();
  // A desk reads its own station's log and nothing else. An administrator has
  // no station on their session, so they read both — which is the one place
  // the two are meant to be visible together.
  const scoped = station ? log.filter((e) => stationOf(e) === station) : log;
  const shiftEntries = scoped.filter((e) => e.type === "shift");
  const boardEntries = scoped.filter(isBoardLogEntry);
  // One feed rather than two tabs. "Acknowledged & en route" and "shift swaps"
  // were the same thing split in half — the log of what happened on this board —
  // and splitting it meant neither list told the whole story. Newest first,
  // everything together.
  const shown = [...shiftEntries, ...boardEntries].sort((a, b) => (b.ts || 0) - (a.ts || 0));

  const scheduled = shiftMeta(scheduledShiftKey(now));
  const liveWindow = shiftWindowAt(now);
  const onDuty = crewOnDuty(units);
  const overtimeCount = onDuty.filter((row) => overtimeMs(row.member, now) > 0).length;

  return (
    <div style={styles.logPanel}>
      {/* Foldable: on a desk that is watching calls, the feed is reference
          rather than something to be stared at. */}
      <button style={styles.logHeaderBtn} onClick={() => setFeedOpen((v) => !v)}>
        <ChevronRight
          size={13}
          style={{
            transform: feedOpen ? "rotate(90deg)" : "none",
            transition: "transform .15s ease",
            marginRight: 7,
          }}
        />
        <span>EVENT LOG</span>
        <span style={styles.logHeaderCount}>{shown.length}</span>
      </button>

      <div style={styles.shiftBanner}>
        <span style={{ ...styles.shiftTag, color: scheduled.color, borderColor: scheduled.color }}>
          {scheduled.glyph} {scheduled.label}
        </span>
        <span style={styles.shiftBannerWindow}>{scheduled.window}</span>
        <span style={styles.shiftBannerCrew}>{onDuty.length} on duty</span>
        {overtimeCount > 0 && <span style={styles.otTag}>{overtimeCount} on overtime</span>}
      </div>
      <div style={styles.shiftBannerDate}>
        Running since {gregShortDateTimeStr(liveWindow.start)} · ends {gregShortDateTimeStr(liveWindow.end)}
      </div>

      <InfoNote label="What is in this log?">
        Acknowledgements, en-route stamps and shift changes. Everything else — assignments, status
        changes, codings, bookings and closures — is still recorded and goes out on the Event Log
        sheet of the spreadsheet, filed under the shift it happened on.
      </InfoNote>

      {feedOpen && (
        <div style={styles.logList}>
          {shown.length === 0 && (
            <div style={styles.logEmpty}>Nothing recorded on this board yet.</div>
          )}
          {shown.map((entry) => (
            <LogEntryRow key={entry.id} entry={entry} showStation={!station} />
          ))}
        </div>
      )}
    </div>
  );
}

// A log line carries the name of whoever put it there, because neither the
// medics nor the desk keep the same people for long — the unit name alone
// doesn't say who was on it. A shift entry also shows the swap broken out as
// chips, so the handover can be read at a glance. Entries from before either
// record existed fall back to the sentence alone.
function LogEntryRow({ entry, showStation }) {
  const detail = entry.type === "shift" ? entry.detail : null;
  const event = detail && SHIFT_EVENTS[detail.kind];
  // An acknowledgement or an en-route stamp. Anything else in the feed never
  // reaches this row any more, but a line written before events were tagged
  // still renders as the plain sentence it always did.
  const boardEvent =
    entry.type !== "shift" && entry.detail && BOARD_EVENTS[entry.detail.event]
      ? BOARD_EVENTS[entry.detail.event]
      : null;
  const meta = detail ? shiftMeta(detail.shift) : null;
  const from = detail ? shiftMeta(detail.fromShift) : null;
  const relieved = detail ? shiftMeta(detail.relievedShift) : null;
  const actor = entry.actor && entry.actor.name ? entry.actor : null;
  const post = actorPost(actor);

  return (
    <div
      style={{
        ...styles.logEntry,
        borderLeftColor:
          (event ? event.color : boardEvent ? boardEvent.color : LOG_COLORS[entry.type]) || "#33475A",
      }}
    >
      <div style={styles.logTopRow}>
        <span style={styles.logTime}>{entry.time}</span>
        {/* Only worth saying when both stations are in the same feed. On a
            desk's own log every line is its own station and the tag would be
            noise on every row. */}
        {showStation && (
          <span style={styles.logStationTag}>{stationShort(stationOf(entry))}</span>
        )}
        {boardEvent && (
          <span
            style={{ ...styles.shiftEventTag, color: boardEvent.color, borderColor: boardEvent.color }}
          >
            {boardEvent.label}
          </span>
        )}
        {actor && (
          <span style={styles.logStamp} title={`Logged by ${actorStampText(actor)}`}>
            <span style={styles.logStampName}>{actor.name}</span>
            {post && <span style={styles.logStampPost}>{post}</span>}
          </span>
        )}
      </div>
      <div style={styles.logMessage}>{entry.message}</div>
      {detail && (
        <div style={styles.shiftDetailRow}>
          {event && (
            <span style={{ ...styles.shiftEventTag, color: event.color, borderColor: event.color }}>
              {event.label}
            </span>
          )}
          {detail.unitName && (
            <span style={styles.shiftDetailChip}>
              {detail.unitName}
              {detail.seat ? ` · ${seatLabel(detail.seat)}` : ""}
            </span>
          )}
          {from && <span style={styles.shiftDetailChip}>{from.short} →</span>}
          {meta && (
            <span style={{ ...styles.shiftTag, color: meta.color, borderColor: meta.color }}>
              {meta.glyph} {meta.short}
            </span>
          )}
          {detail.shiftStart && (
            <span style={styles.shiftDetailChip}>
              {hhmm(detail.shiftStart)}–{hhmm(detail.shiftEnd)}
            </span>
          )}
          {detail.overtimeMs > 0 && <span style={styles.otTag}>OT {shortDurationStr(detail.overtimeMs)}</span>}
          {detail.relievedName && (
            <span style={styles.shiftDetailChip}>
              relieved {detail.relievedName}
              {relieved ? ` (${relieved.short})` : ""}
              {detail.relievedOvertimeMs > 0 ? ` · ${shortDurationStr(detail.relievedOvertimeMs)} OT` : ""}
            </span>
          )}
        </div>
      )}
    </div>
  );
}
