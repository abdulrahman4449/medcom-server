const { useState, useEffect, useRef, useCallback } = React;

}

// ---------- storage layer (Netlify DB via the /api/board function) ----------

// The web version of this app is served from this same domain, so a relative
// "/api/board" URL works fine there. Once this page is loaded inside a native
// iOS/Android shell instead (Capacitor), it's no longer running on this
// domain at all — so every call has to point at the full URL of the live
// site instead of a relative path, or it has nothing to resolve against.
//
// This is decided at runtime rather than hardcoded, because the same www/
// folder is both the web build and the payload the native shell bundles. A
// fixed absolute URL meant the web copy also called the live production site,
// so opening this deploy in a browser read and wrote the real dispatch board
// instead of the backend it is served alongside.
//
// Native is detected via the Capacitor bridge, which the webview injects
// before this file runs. Protocol alone is not enough: iOS loads from
// capacitor://localhost but Android loads from http://localhost, which is
// indistinguishable from a plain local web server.
// TESTING CONFIG: this points at your Mac's own local server for Simulator
// testing (see README's "Test in the Simulator first" section). Before this
// app goes to real devices or the App Store, change this back to your real,
// always-on server URL (Render, etc.) — "localhost" only means anything on
// the same Mac the server is running on.
const LIVE_SITE = "https://medcom-server.onrender.com";
const IS_NATIVE_SHELL =
  (typeof window !== "undefined" &&
    !!window.Capacitor &&
    typeof window.Capacitor.isNativePlatform === "function" &&
    window.Capacitor.isNativePlatform()) ||
  (typeof location !== "undefined" && location.protocol === "capacitor:");
const API_BASE = IS_NATIVE_SHELL ? LIVE_SITE : "";

// Returned by readKeyRaw when the read itself failed, as opposed to the key
// genuinely being empty. The difference matters: an empty board should be
// seeded with defaults, but a failed read must NOT be, or a transient DB
// error would overwrite the real roster with the built-in accounts and
// resurrect every user an admin had removed.
const READ_FAILED = Symbol("READ_FAILED");

// ---------- working without a signal ----------
//
// An ambulance loses its connection constantly — basements, lifts, concrete
// stairwells, which is exactly where patients are. Before this existed a crew
// could stamp a whole call underground, watch every time land on screen, and
// lose all of it the moment the tablet found a signal again: the write had
// failed silently and the next poll overwrote the screen with the server's
// older copy. Silent loss is worse than a visible error, because nobody knows
// to re-enter anything.
//
// So: a failed write is not discarded. The records it was trying to save are
// kept here, on the device, and replayed onto whatever the server has as soon
// as it can be reached. They are kept per record rather than as a whole board,
// so replaying a crew's timestamps cannot wipe out what the desk did while
// they were out of contact.
const PENDING_KEY = "ems:pendingWrites";

// { "ems:requests": { "<record id>": {...record} }, ... }
let pendingWrites = {};

function loadPendingWrites() {
  try {
    const raw = window.localStorage.getItem(PENDING_KEY);
    pendingWrites = raw ? JSON.parse(raw) || {} : {};
  } catch (e) {
    pendingWrites = {};
  }
  return pendingWrites;
}

function savePendingWrites() {
  try {
    window.localStorage.setItem(PENDING_KEY, JSON.stringify(pendingWrites));
  } catch (e) {
    // A device with no storage left still works — it just can't survive a
    // reload while offline. Nothing else should break because of this.
  }
}

function pendingCountFor(key) {
  return Object.keys(pendingWrites[key] || {}).length;
}

function totalPendingCount() {
  return Object.keys(pendingWrites).reduce((n, k) => n + pendingCountFor(k), 0);
}

// Which records in `next` are new or changed compared with `prev`. Only these
// are worth keeping: a crew stamping one call has changed one record, and
// queueing the whole board would mean replaying their copy of every other
// call too.
function changedRecords(next, prev) {
  const before = new Map((prev || []).filter((x) => x && x.id).map((x) => [x.id, JSON.stringify(x)]));
  const out = {};
  (next || []).forEach((rec) => {
    if (!rec || !rec.id) return;
    const now = JSON.stringify(rec);
    if (before.get(rec.id) !== now) out[rec.id] = rec;
  });
  return out;
}

function queueRecords(key, records) {
  if (!records || !Object.keys(records).length) return;
  const stamped = {};
  Object.keys(records).forEach((id) => {
    stamped[id] = { ...records[id], __queuedAt: Date.now() };
  });
  pendingWrites[key] = { ...(pendingWrites[key] || {}), ...stamped };
  savePendingWrites();
}

function clearQueued(key, ids) {
  if (!pendingWrites[key]) return;
  ids.forEach((id) => delete pendingWrites[key][id]);
  if (!Object.keys(pendingWrites[key]).length) delete pendingWrites[key];
  savePendingWrites();
}

// Drop anything we are holding that the server already has, identically.
//
// Without this the queue had no way of noticing a record had got through. A
// write that failed once — or that succeeded on a retry the caller never heard
// about — left records held forever, and the banner sat there announcing "316
// saved changes" on a board where nothing had changed since yesterday. A held
// record only means something while it differs from the server; the moment the
// two agree it is finished, and saying otherwise is just noise.
//
// Age is the second net: nothing is worth holding for more than a day. If it
// has not gone up by then it never will, and it is certainly no longer the
// newest version of anything.
const PENDING_MAX_AGE_MS = 24 * 60 * 60 * 1000;

function reconcilePending(key, serverList) {
  const held = pendingWrites[key];
  if (!held) return;
  const onServer = new Map(
    (serverList || []).filter((x) => x && x.id).map((x) => [x.id, JSON.stringify(x)])
  );
  let dropped = 0;
  Object.keys(held).forEach((id) => {
    const rec = held[id];
    const stale = rec && rec.__queuedAt && Date.now() - rec.__queuedAt > PENDING_MAX_AGE_MS;
    const settled = onServer.get(id) === JSON.stringify(stripQueueMeta(rec));
    if (settled || stale) {
      delete held[id];
      dropped += 1;
    }
  });
  if (!Object.keys(held).length) delete pendingWrites[key];
  if (dropped) {
    savePendingWrites();
    notifyPendingChanged();
  }
}

function stripQueueMeta(rec) {
  if (!rec || typeof rec !== "object") return rec;
  const { __queuedAt, ...clean } = rec;
  return clean;
}

// The server's copy, with anything this device is still holding laid over the
// top of it. A record the device changed wins, because the device is the only
// place that change exists yet.
function mergePending(key, serverList) {
  const held = pendingWrites[key];
  if (!held || !Object.keys(held).length) return serverList || [];
  const byId = new Map((serverList || []).filter((x) => x && x.id).map((x) => [x.id, x]));
  // The queue marker is bookkeeping for this device, not part of the record —
  // it must never reach the board or the spreadsheet.
  Object.values(held).forEach((rec) => byId.set(rec.id, stripQueueMeta(rec)));
  const merged = Array.from(byId.values());
  // The log is a newest-first feed with a cap; everything else keeps the order
  // the server gave it.
  if (key === "ems:log") {
    merged.sort((a, b) => (b.ts || 0) - (a.ts || 0));
    return merged.slice(0, LOG_CAP);
  }
  return merged;
}

async function readKeyRaw(key) {
  try {
    const res = await fetch(`${API_BASE}/api/board?key=${encodeURIComponent(key)}`);
    // Refused, not unreachable. The account list in particular is no longer
    // served through the board — it is credential material and now sits behind
    // its own administrator-only endpoint. A refusal means "nothing here for
    // you", not "no signal", and one forbidden key must not make a working
    // board look offline.
    if (res.status === 403) {
      setConnectionOk(true);
      return null;
    }
    if (!res.ok) throw new Error(`readKey ${key} failed: ${res.status}`);
    const { value } = await res.json();
    setConnectionOk(true);
    if (value == null) return null;
    if (Array.isArray(value)) {
      // Anything the server already has, identically, is no longer outstanding.
      reconcilePending(key, value);
      return mergePending(key, value);
    }
    return value;
  } catch (e) {
    console.error("readKey failed:", key, e);
    setConnectionOk(false);
    return READ_FAILED;
  }
}

async function readKey(key, fallback) {
  try {
    const res = await fetch(`${API_BASE}/api/board?key=${encodeURIComponent(key)}`);
    // Refused, not unreachable. The account list in particular is no longer
    // served through the board — it is credential material and now sits behind
    // its own administrator-only endpoint. A refusal means "nothing here for
    // you", not "no signal", and one forbidden key must not make a working
    // board look offline.
    if (res.status === 403) {
      setConnectionOk(true);
      return null;
    }
    if (!res.ok) throw new Error(`readKey ${key} failed: ${res.status}`);
    const { value } = await res.json();
    setConnectionOk(true);
    if (value == null) return fallback;
    // Anything this device is still holding is laid over the server's copy
    // before anyone reads it, so a mutation built on this read is built on
    // what the crew can actually see — not on a version of the call that has
    // forgotten the last three things they did.
    return Array.isArray(value) ? mergePending(key, value) : value;
  } catch (e) {
    console.error("readKey failed:", key, e);
    setConnectionOk(false);
    return fallback;
  }
}

// Whether the last attempt to reach the server worked. Read by the banner so a
// crew can see the state they are actually in rather than guessing from a
// screen that looks normal either way.
let connectionOk = true;
const connectionListeners = new Set();

// One failed request is not a lost signal. On a 3-second poll a single blip
// used to flip the banner to OFFLINE and the next poll flipped it straight back,
// so the thing meant to tell a crew where they stand was flickering at them
// instead. Coming back is instant — a request that succeeds means there is
// signal, full stop — but going offline needs a few failures in a row before we
// say so out loud.
const OFFLINE_STRIKES = 3;
// Set when the server answers and refuses, as opposed to not answering at all.
// The two look identical from behind a queue, and they need different words.
let lastWriteError = null;
let connectionStrikes = 0;

function setConnectionOk(ok) {
  if (ok) {
    connectionStrikes = 0;
  } else {
    connectionStrikes += 1;
    // Not enough failures yet to call it. Say nothing and wait.
    if (connectionStrikes < OFFLINE_STRIKES) return;
  }
  if (connectionOk === ok) return;
  connectionOk = ok;
  connectionListeners.forEach((fn) => {
    try {
      fn();
    } catch (e) {}
  });
}

function notifyPendingChanged() {
  connectionListeners.forEach((fn) => {
    try {
      fn();
    } catch (e) {}
  });
}

// Writes are retried once. An assignment is two of these in a row (the call,
// then the unit), and a single dropped write used to leave the desk showing a
// call as assigned while the crew's screen stayed silent. The retry closes most
// of that gap; liveRequestFor and the repair pass in loadAll cover the rest.
async function writeKey(key, value) {
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const res = await fetch(`${API_BASE}/api/board`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key, value }),
      });
      if (!res.ok) {
        // A rejection is not a lost signal, and must not be dressed up as one.
        // 413 in particular means the board outgrew the server's body limit:
        // the app would hold the records, merge them over the server's copy on
        // read, and show a screen that looked saved while nothing was. Say so
        // instead of quietly queueing forever.
        const err = new Error(`writeKey ${key} failed: ${res.status}`);
        err.httpStatus = res.status;
        throw err;
      }
      setConnectionOk(true);
      // A write that lands clears any standing refusal.
      if (lastWriteError) {
        lastWriteError = null;
        notifyPendingChanged();
      }
      return true;
    } catch (e) {
      console.error("writeKey failed:", key, e);
      // The server answered, and refused. Retrying an identical body will get
      // the identical refusal, so there is nothing to wait for.
      if (e && e.httpStatus) {
        lastWriteError = `The server refused to save (${e.httpStatus}). Nothing has been lost — it is held on this device — but it is not reaching the server.`;
        notifyPendingChanged();
        return false;
      }
      if (attempt === 0) await new Promise((r) => setTimeout(r, 400));
    }
  }
  lastWriteError = null;
  setConnectionOk(false);
  return false;
}

// Push everything this device is still holding back up to the server. Called on
// every poll: the moment there is signal again, the queue drains on its own
// without anybody having to remember to do anything.
//
// The held records are laid over the server's current copy rather than replacing
// it, so a call the desk changed while the crew was underground keeps that
// change, and the crew's stamps go on top of it.
async function pushPendingWrites() {
  if (!totalPendingCount()) return;
  for (const key of Object.keys(pendingWrites)) {
    const ids = Object.keys(pendingWrites[key] || {});
    if (!ids.length) continue;
    try {
      const res = await fetch(`${API_BASE}/api/board?key=${encodeURIComponent(key)}`);
      if (!res.ok) throw new Error(`replay read ${key} failed: ${res.status}`);
      const { value } = await res.json();
      const merged = mergePending(key, Array.isArray(value) ? value : []);
      const ok = await writeKey(key, merged);
      if (ok) {
        clearQueued(key, ids);
        notifyPendingChanged();
      } else {
        break;
      }
    } catch (e) {
      // Still no signal. Everything stays queued and the next poll tries again.
      setConnectionOk(false);
      break;
    }
  }
}

// While a write is in the air, the server's copy of that key is out of date by
// definition. The board polls every three seconds, so without this a crew's tap
// could be painted over by a read that started before their change landed — the
// stamp would appear, vanish, and the crew would tap again thinking it had not
// registered. That is exactly what was happening.
//
// A key is held from the moment a write starts until shortly after it finishes,
// and reads for a held key are ignored rather than applied.
const writesInFlight = new Map();
const WRITE_SETTLE_MS = 1500;

function markWriteStarted(key) {
  writesInFlight.set(key, { started: Date.now(), done: 0 });
}

function markWriteFinished(key) {
  const e = writesInFlight.get(key);
  if (e) e.done = Date.now();
}

function writeInFlight(key) {
  const e = writesInFlight.get(key);
  if (!e) return false;
  if (!e.done) return true;
  if (Date.now() - e.done < WRITE_SETTLE_MS) return true;
  writesInFlight.delete(key);
  return false;
}

// The write every board change goes through. If it lands, nothing is held. If
// it doesn't, the records that changed are kept on the device and replayed
// later — which is the whole difference between a crew losing a call's times
// underground and not losing them.
async function writeList(key, next, prev) {
  markWriteStarted(key);
  try {
    return await writeListInner(key, next, prev);
  } finally {
    markWriteFinished(key);
  }
}

async function writeListInner(key, next, prev) {
  const ok = await writeKey(key, next);
  if (ok) {
    // Anything we were holding for these records has now gone up with this
    // write, so it is no longer outstanding.
    const ids = (next || []).filter((x) => x && x.id).map((x) => x.id);
    if (pendingCountFor(key)) {
      clearQueued(key, ids);
      notifyPendingChanged();
    }
    return true;
  }
  const changed = changedRecords(next, prev);
  if (Object.keys(changed).length) {
    queueRecords(key, changed);
    notifyPendingChanged();
  }
  return false;
}

// ---------- keeping the live board small ----------
//
// Every change sends the whole board back to the server. A crew tapping
// "arrival at scene" re-uploads every call, every log line, every escalation the
// department has ever recorded. That is why the writes started failing: the
// board had quietly grown past what the server would accept. Raising the limit
// bought room, it did not fix the shape of the problem — left alone the board
// grows forever and the same failure comes back, slower and harder to spot.
//
// A completed call whose shift has been submitted and finalised is already kept
// in the archive. Holding a second copy on the live board buys nothing and costs
// something on every write from then on. So after a few shifts it comes off, and
// the archive is where it lives.
//
// Measured in shifts rather than days, because that is the unit the department
// actually works in: four shifts is the last two days, so yesterday's work is
// always still on the board.
const PRUNE_KEEP_SHIFTS = 4;

function pruneCutoff(now) {
  // The start of the window PRUNE_KEEP_SHIFTS ago. Anything whose shift ended
  // before this is old enough to live in the archive alone.
  return shiftWindowAt(now).start - PRUNE_KEEP_SHIFTS * SHIFT_MS;
}

// A call may only be dropped when all of this is true. Age on its own is never
// enough — the test is whether a copy is demonstrably safe somewhere else.
function isSafeToPrune(req, submissions, cutoff) {
  if (!req || !req.id) return false;
  if (req.status !== "completed") return false;
  if (!req.createdAt || req.createdAt >= cutoff) return false;
  // Its shift must have been submitted, that submission must have completed,
  // and the call itself must actually be inside it. Verified against the stored
  // copy, not assumed from dates.
  return (submissions || []).some(
    (s) =>
      s &&
      s.status === "final" &&
      s.station === stationOf(req) &&
      req.createdAt >= s.windowStart &&
      req.createdAt < s.windowEnd &&
      Array.isArray(s.requests) &&
      s.requests.some((r) => r && r.id === req.id)
  );
}

// Log lines follow the calls: kept once they are inside a finalised submission,
// then trimmed. The live log was already capped at 400 and silently discarding
// the oldest, so this loses nothing that was not being lost already — the
// difference is that now the discarded lines are in the archive first.
function isSafeToPruneLog(entry, submissions, cutoff) {
  if (!entry || !entry.ts || entry.ts >= cutoff) return false;
  return (submissions || []).some(
    (s) =>
      s &&
      s.status === "final" &&
      entry.ts >= s.windowStart &&
      entry.ts < s.windowEnd &&
      s.station === stationOf(entry) &&
      Array.isArray(s.log) &&
      s.log.some((l) => l && l.id === entry.id)
  );
}

async function pruneArchivedWork({ requests, log, submissions, now }) {
  const cutoff = pruneCutoff(now);
  const keepRequests = (requests || []).filter((r) => !isSafeToPrune(r, submissions, cutoff));
  const keepLog = (log || []).filter((e) => !isSafeToPruneLog(e, submissions, cutoff));

  const droppedRequests = (requests || []).length - keepRequests.length;
  const droppedLog = (log || []).length - keepLog.length;
  if (!droppedRequests && !droppedLog) return { droppedRequests: 0, droppedLog: 0 };

  if (droppedRequests) {
    const ok = await writeKey("ems:requests", keepRequests);
    if (!ok) return { droppedRequests: 0, droppedLog: 0 };
  }
  if (droppedLog) await writeKey("ems:log", keepLog);
  return { droppedRequests, droppedLog };
}

// ---------- relieving a crew who are still out ----------
//
// A night crew whose last call runs past 07:00 are on overtime, on the road,
// with a patient in the back. The day crew arriving to take their seat had only
// one way in: take it. That stood the night crew down where they sat — their
// overtime stopped being counted at the moment of takeover rather than when they
// actually cleared, the running call lost its crew of record halfway through,
// and the board showed the truck freshly crewed and available while it was
// physically still out.
//
// A handover is not instantaneous. It happens when the truck comes back. So the
// relief is queued: the incoming crew are on duty and recorded from the moment
// they sign on, the outgoing crew keep the seat and keep accruing overtime until
// they close the call and sign out, and the seat transfers itself at that
// moment. Nobody has to remember.
//
// The other case is not overtime at all: somebody simply forgot to sign out and
// went home. There is nothing to wait for there, and waiting would hold a seat
// open all day — so that one is a straight takeover, and administration can
// clear it too.
function seatOccupantIsWorking(unit, requests) {
  // Genuinely still out: the unit has a call that has not finished.
  return !!liveRequestFor(unit, requests);
}

function seatShiftIsOver(member, now) {
  return !!(member && member.shiftEnd && now >= member.shiftEnd);
}

// Which of the two situations this is.
function reliefSituationFor(unit, slot, requests, now) {
  const member = unit ? unit[slot] : null;
  if (!member) return "free";
  if (seatOccupantIsWorking(unit, requests)) return "still-out";
  if (seatShiftIsOver(member, now)) return "forgot-to-sign-out";
  return "on-shift";
}

function queuedReliefFor(unit, slot) {
  const r = unit && unit.relief ? unit.relief[slot] : null;
  return r && r.accountId ? r : null;
}

// ---------- what the sheet still needs ----------
//
// A call going back in service is not the same as its record being finished. The
// category gets argued over at the destination, the kilometres are read when the
// truck parks, the MRN turns up later. Left alone these gaps are only discovered
// at the end of the month, by somebody reading 400 rows looking for blanks.
//
// So the desk is told while the shift is still in living memory: which calls are
// short, and of what.
const LOG_COMPLETENESS = [
  { key: "patientOrigin", label: "where the patient came from", has: (r) => !!r.patientOrigin },
  { key: "locationTo", label: "destination", has: (r) => !!callTo(r) },
  { key: "mrn", label: "MRN", has: (r) => !!(r.mrn && String(r.mrn).trim()) },
  { key: "callType", label: "cat. of call", has: (r) => !!callTypeOf(r) },
  { key: "callCategory", label: "call category", has: (r) => !!r.callCategory },
  { key: "loadedKm", label: "kilometre band", has: (r) => !!loadedKmOf(r) },
  {
    key: "receiver",
    label: "who received the patient",
    // Only asked of a call where somebody was actually handed over.
    applies: (r) => !isNoTransport(r) && !!(r.times || {}).arrivalDestination,
    has: (r) => !!(r.receiver && r.receiver.name),
  },
];

function missingLogFields(req) {
  if (!req || req.status !== "completed") return [];
  return LOG_COMPLETENESS.filter((f) => (!f.applies || f.applies(req)) && !f.has(req));
}

function callsNeedingDetail(requests) {
  return (requests || [])
    .filter((r) => r.status === "completed" && missingLogFields(r).length)
    .sort((a, b) => b.createdAt - a.createdAt);
}

// ---------- the daily vehicle checklist ----------
//
// Two lists, because two people check two different things: the medic goes
// through the clinical kit, the EMT goes through the vehicle. They are checked
// once a day, per truck, by whoever is in that seat — and the answer to each
// item is one of three, not a tick. "Not complete" is the one that matters:
// a tick box forces a half-restocked bag to be called either fine or broken,
// and crews will always pick fine.
//
// The items themselves are set by administration rather than written into the
// code, because the kit changes and nobody should need a new build for it.
const CHECKLIST_KEY = "ems:checklists";
const CHECKLIST_RUNS_KEY = "ems:checklistRuns";
const CHECKLIST_RUNS_CAP = 2000;

const CHECKLIST_PARTS = [
  { key: "medic", label: "Medic checklist", seat: "alpha", who: "Medic (Alpha)" },
  { key: "emt", label: "EMT checklist", seat: "bravo", who: "EMT (Bravo)" },
];

const CHECK_ANSWERS = [
  { key: "available", label: "Available", color: "#3DDC97" },
  { key: "unavailable", label: "Not available", color: "#FF4D5E" },
  { key: "incomplete", label: "Not complete", color: "#FFB020" },
];

function checklistPartForSeat(seat) {
  return CHECKLIST_PARTS.find((p) => p.seat === seat) || CHECKLIST_PARTS[0];
}

function emptyChecklists() {
  return { medic: [], emt: [] };
}

// One run per truck, per list, per operational day. A crew coming on at 19:00
// does not repeat the morning's check of the same vehicle — it is a daily check
// of a vehicle, not a per-shift ritual.
function checklistRunFor(runs, unitId, part, dayKey) {
  return (runs || []).find(
    (r) => r && r.unitId === unitId && r.part === part && r.dayKey === dayKey
  ) || null;
}

// Anything a crew flagged. This is the reason the whole thing exists: a list
// where everything was fine tells nobody anything, and the exceptions are what
// somebody has to act on.
function checklistFlags(run, items) {
  if (!run) return [];
  return (items || [])
    .filter((it) => run.answers && run.answers[it.id] && run.answers[it.id] !== "available")
    .map((it) => ({ item: it, answer: run.answers[it.id] }));
}

// ---------- no coverage ----------
//
// The station has nothing left to send: every truck is out with a patient. It is
// a state of the station rather than a call, and it is the single most important
// thing the department has to be able to evidence — how long, how often, and
// when. Until now it lived in somebody's memory of a bad Tuesday.
//
// Zahrawi is excluded from the test. It runs its own service and its
// availability does not mean the main fleet can answer a call.
//
// It is declared by the desk, because the desk is the one who knows a call is
// waiting and nothing is free. It ends on its own the moment any team is back in
// service — nobody has to remember to press it again, which is exactly the
// moment nobody would.
const COVERAGE_KEY = "ems:coverage";
const COVERAGE_CAP = 500;

function isZahrawi(unit) {
  return /ZAHRAWI|^ZAH$/i.test((unit && unit.name) || "");
}

// The units that count towards coverage at a station.
function coverageUnits(units, station) {
  return (units || []).filter((u) => stationOf(u) === station && !isZahrawi(u) && isStaffed(u));
}

// Is any of them free to take a call?
function stationHasCoverage(units, requests, station) {
  const fleet = coverageUnits(units, station);
  if (!fleet.length) return false;
  return fleet.some((u) => !liveRequestFor(u, requests));
}

function openCoverageGap(list, station) {
  return (list || []).find((c) => c && c.station === station && !c.endedAt) || null;
}

async function startCoverageGap({ station, by, units, requests, list, addLog }) {
  const existing = (await readKey(COVERAGE_KEY, list)) || [];
  if (openCoverageGap(existing, station)) return false;
  const entry = {
    id: uid("cov"),
    station,
    startedAt: Date.now(),
    startedBy: by || "Dispatch",
    // What the board looked like when it was declared, so the record can be read
    // back without having to reconstruct it.
    unitsOut: coverageUnits(units, station).map((u) => u.name),
    endedAt: null,
    endedBy: null,
  };
  const next = [entry, ...existing].slice(0, COVERAGE_CAP);
  const ok = await writeKey(COVERAGE_KEY, next);
  if (!ok) return false;
  await addLog(
    `NO COVERAGE declared at ${stationLabel(station)} by ${by || "Dispatch"} — ` +
      `${entry.unitsOut.length} team${entry.unitsOut.length === 1 ? "" : "s"} out with patients` +
      (entry.unitsOut.length ? ` (${entry.unitsOut.join(", ")})` : ""),
    "status"
  );
  return true;
}

// Opened by the board as well as closed by it.
//
// Asking the desk to press a button at the exact moment the last ambulance goes
// out gets the record wrong in both directions: it is missed entirely on the
// busiest nights, when the desk has a phone in each hand, and it starts late
// even when it is remembered. The board already knows the moment it becomes
// true — every staffed team out with a patient, Zahrawi aside — so it says so
// itself, and the desk is told rather than asked.
async function openCoverageGapIfStuck({ units, requests, list, addLog }) {
  const byStation = STATIONS.map((st) => st.key);
  let opened = 0;
  for (const station of byStation) {
    const fleet = coverageUnits(units, station);
    // A station with nobody signed on is not "without coverage" — it is closed.
    // Recording a gap for it every night would bury the real ones.
    if (!fleet.length) continue;
    if (stationHasCoverage(units, requests, station)) continue;
    const existing = (await readKey(COVERAGE_KEY, list)) || [];
    if (openCoverageGap(existing, station)) continue;
    const entry = {
      id: uid("cov"),
      station,
      startedAt: Date.now(),
      startedBy: "Detected automatically",
      auto: true,
      unitsOut: fleet.map((u) => u.name),
      endedAt: null,
      endedBy: null,
    };
    const ok = await writeKey(COVERAGE_KEY, [entry, ...existing].slice(0, COVERAGE_CAP));
    if (!ok) continue;
    opened += 1;
    await addLog(
      `NO COVERAGE at ${stationLabel(station)} — every team is out with a patient ` +
        `(${entry.unitsOut.join(", ")})`,
      "status"
    );
  }
  return opened;
}

// Closed by the board, not by a person: the first team back in service ends it.
async function closeCoverageGapIfClear({ units, requests, list, addLog }) {
  const existing = (await readKey(COVERAGE_KEY, list)) || [];
  const open = existing.filter((c) => c && !c.endedAt);
  if (!open.length) return 0;
  const now = Date.now();
  let closed = 0;
  const next = existing.map((c) => {
    if (!c || c.endedAt) return c;
    if (!stationHasCoverage(units, requests, c.station)) return c;
    closed += 1;
    return { ...c, endedAt: now, endedBy: "First team back in service" };
  });
  if (!closed) return 0;
  await writeKey(COVERAGE_KEY, next);
  for (const c of next.filter((x) => x && x.endedAt === now)) {
    await addLog(
      `Coverage restored at ${stationLabel(c.station)} after ` +
        `${msDurationStr(c.endedAt - c.startedAt)} with no ambulance available`,
      "status"
    );
  }
  return closed;
}

// The gaps that fall inside a window, for the sheet.
function coverageGapsIn(list, station, from, to) {
  return (list || [])
    .filter((c) => c && c.station === station && c.startedAt >= from && c.startedAt < to)
    .sort((a, b) => a.startedAt - b.startedAt);
}

// ---------- submitting a shift's log ----------
//
// The desk submits its own log at the end of its own shift. Two submissions make
// a day: the day shift's and the night shift's, filed under the same operational
// date, and each station files separately — so 6 August holds up to four, one
// per shift per station.
//
// A submission is not always finished when it is made. A call raised at 06:30
// that is still running at 07:00 belongs to the shift that took it, but its
// remaining times and the crew's overtime are not known yet. So the desk submits
// and goes home; the submission stays open in the background and completes
// itself once that call is closed and its crew has signed out. Nobody has to
// come back and do anything.
const SUBMISSION_KEY = "ems:submissions";
const SUBMISSION_CAP = 600;

function submissionId(dayStart, shiftKey, station) {
  return `${opDayKey(dayStart)}::${shiftKey}::${station}`;
}

// Every call this desk's shift is answerable for: raised inside the shift
// window, at this station. A call belongs to the shift that took it, not the
// one that happened to be on when it finished.
function requestsForShift(requests, station, windowStart, windowEnd) {
  return (requests || []).filter(
    (r) =>
      stationOf(r) === station &&
      r.createdAt >= windowStart &&
      r.createdAt < windowEnd
  );
}

function logForShift(log, station, windowStart, windowEnd) {
  return (log || []).filter(
    (e) => e && e.ts >= windowStart && e.ts < windowEnd && stationOf(e) === station
  );
}

// What is still outstanding on a submission: calls not closed, and crews from
// those calls not yet signed out. While either is true the submission is held
// open and its overtime is not final.
function submissionOutstanding(sub, requests, units) {
  const ids = new Set((sub.requestIds || []));
  const openCalls = (requests || []).filter((r) => ids.has(r.id) && r.status !== "completed");
  const crewStillOn = (units || []).filter(
    (u) => stationOf(u) === sub.station && (u.alpha || u.bravo)
  );
  return { openCalls, crewStillOn };
}

// The desk submitting its shift. Safe to press with a call still running: what
// is known now is filed, and what is not yet known is marked as still open. The
// background pass below finishes it off later.
async function submitShiftLog({ requests, units, log, scheduled, station, windowStart, windowEnd, shiftKey, by, coverageList }) {
  const all = (await readKey(SUBMISSION_KEY, [])) || [];
  const dayStart = opDayStart(windowStart);
  const id = submissionId(dayStart, shiftKey, station);
  if (all.some((s) => s && s.id === id)) return { ok: false, reason: "already" };

  const mine = requestsForShift(requests, station, windowStart, windowEnd);
  const openIds = mine.filter((r) => r.status !== "completed").map((r) => r.id);

  const entry = {
    id,
    dayKey: opDayKey(dayStart),
    dayStart,
    dayLabel: opDayLabel(dayStart),
    shiftKey,
    shiftLabel: SHIFTS[shiftKey] ? SHIFTS[shiftKey].label : shiftKey,
    station,
    windowStart,
    windowEnd,
    submittedAt: Date.now(),
    submittedBy: by || "",
    // Open until every call it covers is closed and the crews are off.
    status: openIds.length ? "open" : "final",
    requestIds: mine.map((r) => r.id),
    openRequestIds: openIds,
    // The snapshot as submitted. The live record is preferred on download when
    // it has moved on, and the sheet says so.
    requests: mine.map((r) => ({ ...r })),
    log: logForShift(log, station, windowStart, windowEnd),
    scheduled: (scheduled || []).filter(
      (s) => s && stationOf(s) === station && s.scheduledFor >= windowStart && s.scheduledFor < windowEnd
    ),
    units: (units || []).filter((u) => stationOf(u) === station).map((u) => ({ ...u })),
    // The gaps that happened on this shift travel with it, so a submitted log
    // carries its own evidence rather than depending on a live list.
    coverage: coverageGapsIn(coverageList, station, windowStart, windowEnd),
    callCount: mine.length,
  };

  const next = [entry, ...all].slice(0, SUBMISSION_CAP);
  const ok = await writeKey(SUBMISSION_KEY, next);
  return { ok, entry, openCount: openIds.length };
}

// Finishing off submissions that were filed with a call still running. Runs in
// the background on any desk or admin board: once the last call is closed and
// the station's crews are signed out, the submission is completed — its calls
// refreshed to their final times and the overtime that was still accruing when
// it was submitted now counted.
// A shift filed by hand before its window closed still has to take whatever the
// rest of the window brings. Without this, a desk that submitted at 16:00
// because it looked finished would leave every later call off the sheet — and
// nobody would notice until the month was counted.
async function amendSubmissionsWithLateCalls({ requests, log }) {
  const all = (await readKey(SUBMISSION_KEY, [])) || [];
  if (!all.length) return 0;
  let changed = 0;
  const next = all.map((sub) => {
    if (!sub) return sub;
    const known = new Set(sub.requestIds || []);
    const late = requestsForShift(requests, sub.station, sub.windowStart, sub.windowEnd)
      .filter((r) => !known.has(r.id));
    if (!late.length) return sub;
    changed += 1;
    const merged = [...(sub.requests || []), ...late.map((r) => ({ ...r }))];
    const stillOpen = merged.filter((r) => r.status !== "completed").map((r) => r.id);
    return {
      ...sub,
      requestIds: merged.map((r) => r.id),
      requests: merged,
      openRequestIds: stillOpen,
      // Taking on a call that has not finished re-opens the submission, so the
      // overtime is counted when it does.
      status: stillOpen.length ? "open" : sub.status,
      callCount: merged.length,
      log: logForShift(log, sub.station, sub.windowStart, Date.now()),
      amendedAt: Date.now(),
      amendedCount: (sub.amendedCount || 0) + late.length,
    };
  });
  if (!changed) return 0;
  await writeKey(SUBMISSION_KEY, next);
  return changed;
}

async function finaliseOpenSubmissions({ requests, units, log, boardId }) {
  const all = (await readKey(SUBMISSION_KEY, [])) || [];
  const open = all.filter((s) => s && s.status === "open");
  if (!open.length) return 0;

  let changed = 0;
  const next = all.map((s) => {
    if (!s || s.status !== "open") return s;
    const { openCalls, crewStillOn } = submissionOutstanding(s, requests, units);
    if (openCalls.length || crewStillOn.length) return s;
    changed += 1;
    const byId = new Map((requests || []).map((r) => [r.id, r]));
    return {
      ...s,
      status: "final",
      finalisedAt: Date.now(),
      finalisedBy: boardId,
      openRequestIds: [],
      requests: (s.requestIds || []).map((id) => {
        const live = byId.get(id);
        return live ? { ...live } : (s.requests || []).find((r) => r.id === id);
      }).filter(Boolean),
      // The log is re-cut at completion so the closing stamps and the sign-outs
      // that happened after submission are in the record too.
      log: logForShift(log, s.station, s.windowStart, Date.now()),
    };
  });

  if (!changed) return 0;
  await writeKey(SUBMISSION_KEY, next);
  return changed;
}

// ---------- the operational day ----------
//
// A day here is not midnight to midnight. It runs 07:00 to 07:00: the day shift
// and the night shift that follows it are one working day, and a call taken at
// 02:00 belongs to the day that started the evening before. This is already how
// shift dates are filed on the sheet, so the archive uses the same boundary
// rather than inventing a second idea of what "6 August" means.
const OP_DAY_START_HOUR = 7;
const ARCHIVE_KEY = "ems:archives";
// Archives are the permanent record, so the cap is generous. Roughly a year of
// days: old ones fall off the end rather than growing without limit.
const ARCHIVE_CAP = 400;

function opDayStart(ts) {
  const d = new Date(ts);
  const start = new Date(d);
  start.setHours(OP_DAY_START_HOUR, 0, 0, 0);
  // Before 07:00 we are still inside the day that began yesterday morning.
  if (d.getHours() < OP_DAY_START_HOUR) start.setDate(start.getDate() - 1);
  return start.getTime();
}

function opDayEnd(startTs) {
  const d = new Date(startTs);
  d.setDate(d.getDate() + 1);
  return d.getTime();
}

// A stable key for a day, independent of how dates are displayed.
function opDayKey(startTs) {
  const d = new Date(startTs);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function opDayLabel(startTs) {
  return gregDateStr(startTs);
}

// A call belongs to the day it was raised on. Not the day it finished: a call
// dispatched at 06:30 and cleared at 08:15 was that night's call, and moving it
// into the next day would leave a hole where it happened and count it twice
// across the two days' figures.
function callOpDayStart(r) {
  return r && r.createdAt ? opDayStart(r.createdAt) : null;
}

function requestsForOpDay(requests, dayStart) {
  return (requests || []).filter((r) => callOpDayStart(r) === dayStart);
}

function logForOpDay(log, dayStart) {
  const end = opDayEnd(dayStart);
  return (log || []).filter((e) => e && e.ts >= dayStart && e.ts < end);
}

// Is there anything still running from that day? Used only for the early close —
// the clock closes the day either way.
function opDayIsQuiet(requests, units, dayStart) {
  const stillOpen = requestsForOpDay(requests, dayStart).some((r) => r.status !== "completed");
  if (stillOpen) return false;
  // Nobody still signed on anywhere. A crew who has not signed out is still on
  // duty as far as the board is concerned.
  const anyoneOn = (units || []).some((u) => u && (u.alpha || u.bravo));
  return !anyoneOn;
}

// Close a day and keep it. What is stored is the data the sheet is built from,
// not a spreadsheet file: the workbook is generated when somebody downloads it,
// so an archive from March still comes out in whatever format the sheet has
// today rather than being frozen in the format it had then.
//
// Two desks can be open at 07:00, so the day is claimed the same way a booking
// release is: write it with this board's id, read it back, and only the board
// whose id survived is the one that wrote it. The loser leaves it alone.
async function archiveOpDay({ dayStart, requests, units, log, scheduled, closedBy, reason, boardId }) {
  const existing = (await readKey(ARCHIVE_KEY, [])) || [];
  const key = opDayKey(dayStart);
  if (existing.some((a) => a && a.dayKey === key)) return false;

  const dayRequests = requestsForOpDay(requests, dayStart);
  const entry = {
    id: uid("arch"),
    dayKey: key,
    dayStart,
    dayEnd: opDayEnd(dayStart),
    closedAt: Date.now(),
    closedBy: closedBy || "",
    reason: reason || "clock",
    claimId: boardId,
    // A call that was still running when the day closed is kept as it stood and
    // said so on the sheet. Its remaining times are picked up on download.
    requests: dayRequests.map((r) => ({ ...r, openAtClose: r.status !== "completed" })),
    log: logForOpDay(log, dayStart),
    scheduled: (scheduled || []).filter((s) => s && s.scheduledFor && opDayStart(s.scheduledFor) === dayStart),
    // The rosters as they stood, so the name stamps on the sheet still resolve
    // years later even if a medic has since been renamed or retired.
    units: (units || []).map((u) => ({ ...u })),
    counts: STATIONS.reduce((acc, st) => {
      acc[st.key] = dayRequests.filter((r) => stationOf(r) === st.key).length;
      return acc;
    }, {}),
  };

  const next = [entry, ...existing].slice(0, ARCHIVE_CAP);
  const ok = await writeKey(ARCHIVE_KEY, next);
  if (!ok) return false;

  // Read back and see whose claim survived.
  const after = (await readKey(ARCHIVE_KEY, [])) || [];
  const mine = after.find((a) => a && a.dayKey === key);
  return !!(mine && mine.claimId === boardId);
}

// Which days are finished but not yet kept. Normally none or one; more than one
// only if no desk was open for a few days, in which case they are all caught up
// at once rather than quietly skipped.
function unarchivedOpDays(requests, archives, now) {
  const today = opDayStart(now);
  const have = new Set((archives || []).map((a) => a && a.dayKey));
  const days = new Set();
  (requests || []).forEach((r) => {
    const d = callOpDayStart(r);
    // Only days that are actually over. The day in progress is not archived.
    if (d && d < today && !have.has(opDayKey(d))) days.add(d);
  });
  return Array.from(days).sort((a, b) => a - b);
}

// ---------- session (survives a page refresh) ----------
//
// Who is signed in used to live only in React state, so a refresh — or a
// tablet reloading itself after being locked — dropped whoever was working the
// board back to the sign-in screen and made a crew member re-take their seat.
// The session is kept in localStorage instead and restored on load. It is only
// a record of who this device is; every fact about the shift still comes from
// the board, and the checks further down still sign you out for real if your
// account was removed or someone else took your seat.
const SESSION_KEY = "ems:session";
// Bumped to 2 when stations were introduced. A session saved before that has no
// station on it, and a missing station silently reads as the Main Office — so a
// CCC dispatcher carrying an old session would have been shown the Main Office's
// board, and exported the Main Office's log, while believing they were on CCC.
// Raising the version retires those sessions: everyone signs in once more and
// says which station they are working.
const SESSION_VERSION = 2;

function readSession() {
  try {
    const raw = window.localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const saved = JSON.parse(raw);
    if (!saved || saved.v !== SESSION_VERSION || !saved.user || !saved.user.role) return null;
    // Admins work across both stations and never pick one. Everybody else must
    // have one, or the board they are shown is a guess.
    if (saved.user.role !== "admin" && !saved.user.station) return null;
    return saved;
  } catch (e) {
    return null;
  }
}

function writeSession(session) {
  try {
    window.localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  } catch (e) {
    // private browsing or a full quota: the session just won't survive a refresh
  }
}

function patchSession(patch) {
  const current = readSession();
  if (!current) return;
  writeSession({ ...current, ...patch });
}

function clearSession() {
  try {
    window.localStorage.removeItem(SESSION_KEY);
  } catch (e) {
    // ignore
  }
}

// ---------- how loud this device is allowed to be ----------
//
// Web Audio does not answer to the device's silent switch. A tablet with the
// ringer off, a phone on vibrate, a laptop whose volume keys have been held
// down — none of them stop an AudioContext, so the board was the one thing in
// the room that could not be quietened, and the only way to stop it making a
// noise was to close it. On a crew tablet waiting for a call that is the whole
// point. On the fourth screen in a control room where two others are already
// alerting, on a supervisor's phone, or on a desk that is being used to write
// up yesterday's log, it is noise nobody asked for.
//
// So loudness is a property of this device, kept next to the session in
// localStorage rather than on the board: two people signed in on two tablets
// have two different speakers and only one of them may need to be quiet. It is
// read at the moment each note is scheduled, so a change takes hold on the very
// next tone without a reload and without anything being re-armed.
//
// Silencing only ever silences the *tone*. The full-screen alarm, the vibration
// and the system notification are untouched — a call still arrives, it just
// arrives quietly — and every screen that can be silenced says so in plain
// sight while it is, because a board that is quiet by accident and a board that
// is quiet on purpose must never look the same.
const SOUND_KEY = "ems:sound";

const SOUND_LEVELS = [
  { key: "full", label: "FULL", short: "FULL", gain: 1, note: "as loud as this board gets" },
  { key: "medium", label: "MEDIUM", short: "MED", gain: 0.55, note: "half volume" },
  { key: "low", label: "LOW", short: "LOW", gain: 0.25, note: "quiet — for a room that is already loud enough" },
  { key: "off", label: "SILENT", short: "MUTED", gain: 0, note: "no tone at all from this device" },
];

const DEFAULT_SOUND_LEVEL = "full";

function soundLevelMeta(key) {
  return SOUND_LEVELS.find((l) => l.key === key) || SOUND_LEVELS[0];
}

// Read once at load and then held here, because the tone scheduler is plain
// functions rather than components and has no props to read a setting from.
let soundLevelKey = (function readSoundLevel() {
  try {
    const saved = window.localStorage.getItem(SOUND_KEY);
    if (saved && SOUND_LEVELS.some((l) => l.key === saved)) return saved;
  } catch (e) {
    // private browsing: the default stands for this session
  }
  return DEFAULT_SOUND_LEVEL;
})();

// Anything on screen that shows the current level subscribes, so switching it
// in the header updates the crew's silenced warning and the tone-check row in
// the same paint rather than on the next tick of the clock.
const soundLevelListeners = new Set();

function getSoundLevel() {
  return soundLevelKey;
}

function soundGain() {
  return soundLevelMeta(soundLevelKey).gain;
}

function soundSilenced() {
  return soundGain() <= 0;
}

function setSoundLevel(key) {
  const meta = soundLevelMeta(key);
  soundLevelKey = meta.key;
  try {
    window.localStorage.setItem(SOUND_KEY, meta.key);
  } catch (e) {
    // the choice still holds for this session, it just won't survive a reload
  }
  soundLevelListeners.forEach((fn) => {
    try {
      fn(meta.key);
    } catch (e) {
      // a listener that has gone away must not stop the others hearing it
    }
  });
}

function useSoundLevel() {
  const [level, setLevel] = useState(getSoundLevel);
  useEffect(() => {
    soundLevelListeners.add(setLevel);
    return () => {
      soundLevelListeners.delete(setLevel);
    };
  }, []);
  return level;
}

const REQUIREMENTS = [

  { key: "suction", label: "Portable Suction" },
  { key: "oxygen", label: "Oxygen" },
  { key: "other", label: "Other" },
];

// "Other" is a free-text requirement: the tick puts it on the call, the text
// says what it actually is. Everywhere requirements are shown or exported we
// want the typed text rather than the bare word "Other", so the labels are
// built in one place instead of five.
function reqLabels(req) {
  const keys = (req && req.requirements) || [];
  return keys.map((k) => {
    const meta = REQUIREMENTS.find((r) => r.key === k);
    const label = meta ? meta.label : k;
    if (k === "other") {
      const txt = (req && req.reqOther ? String(req.reqOther) : "").trim();
      return txt ? `Other: ${txt}` : label;
    }
    return label;
  });
}

// The details on a call that can be corrected after it has gone out. Dispatch
// often has to raise a call on what it is told down a phone, so the MRN can be
// missing and a ward or a nature can be wrong. The desk can correct these
// itself; a crew who finds the call is wrong at the bedside can only *propose*
// the correction, and it stays proposed until the desk verifies it. Every
// change carries the name of who made it and when.
// Everything on a call that can still be put right afterwards.
//
// A call does not stop being wrong when it goes back in service. The category is
// argued over at the destination, the kilometres are read off the truck when it
// parks, and the MRN turns up on a wristband nobody could reach earlier. Making
// the record final at "back in service" only meant the sheet kept the version
// that happened to be typed while the ambulance was moving.
//
// The rule does not change with the call closing: the desk's own corrections
// land straight away, a crew's are proposed and wait for the desk. What changes
// is that the closed call is still open to being corrected at all.
//
// Fields with a list are edited against that list, so a correction cannot put a
// word in the column that the sheet has no place for.
const EDITABLE_FIELDS = [
  { key: "locationFrom", label: "From" },
  { key: "locationTo", label: "To" },
  { key: "nature", label: "Nature of call" },
  { key: "mrn", label: "Patient MRN" },
  { key: "patientOrigin", label: "Where the patient came from", options: () => PATIENT_ORIGINS },
  { key: "callCategory", label: "Call category", options: () => CALL_CATEGORIES },
  { key: "emergencyCode", label: "Codes and emergencies", options: () => EMERGENCY_CODES },
  {
    key: "callType",
    label: "Cat. of call",
    options: () => CALL_TYPES.map((t) => t.key),
    display: (v) => {
      const t = CALL_TYPES.find((x) => x.key === v);
      return t ? `${t.key} — ${t.name}` : v;
    },
  },
  {
    key: "loadedKm",
    label: "Kilometre band",
    options: () => LOADED_KM.map((b) => b.key),
    display: (v) => {
      const b = LOADED_KM.find((x) => x.key === v);
      return b ? `${b.key} — ${b.name}` : v;
    },
  },
  { key: "addedService", label: "Added service", options: () => ADDED_SERVICES },
];

function editFieldLabel(key) {
  const f = EDITABLE_FIELDS.find((x) => x.key === key);
  return f ? f.label : key;
}

// A blank value should read as blank rather than as the word "undefined" —
// a missing MRN is the ordinary case, not an error.
function editValueText(v, field) {
  const t = (v === null || v === undefined ? "" : String(v)).trim();
  if (!t) return "—";
  const f = field ? EDITABLE_FIELDS.find((x) => x.key === field) : null;
  return f && f.display ? f.display(t) : t;
}

function callEdits(req) {
  return (req && Array.isArray(req.edits) ? req.edits : []);
}

function pendingCallEdits(req) {
  return callEdits(req).filter((e) => e.status === "pending");
}

// Every call anywhere in the system that still has a correction waiting on the
// desk. A crew can report a wrong MRN and be back in service two minutes later,
// which takes the call off the active board — the report has to keep surfacing
// somewhere or the correction is lost with it.
function callsAwaitingEditVerify(requests) {
  return (requests || [])
    .filter((r) => pendingCallEdits(r).length > 0)
    .sort((a, b) => b.createdAt - a.createdAt);
}

function pendingCallEditCount(requests) {
  return (requests || []).reduce((n, r) => n + pendingCallEdits(r).length, 0);
}

// Can this viewer report a correction on this call? The same rule escalations
// use: the crew who ran it, or a crew who assisted on it. It deliberately does
// not care whether the call is still open — a crew who only realises the MRN
// was wrong after they are back in service still needs a way to say so.
function canProposeEditOn(req, viewer) {
  if (!req || !viewer || viewer.role !== "team" || !viewer.unitId) return false;
  return req.assignedUnitId === viewer.unitId || isAssistingUnit(req, viewer.unitId);
}

// The three ways a correction can move, written once and shared, so a call
// corrected from the history list behaves exactly like one corrected while it
// is still running.
async function applyCallEditsTo({ req, changes, note, who, requests, saveRequests, addLog }) {
  if (!req || !changes || !changes.length) return false;
  const now = Date.now();
  const entries = changes.map((c) => ({
    id: uid("edit"),
    field: c.field,
    from: c.from,
    to: c.to,
    by: who || "Dispatch",
    byRole: "dispatcher",
    at: now,
    note: note || "",
    status: "applied",
    verifiedBy: who || "Dispatch",
    verifiedAt: now,
  }));
  const fresh = await readKey("ems:requests", requests);
  const next = fresh.map((r) => {
    if (r.id !== req.id) return r;
    const patched = { ...r, edits: [...callEdits(r), ...entries] };
    changes.forEach((c) => {
      patched[c.field] = c.to;
    });
    if (changes.some((c) => c.field === "locationFrom")) patched.location = patched.locationFrom;
    return patched;
  });
  await saveRequests(next);
  await addLog(
    `DISPATCH (${who || "Dispatch"}) changed call information — ` +
      entries.map((e) => `${editFieldLabel(e.field)}: ${editValueText(e.from, e.field)} → ${editValueText(e.to, e.field)}`).join("; ") +
      ` — ${req.nature}` +
      (note ? ` (${note})` : ""),
    "status"
  );
  return true;
}

async function proposeCallEditsTo({ req, changes, note, viewer, requests, saveRequests, addLog }) {
  if (!req || !changes || !changes.length || !viewer) return false;
  const now = Date.now();
  const who = viewer.name || viewer.unitName || "Crew";
  const entries = changes.map((c) => ({
    id: uid("edit"),
    field: c.field,
    from: c.from,
    to: c.to,
    by: who,
    byRole: "crew",
    unitId: viewer.unitId || null,
    unitName: viewer.unitName || "",
    at: now,
    note: note || "",
    status: "pending",
    // Whether the call had already closed when this was reported, so the desk
    // can see at a glance that it is tidying a record rather than fixing a
    // call that is still running.
    afterClose: req.status === "completed",
  }));
  const fresh = await readKey("ems:requests", requests);
  const next = fresh.map((r) =>
    r.id === req.id ? { ...r, edits: [...callEdits(r), ...entries] } : r
  );
  await saveRequests(next);
  await addLog(
    `${viewer.unitName || "CREW"} (${who}) changed call information — ` +
      entries.map((e) => `${editFieldLabel(e.field)}: ${editValueText(e.from, e.field)} → ${editValueText(e.to, e.field)}`).join("; ") +
      ` — ${req.nature} (waiting for dispatch to confirm)`,
    "status"
  );
  return true;
}

async function verifyCallEditOn({ req, entry, accept, who, requests, saveRequests, addLog }) {
  if (!req || !entry) return false;
  const now = Date.now();
  const byWhom = who || "Dispatch";
  const fresh = await readKey("ems:requests", requests);
  const next = fresh.map((r) => {
    if (r.id !== req.id) return r;
    const patched = {
      ...r,
      edits: callEdits(r).map((e) =>
        e.id === entry.id
          ? { ...e, status: accept ? "applied" : "rejected", verifiedBy: byWhom, verifiedAt: now }
          : e
      ),
    };
    if (accept) {
      patched[entry.field] = entry.to;
      if (entry.field === "locationFrom") patched.location = entry.to;
    }
    return patched;
  });
  await saveRequests(next);
  await addLog(
    `${entry.unitName || "CREW"} (${entry.by}) changed call information ` +
      `(${accept ? "confirmed" : "turned down"} by ${byWhom}) — ` +
      `${editFieldLabel(entry.field)}: ${editValueText(entry.from, entry.field)} → ${editValueText(entry.to, entry.field)}` +
      ` — ${req.nature}`,
    "status"
  );
  return true;
}

// ---------- how the call is coded: category, and loaded distance ----------
//
// Two codes travel with every call to the billing and activity sheets, and both
// of them used to be written on paper afterwards: the exported dispatch log has
// carried empty CAT. OF CALL and KILO METER columns since it was first built,
// filled in by hand from memory hours later. They are recorded on the call
// itself now, by whoever knows the answer first.
//
// That is deliberately not one fixed role. The desk usually knows the category
// at intake — an ALS crew was asked for, or the ward said critical care — while
// the distance is only known once the truck has run it, so the crew are usually
// the ones who can say. Either side can set either code, and either side can
// correct the other's, because the alternative is a code that is right in
// somebody's head and wrong on the sheet.
//
// Whoever gets there first, both codes have to be on the call before the crew
// running it can go back in service — see CLOSEOUT_REQUIREMENTS below. Open to
// either side, mandatory for the one holding the call at the end.
// ---------- the sheet's own vocabulary ----------
//
// Taken verbatim from the department's dispatch log so what a crew picks here
// is the same word that lands in the column, rather than free text somebody has
// to translate at the end of the month.
//
// The sheet's lists carry rows of underscores as visual dividers between groups.
// They are spacing, not choices, and they are stripped here — left in, they
// would appear in the app as selectable options and end up written against real
// calls.
function fromSheetList(items) {
  return items.filter((x) => x && x.trim() && !/^_+$/.test(x.trim()));
}

  { key: "B", name: "BLS", desc: "Basic life support", color: "#35C4E8" },
  { key: "C", name: "CRITICAL", desc: "Critical care", color: "#FF4D5E" },
  { key: "D", name: "AUXILIARY", desc: "Additional ambulance (auxiliary)", color: "#8B5CF6" },
  { key: "E", name: "NO TRANSPORT", desc: "Ambulance responded — no transport", color: NO_TRANSPORT.color },
  { key: "NA", name: "N/A", desc: "Not applicable", color: "#64748B" },
];

// Bands rather than a distance: the service is billed on which band the loaded
// leg falls into, so a band is the fact worth recording and a reading off the
// odometer is not. Band 5 is the open-ended one — everything past 400 km, in
// further 200 km steps.
const LOADED_KM = [
  { key: "1", name: "≤ 50 km", desc: "50 km or less" },
  { key: "2", name: "51–150 km", desc: "51 km up to 150 km" },
  { key: "3", name: "151–250 km", desc: "151 km up to 250 km" },
  { key: "4", name: "251–400 km", desc: "251 km up to 400 km" },
  { key: "5", name: "400 km +", desc: "each additional 200 km after 400 km" },
  { key: "NA", name: "N/A", desc: "Not applicable" },
];

const LOADED_KM_COLOR = "#14B8A6";

function callTypeMeta(key) {
  return CALL_TYPES.find((t) => t.key === key) || null;
}

function loadedKmMeta(key) {
  return LOADED_KM.find((k) => k.key === key) || null;
}

// The code on a call, or null. An unrecognised code — a record written by a
// build that knew a letter this one doesn't — reads as unset rather than
// throwing the card that draws it.
function callTypeOf(req) {
  return req ? callTypeMeta(req.callType) : null;
}

function loadedKmOf(req) {
  return req ? loadedKmMeta(req.loadedKm) : null;
}

// What the call already says about itself. A refusal recorded on it is an E; a
// team that came out as the second ambulance is a D. Offered as a suggestion on
// the picker and never applied on its own — the code has to be somebody's
// answer, because it is somebody's answer that gets billed.
function suggestedCallType(req) {
  if (!req) return null;
  if (isNoTransport(req)) return "E";
  if (assistTeams(req).length > 0) return "D";
  return null;
}

// One writer for both codes, shared by the desk, the crew, the admin monitor and
// the history list, so a code set from any of the four is stamped, logged and
// saved the same way. Reads fresh first for the same reason every other write on
// this board does: two tablets and a desk are often looking at the same call.
async function applyCallCoding({ reqId, field, value, requests, saveRequests, addLog, actor }) {
  const isType = field === "callType";
  const meta = isType ? callTypeMeta(value) : loadedKmMeta(value);
  if (!meta) return;
  const now = Date.now();
  const freshRequests = await readKey("ems:requests", requests);
  const target = freshRequests.find((r) => r.id === reqId);
  if (!target) return;
  const previous = isType ? callTypeOf(target) : loadedKmOf(target);
  // Tapping the code that is already on the call is a no-op rather than a
  // second log line saying nothing changed.
  if (previous && previous.key === meta.key) return;
  const by = actor && actor.name ? actor.name : "";
  const patch = isType
    ? { callType: meta.key, callTypeBy: by, callTypeAt: now }
    : { loadedKm: meta.key, loadedKmBy: by, loadedKmAt: now };
  await saveRequests(freshRequests.map((r) => (r.id === reqId ? { ...r, ...patch } : r)));
  const label = isType ? "Call type" : "Loaded km";
  await addLog(
    `${label} ${meta.key} (${meta.name}) set on ${target.nature}` +
      `${previous ? ` — was ${previous.key}` : ""}${by ? ` — ${by}` : ""}`,
    "status"
  );
}


// ---------- who writes the patient care report ----------
//
// Every call that runs to the end leaves a patient care report behind it, and a
// report belongs to a person rather than to a truck: "MEDIC 3 wrote it" is not
// an answer a supervisor can chase up two weeks later, because by then that
// medic has been worked by half a dozen people. Both seats ran the call, so
// which of the two is writing it is something only the crew can say — and the
// moment they can still say it is while the call is in front of them, not after
// the board has let go of it.
//
// So the last step of the timeline is the one that asks. The crew can name the
// author at any point from the moment the call is theirs, and they cannot go
// back in service until they have: a call closes with a name against its PCR or
// it does not close. That last step is the same gate the two billing codes hang
// off — see CLOSEOUT_REQUIREMENTS below — so the key lives here as the shared
// name for "the step that ends the call".
const CLOSEOUT_STEP_KEY = "backInService";
const PCR_SEATS = ["alpha", "bravo"];

// The author recorded on a call, or null. A half-written record — a seat with no
// name behind it — counts as no author rather than as one nobody can read.
function pcrAuthorOf(req) {
  const a = req && req.pcrAuthor;
  if (!a || !a.seat || !a.name) return null;
  return a;
}

// The names the crew can pick between: whoever is holding this unit's two seats.
// The crew member doing the picking is always one of them — a tablet whose copy
// of the unit hasn't caught up with the seat they are sitting in still offers
// them their own name rather than an empty list.
function pcrAuthorChoices(unit, session) {
  return PCR_SEATS.map((seat) => {
    const person = unit ? unit[seat] : null;
    if (person && person.name) return { seat, name: person.name, accountId: person.accountId || null };
    if (session && session.role === "team" && session.slot === seat && session.name) {
      return { seat, name: session.name, accountId: session.accountId || null };
    }
    return null;
  }).filter(Boolean);
}

// "Alpha — R. Chen": the way the crew and the desk read it on the call itself.
function pcrAuthorText(req) {
  const a = pcrAuthorOf(req);
  if (!a) return "";
  const seat = seatLabel(a.seat);
  return seat ? `${seat} — ${a.name}` : a.name;
}

// "R. Chen (MEDIC 3 · ALPHA)": the way the export's PCR AUTHOR column reads it,
// in the same stamp shape every other name on that sheet uses.
function pcrAuthorStamp(req, unit) {
  const a = pcrAuthorOf(req);
  if (!a) return "";
  return crewStampText(unit ? unit.name : a.unitName || "", { name: a.name, seat: a.seat });
}


// ---------- what a call has to carry before the crew can close it ----------
//
// Three facts about a finished call are only reliably knowable by the crew who
// ran it, and all three used to be chased afterwards: who is writing the report,
// what category the call was, and how far the loaded leg went. Chasing them
// afterwards is how the dispatch log ended up with empty PCR AUTHOR, CAT. OF
// CALL and KILO METER columns — by the time anyone asks, the crew have run four
// more calls and the honest answer is a guess.
//
// So the last step of the timeline asks for all three together. Any of them can
// be answered from the moment the call is the crew's, and either the desk or the
// crew can set or correct the two codes at any point; what the crew cannot do is
// go back in service while one of them is still blank. The desk's own override
// close is deliberately left alone — that is the desk taking the call off a crew
// who can no longer answer, and it is already stamped as the desk's doing.
const CLOSEOUT_REQUIREMENTS = [
  { key: "pcrAuthor", label: "PCR author", present: (req) => !!pcrAuthorOf(req) },
  { key: "callType", label: "call type", present: (req) => !!callTypeOf(req) },
  { key: "loadedKm", label: "loaded kilometers", present: (req) => !!loadedKmOf(req) },
];

// Which of the three a call is still missing, in the order the crew's card
// draws them. An empty list means the call is ready to close.
function closeoutMissing(req) {
  if (!req) return [];
  return CLOSEOUT_REQUIREMENTS.filter((r) => !r.present(req));
}

// The same list, but only when it is actually standing in the way: the crew are
// on the last step and one of the three is blank. Every other step of the
// timeline is unaffected — a crew clearing a scene are never held up by a
// billing code.
function closeoutBlockers(req, step) {
  if (!req || !step || step.timeKey !== CLOSEOUT_STEP_KEY) return [];
  return closeoutMissing(req);
}

// "the PCR author, the call type and the loaded kilometers" — the missing items
// written out the way a sentence on the card needs to read them.
function closeoutMissingText(missing) {
  const labels = (missing || []).map((m) => m.label);
  if (labels.length === 0) return "";
  if (labels.length === 1) return `the ${labels[0]}`;
  return `the ${labels.slice(0, -1).join(", the ")} and the ${labels[labels.length - 1]}`;
}


// ---------- why a call was closed ----------
//
// Every call on this board ends the same way: the desk presses Close call. That
// one press used to be the entire record of the ending — the row moved to
// completed carrying a name and a timestamp and nothing at all about what
// happened to the patient. A call run through to the receiving ward and a call
// stood down two minutes after it was raised read identically the next morning,
// and the desk that closed them is long off shift by the time anyone asks.
//
// So the press asks a question first, the same way cancelling a booking does.
// The reasons below are the endings the desk actually sees, ordinary one first:
// most calls close because the patient was delivered, and that stays a single
// press. Anything else is typed into the same box — the chips fill the box
// rather than replace it, so a picked reason can still be added to.
const CALL_CLOSE_REASONS = [
  "Call completed — patient delivered",
  "Patient refused transport",
  "Cancelled before the team arrived",
  "Team stood down en route",
  "Patient transported by other means",
  "No patient found at pickup",
  "Duplicate call",
  "Closed by desk — crew could not finish the timeline",
];

// The longest a reason can be. Long enough for a sentence explaining an unusual
// ending, short enough that the export column stays readable.
const CALL_CLOSE_REASON_MAX = 200;

// What the record says a call was closed for. Calls closed before this was
// asked for have no reason on them, and everything reading it says so plainly
// rather than leaving a blank next to a patient — a blank reads as "nobody
// filled it in", which is a different thing from "this was never asked".
function callCloseReason(req) {
  return req && typeof req.closeReason === "string" ? req.closeReason.trim() : "";
}

// A call that was called off rather than run. There is no "cancelled" status on
// this board and there deliberately isn't one: a call the desk stands down is
// closed exactly like any other, and the only record of it having been called
// off is the reason typed into the close banner. So that reason is what this
// reads. The chips fill the close box rather than replace it — a picked ending
// can have a sentence added to it — so it matches on the words rather than on
// the whole string, which keeps "Cancelled before the team arrived — ward rang
// back" a cancellation.
//
// A refusal is deliberately not one of these. The truck rolled and the team
// assessed the patient, so that call happened: it carries the NO TRANSPORT
// stamp instead, and it is not what anybody means by a cancelled request.
const CALL_CANCELLED_MARKERS = [
  "cancel",
  "stood down",
  "stand down",
  "no patient found",
  "duplicate call",
  "transported by other means",
];

function callWasCancelled(req) {
  const reason = callCloseReason(req).toLowerCase();
  if (!reason) return false;
  return CALL_CANCELLED_MARKERS.some((m) => reason.includes(m));
}


// ---------- call locations ----------
//
// A call has two places in it: where the patient is picked up and where they
// are taken. The board originally recorded only one ("location"), which is why
// the FROM column of the exported dispatch log was filled in and TO was always
// left blank. Calls are now raised with both, and everything below reads them
// through these helpers so a call logged before the split still displays and
// exports correctly — its single location is treated as the pickup point.
function callFrom(req) {
  if (!req) return "";
  return String(req.locationFrom || req.location || "").trim();
}

function callTo(req) {
  if (!req) return "";
  return String(req.locationTo || "").trim();
}

// "Ward 4B → CT Suite", or just the pickup point when there is no destination
// on the record (an older call, or one raised before the destination was known).
function callRoute(req) {
  const from = callFrom(req);
  const to = callTo(req);
  if (from && to) return `${from} → ${to}`;
  return from || to || "—";
}

// ---------- shifts ----------
//
// The service runs around the clock in two 12-hour shifts: day 07:00–19:00,
// night 19:00–07:00 (crossing midnight). Which shift someone is on can't be
// read off the wall clock alone — a crew that took a call at 18:40 is still
// the day shift at 19:30, and the night crew relieving them may sign on
// before 19:00 — so dispatch and every crew member pick their shift by hand
// when they sign in, and the board works from what they picked.
const SHIFT_HOURS = 12;
const SHIFT_MS = SHIFT_HOURS * 60 * 60 * 1000;

const SHIFTS = {
  day: {
    key: "day", label: "DAY SHIFT", short: "DAY", glyph: "☀",
    startHour: 7, window: "07:00 – 19:00", color: "#FFB020",
  },
  night: {
    key: "night", label: "NIGHT SHIFT", short: "NIGHT", glyph: "☾",
    startHour: 19, window: "19:00 – 07:00", color: "#818CF8",
  },
};
const SHIFT_KEYS = ["day", "night"];

// What each kind of shift entry on the log sheet is called.
const SHIFT_EVENTS = {
  on: { label: "SIGNED ON", color: "#3DDC97" },
  off: { label: "SIGNED OFF", color: "#93A7B8" },
  swap: { label: "SHIFT SWAP", color: "#35C4E8" },
  overtime: { label: "OVERTIME", color: "#FF4D5E" },
};

// How long after a seat is vacated a fresh sign-on still counts as taking
// over from that person, rather than an unrelated shift days later.
const HANDOVER_GRACE_MS = 6 * 60 * 60 * 1000;

// ---------- what the live log sheet is allowed to show ----------
//
// Everything the app does is still logged, and the whole feed still goes out on
// the Event Log sheet of the export. But a desk watching a live board does not
// need to read every coding, booking, status flip and closure scroll past: the
// two things dispatch would otherwise have to ask for over the radio are
// whether the team heard the call and whether they are moving. Those are the
// only two lines the log sheet shows; the rest are written and kept, not
// displayed.
const BOARD_LOG_EVENTS = ["ack", "enroute"];

// Lines written before entries carried an event key are matched on the sentence
// instead, so a board that is mid-shift when this build lands doesn't empty
// out. New entries never take this path.
const LEGACY_BOARD_LOG_RE = /acknowledged call|acknowledged assist request|— En Route at|marked EN ROUTE/i;

function isBoardLogEntry(entry) {
  if (!entry) return false;
  const key = entry.detail && entry.detail.event;
  if (key) return BOARD_LOG_EVENTS.includes(key);
  return !entry.detail && LEGACY_BOARD_LOG_RE.test(entry.message || "");
}

// The department works out of two separate stations. They run their own calls,
// their own bookings and their own log sheet — a dispatcher at one has no
// business seeing the other's board, and a crew signs on at the station they
// are actually working that shift. Administration is the one place both are
// visible at once.
const STATIONS = [
  { key: "main", label: "Main Office", short: "MAIN" },
  { key: "ccc", label: "CCC", short: "CCC" },
];

// Everything that existed before stations did belongs to the Main Office —
// that is where the original five medics run from, so an un-tagged record read
// off an older board lands where it actually came from rather than nowhere.
const DEFAULT_STATION = "main";

function stationMeta(key) {
  return STATIONS.find((s) => s.key === key) || STATIONS[0];
}

function stationLabel(key) {
  const m = STATIONS.find((s) => s.key === key);
  return m ? m.label : "";
}

function stationShort(key) {
  const m = STATIONS.find((s) => s.key === key);
  return m ? m.short : "";
}

// The station a record belongs to. Written as one function so an older record
// with no station on it is read the same way everywhere instead of being
// treated as belonging to no station at all, which would hide it from both.
function stationOf(x) {
  return (x && x.station) || DEFAULT_STATION;
}

function atStation(list, station) {
  if (!station) return list || [];
  return (list || []).filter((x) => stationOf(x) === station);
}

// A unit's name is only unique inside its own station — both stations run a
// MEDIC 1. Anywhere the two are shown together the station has to come with it.
function unitFullName(unit) {
  if (!unit) return "";
  return `${unit.name} · ${stationShort(stationOf(unit))}`;
}

// The two built-in accounts. Each logs in with just its ID the first time,
// then chooses a password. Anyone else (more admins, dispatchers, or crew) is
// created by an admin from inside the Admin view.
const DEFAULT_ACCOUNTS = [
  { id: "F1525518", name: "Admin", role: "admin", team: null, slot: null, passwordHash: null, createdAt: Date.now() },
  { id: "D1000001", name: "Dispatcher", role: "dispatcher", team: null, slot: null, passwordHash: null, createdAt: Date.now() },
];

// Lightweight client-side password hashing (SHA-256 via the browser's own
// crypto API — no server involved). This keeps casual/unauthorized people
// out through the app's own UI, but it is NOT enterprise-grade auth: there's
// no salt, and anyone with direct Firestore access could still read the
// hashes. Fine for gating who can act as dispatch/admin day-to-day; if this
// ever needs to be airtight for compliance purposes, it should move to a
// real backend with server-side verification instead.
async function hashPassword(pw) {
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

const POLL_MS = 3000;
// How many activity lines the log sheet keeps. Every board reads the whole log
// on each poll, so this can't grow without limit — the durable record of what
// happened on a call is the call itself, which is kept forever (see
// CompletedCalls) and exported in full.
const LOG_CAP = 400;

// ---------- who is actually in service ----------
//
// Dispatch used to read "in service" straight off `unit.status === "available"`,
// which turned out to be too narrow: a crew could be signed on and working
// while their unit still carried a status left over from an earlier call (or a
// status nobody had thought to reset), and dispatch would see an empty board —
// no teams to pick in the request form, and no options in the "Assign unit…"
// dropdown on a pending call, so a call raised without a team could never be
// given one. Availability is now derived from two independent facts: is anyone
// signed on, and is the unit tied up on a call that is still running.

// The statuses that only make sense while a unit is committed to a live call.
// Seeing one of these on a unit with no live call means the status is stale.
const ON_CALL_STATUSES = ["dispatched", "enroute", "onscene", "transporting"];

// Never index STATUS directly for display: a unit saved before a status field
// existed (or carrying a value this build doesn't know) would otherwise throw
// while rendering and take the whole board down with it.
function statusKey(status) {
  return STATUS[status] ? status : "oos";
}

function statusMeta(status) {
  return STATUS[statusKey(status)];
}

// A unit is staffed when at least one seat is occupied. One crew member signed
// on is enough to reach — a single-seat unit is short-handed, not off the board.
function isStaffed(unit) {
  return !!(unit && (unit.alpha || unit.bravo));
}

// The call a unit is committed to right now, or null. A pointer to a call that
// was completed (or no longer exists at all) is stale and doesn't count.
//
// A call that names this team counts even when the team doesn't point back at
