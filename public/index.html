// it. Assigning is two separate writes — the call first, then the unit — and if
// the second one never landed (a dropped request, a device that dozed off in
// between) the crew's screen used to stay silent while the desk showed the call
// as assigned and nobody could tell why. What dispatch actually decided is
// recorded on the call, so that is what the crew is alerted on; the repair pass
// in loadAll re-points the unit behind the scenes.
function liveRequestFor(unit, requests) {
  if (!unit) return null;
  const live = (requests || []).filter((r) => r && r.status !== "completed");
  if (unit.assignedRequestId) {
    const pointed = live.find((r) => r.id === unit.assignedRequestId);
    if (pointed) return pointed;
  }
  const assignedAt = (r) => (r.times && r.times.assigned) || r.createdAt || 0;
  // A team sent as the second ambulance on someone else's call is committed to
  // it just as firmly as the team that owns it, and is found the same way.
  const named = live
    .filter((r) => r.assignedUnitId === unit.id || isAssistingUnit(r, unit.id))
    .sort((a, b) => assignedAt(a) - assignedAt(b));
  return named[0] || null;
}

function isOnCall(unit, requests) {
  return !!liveRequestFor(unit, requests);
}

// Every unit dispatch could send on a new call — anything not already on one.
// Deliberately not filtered down to `status === "available"`: a unit that is
// free is assignable, and dispatch decides whether a short-handed or
// out-of-service team is the right one to send. Staffed teams sort first so the
// obvious choice is at the top of the list.
function assignableUnits(units, requests) {
  return (units || [])
    .filter((u) => !isOnCall(u, requests))
    .sort((a, b) => {
      const rank = (u) => (u.status === "available" ? 0 : isStaffed(u) ? 1 : 2);
      return rank(a) - rank(b) || String(a.name).localeCompare(String(b.name));
    });
}

// How a free unit reads on a dispatch picker, so the desk can tell "crew on
// board, sitting out of service" apart from "nobody has signed on".
function assignableNote(unit) {
  if (!isStaffed(unit)) return "no crew signed on";
  if (unit.status === "available") return !unit.alpha || !unit.bravo ? "one crew" : null;
  return statusMeta(unit.status).label.toLowerCase();
}

// The status a unit that isn't on a call should be sitting at: in service when
// someone is signed on, out of service when the seats are empty.
function idleStatusFor(unit) {
  return isStaffed(unit) ? "available" : "oos";
}

// ---------- a second ambulance on the same call ----------
//
// One team is sometimes not enough: a bariatric lift, two patients out of one
// room, a resuscitation that needs four pairs of hands. The crew on scene are
// the only people who know that, so they ask for the help themselves from the
// call they are on, and the ask lands on the dispatch desk as an alert plus a
// task that isn't finished until a second team has been sent to that same call.
//
// The whole exchange lives on the call record so every desk and both crews see
// the same thing:
//
//   req.assist = {
//     status: "pending" | "assigned" | "cancelled",
//     requestedAt, requestedByUnitId, requestedByUnitName, requestedBy, note,
//     cancelledAt, cancelledBy,
//     teams: [{ unitId, unitName, assignedAt, assignedBy, acknowledgedAt, clearedAt }]
//   }
//
// `teams` is a list, not a single id: a crew can ask again after the first
// assisting team has been sent, which puts the task back on the desk while
// keeping the team already helping exactly where it is.
function assistOf(req) {
  return req && req.assist && typeof req.assist === "object" ? req.assist : null;
}

function assistPending(req) {
  const a = assistOf(req);
  return !!(a && a.status === "pending" && req.status !== "completed");
}

function assistTeams(req) {
  const a = assistOf(req);
  return a && Array.isArray(a.teams) ? a.teams.filter(Boolean) : [];
}

// The assisting team's own record on this call while it is still helping. A
// team that has cleared has finished assisting and is free again.
function assistTeamFor(req, unitId) {
  return assistTeams(req).find((t) => t.unitId === unitId && !t.clearedAt) || null;
}

function isAssistingUnit(req, unitId) {
  return !!assistTeamFor(req, unitId);
}

function activeAssistUnitIds(req) {
  return assistTeams(req)
    .filter((t) => !t.clearedAt)
    .map((t) => t.unitId);
}

// Every live call still waiting for a second team, oldest ask first — the
// dispatch desk's task list.
function pendingAssistCalls(requests) {
  return (requests || [])
    .filter((r) => assistPending(r))
    .sort((a, b) => (assistOf(a).requestedAt || 0) - (assistOf(b).requestedAt || 0));
}

// How long an assisting team was tied up on a call that isn't theirs: from the
// moment they were sent to the moment they cleared, or to the end of the call.
function assistBusyMs(req, unitId, now) {
  const team = assistTeams(req).find((t) => t.unitId === unitId);
  if (!team || !team.assignedAt) return 0;
  const end = team.clearedAt || callEndTs(req, now);
  return Math.max(0, end - team.assignedAt);
}

// A call the crew responded to and did not transport on, because the patient
// refused the transfer once the team reached them.
function isNoTransport(req) {
  return !!(req && req.noTransport);
}

// What the call ended up being, for the history and the export. Left blank
// rather than guessed at for an ordinary call: only a refusal is something this
// board knows for certain happened.
function callOutcomeLabel(req) {
  return isNoTransport(req) ? NO_TRANSPORT.label : "";
}

// Every team that was sent to help on this call, named, in the order they were
// sent. Falls back to the id if a team has since been removed from the roster.
function assistTeamNames(req, units) {
  return assistTeams(req)
    .map((t) => {
      if (t.unitName) return t.unitName;
      const u = (units || []).find((x) => x.id === t.unitId);
      return u ? u.name : t.unitId;
    })
    .join(", ");
}

// ---------- escalations: a problem on a call, raised to the admins ----------
//
// Not everything that goes wrong on a call is a dispatch decision. A lift that
// never came, a ward that argued about the transfer, a stretcher that failed, a
// receiving unit that wasn't ready, a colleague who didn't turn up — none of
// those change the timeline, and most of them surface after the call has been
// completed and closed on time with the problem still unaddressed. Until now
// the only route for them was a phone call to somebody's office, which left no
// record and no answer.
//
// So an escalation is a note the crew can put on a call at any point — while it
// is live, or on a call they closed three weeks ago — and it goes to the
// admins and to nobody else. Dispatch never sees one: the desk is a peer, and a
// crew who know the desk reads their complaints stop writing them. The admins
// answer on the same thread, and the answer comes back to the person who raised
// it, which is the only way anyone who reports a problem ever learns it was
// dealt with.
//
// It is kept on the call itself:
//
//   req.escalations = [{
//     id, raisedAt, message,
//     by: { name, accountId, seat },
//     unitId, unitName,
//     atStatus, afterClose,      // what the call was doing when it was raised
//     status: "open" | "resolved",
//     resolvedAt, resolvedBy,
//     replies: [{ id, ts, message, role: "admin" | "team", byName, byAccountId }],
//   }]
//
// — rather than on a board key of its own, because an issue with a call is a
// fact about that call. It travels with it into the history, it is found by
// searching the same list, and no separate record can drift out of step with
// the call it belongs to.
const ESCALATION_MAX = 800;

function escalationsOf(req) {
  return req && Array.isArray(req.escalations) ? req.escalations.filter(Boolean) : [];
}

function escalationReplies(esc) {
  return esc && Array.isArray(esc.replies) ? esc.replies.filter(Boolean) : [];
}

function escalationIsOpen(esc) {
  return !!esc && esc.status !== "resolved";
}

function lastAdminReply(esc) {
  const fromAdmin = escalationReplies(esc).filter((r) => r.role === "admin");
  return fromAdmin.length > 0 ? fromAdmin[fromAdmin.length - 1] : null;
}

// Whether an issue is still the admins' to deal with, which is a narrower thing
// than being open. An issue they have closed off is done. An issue they have
// answered is off their desk too: the crew have their reply, and nothing is
// waiting on the admin until the crew come back on it. Both stay on the call
// they were raised on and are found again under "Escalated only" in the call
// list below — which reaches into the live board as well as the history, so an
// issue on a call that is still running is still findable. They just stop
// sitting in an inbox that is only worth reading if everything in it still
// needs doing. A crew note written after the admin's last reply puts it
// straight back.
function escalationAwaitsAdmin(esc) {
  if (!escalationIsOpen(esc)) return false;
  const replies = escalationReplies(esc);
  const last = replies[replies.length - 1];
  return !last || last.role !== "admin";
}

// How an escalation reads on a card, which is not the same fact for both sides
// of it: the crew are waiting to hear back, the admins are looking for the ones
// nobody has answered yet.
function escalationStateMeta(esc, role) {
  if (!escalationIsOpen(esc)) return { key: "resolved", label: "RESOLVED", color: "#3DDC97" };
  // Answered, and then written back on: it is waiting on the admins again, and
  // saying "REPLIED" on it would read as dealt with when it is not.
  if (escalationAwaitsAdmin(esc) && lastAdminReply(esc)) {
    return { key: "reopened", label: role === "admin" ? "CREW REPLIED" : "WITH ADMIN", color: "#FFB020" };
  }
  if (lastAdminReply(esc)) {
    return { key: "answered", label: role === "admin" ? "REPLIED" : "ADMIN REPLIED", color: "#35C4E8" };
  }
  return { key: "open", label: role === "admin" ? "NEEDS A REPLY" : "WITH ADMIN", color: "#FFB020" };
}

// Who this board is, as far as escalations are concerned. Built once per view
// and handed down, so every card decides visibility from the same three facts
// rather than each one reaching into the session for itself.
function escalationViewer(user, unit, shiftWindow) {
  if (!user) return null;
  return {
    role: user.role,
    accountId: user.accountId || null,
    name: user.name || "",
    seat: user.role === "team" ? user.slot || null : null,
    unitId: user.role === "team" ? user.unitId || null : null,
    unitName: unit ? unit.name : user.unitName || "",
    shiftWindow: shiftWindow || null,
  };
}

// Admins see every escalation on the board — that is the whole point of them.
// The person who raised one sees their own, so a reply reaches them. The other
// seat of the crew that raised it sees it too, but only if it was raised inside
// the shift they are working: two medics who ran the call together are one
// crew, while the crew who take the same truck over tomorrow are not, and last
// week's complaint is none of their business. Everybody else — dispatch, other
// teams, a later crew on the same medic — sees nothing at all.
function canSeeEscalation(esc, viewer) {
  if (!esc || !viewer) return false;
  if (viewer.role === "admin") return true;
  if (viewer.role !== "team") return false;
  const by = esc.by || {};
  if (viewer.accountId && by.accountId && by.accountId === viewer.accountId) return true;
  if (!viewer.unitId || esc.unitId !== viewer.unitId) return false;
  const w = viewer.shiftWindow;
  return !!(w && esc.raisedAt >= w.start && esc.raisedAt <= w.end);
}

function visibleEscalations(req, viewer) {
  return escalationsOf(req).filter((e) => canSeeEscalation(e, viewer));
}

// A crew can raise an issue on a call that was theirs — the one they were sent
// to, or one they were sent to help on — whether it is still running or long
// since closed. Nobody raises one on somebody else's call.
function canRaiseEscalationOn(req, viewer) {
  if (!req || !viewer || viewer.role !== "team" || !viewer.unitId) return false;
  return req.assignedUnitId === viewer.unitId || isAssistingUnit(req, viewer.unitId);
}

// Every call carrying an escalation this viewer is allowed to read, newest
// issue first — the admin inbox, and the crew's own "show me the ones I
// escalated" filter, come off this.
function escalatedCalls(requests, viewer, { openOnly, pendingOnly } = {}) {
  return (requests || [])
    .map((req) => {
      const list = visibleEscalations(req, viewer).filter(
        (e) => (!openOnly || escalationIsOpen(e)) && (!pendingOnly || escalationAwaitsAdmin(e))
      );
      return { req, escalations: list, latest: list.reduce((a, e) => Math.max(a, e.raisedAt || 0), 0) };
    })
    .filter((row) => row.escalations.length > 0)
    .sort((a, b) => b.latest - a.latest);
}

function pendingEscalationCount(requests, viewer) {
  return (requests || []).reduce(
    (n, req) => n + visibleEscalations(req, viewer).filter(escalationAwaitsAdmin).length,
    0
  );
}

// The three writers. They all read the call list back before they touch it, for
// the same reason every other writer on this board does: an escalation raised
// on a tablet and a reply typed at a desk are two people writing to one key a
// few seconds apart, and neither may drop the other.
async function raiseEscalation({ req, message, viewer, requests, saveRequests, addLog }) {
  const text = (message || "").trim();
  if (!req || !text || !canRaiseEscalationOn(req, viewer)) return false;
  const now = Date.now();
  const entry = {
    id: uid("esc"),
    raisedAt: now,
    message: text.slice(0, ESCALATION_MAX),
    by: { name: viewer.name || "", accountId: viewer.accountId || null, seat: viewer.seat || null },
    unitId: viewer.unitId,
    unitName: viewer.unitName || "",
    atStatus: req.status || "",
    afterClose: req.status === "completed",
    status: "open",
    replies: [],
  };
  const fresh = await readKey("ems:requests", requests);
  const next = fresh.map((r) => (r.id === req.id ? { ...r, escalations: [...escalationsOf(r), entry] } : r));
  await saveRequests(next);
  // The log line records that an issue was raised and says nothing whatever
  // about what it says. The event log is read at the desk and goes out on the
  // shared spreadsheet; the issue itself is for the admins.
  await addLog(
    `${entry.unitName || "A team"} escalated an issue to admin — ${req.nature}` +
      `${entry.afterClose ? " (call already closed)" : ""}`,
    "call"
  );
  return true;
}

async function replyToEscalation({ req, escId, message, viewer, requests, saveRequests, addLog }) {
  const text = (message || "").trim();
  if (!req || !escId || !text || !viewer) return false;
  const now = Date.now();
  const reply = {
    id: uid("rep"),
    ts: now,
    message: text.slice(0, ESCALATION_MAX),
    role: viewer.role === "admin" ? "admin" : "team",
    byName: viewer.name || "",
    byAccountId: viewer.accountId || null,
  };
  const fresh = await readKey("ems:requests", requests);
  const next = fresh.map((r) =>
    r.id === req.id
      ? {
          ...r,
          escalations: escalationsOf(r).map((e) =>
            e.id === escId ? { ...e, replies: [...escalationReplies(e), reply] } : e
          ),
        }
      : r
  );
  await saveRequests(next);
  await addLog(
    reply.role === "admin"
      ? `Admin replied to an escalated issue — ${req.nature}`
      : `A team replied on an escalated issue — ${req.nature}`,
    "call"
  );
  return true;
}

// Closing an issue off is the admins' call, not the crew's: the person who
// reported a problem is not the person who decides it has been dealt with. It
// can be reopened, because plenty of them come back.
async function setEscalationResolution({ req, escId, resolved, viewer, requests, saveRequests, addLog }) {
  if (!req || !escId || !viewer || viewer.role !== "admin") return false;
  const now = Date.now();
  const fresh = await readKey("ems:requests", requests);
  const next = fresh.map((r) =>
    r.id === req.id
      ? {
          ...r,
          escalations: escalationsOf(r).map((e) =>
            e.id === escId
              ? {
                  ...e,
                  status: resolved ? "resolved" : "open",
                  resolvedAt: resolved ? now : null,
                  resolvedBy: resolved ? viewer.name || "Admin" : null,
                }
              : e
          ),
        }
      : r
  );
  await saveRequests(next);
  await addLog(
    `Admin ${resolved ? "closed" : "reopened"} an escalated issue — ${req.nature}`,
    "call"
  );
  return true;
}

// ---------- helpers ----------

function uid(prefix) {
  return `${prefix}_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
}

// ---------- dates: Gregorian, always ----------
//
// The service runs its transfers, rosters and logs off the Gregorian calendar,
// but a browser or tablet set to an Arabic locale renders `toLocaleDateString()`
// in Hijri with Arabic-Indic digits — so the same booking would read "١٧ صفر
// ١٤٤٨" on one desk and "3 Nov 2026" on the next, and a crew comparing the two
// has no way to line them up. Every date and time this board shows therefore
// goes through these helpers, which pin the locale, the calendar and the digits
// rather than taking whatever the device is set to.
const GREG_LOCALE = "en-GB";
const GREG_BASE = { calendar: "gregory", numberingSystem: "latn" };
const WEEKDAY_LABELS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTH_LABELS = [
  "January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December",
];

function gregFmt(ts, opts) {
  if (!ts) return "";
  try {
    return new Date(ts).toLocaleString(GREG_LOCALE, { ...GREG_BASE, ...opts });
  } catch (e) {
    // A browser without full Intl data still has to show something sensible.
    return new Date(ts).toISOString().slice(0, 16).replace("T", " ");
  }
}

// "03 Nov 2026"
function gregDateStr(ts) {
  return gregFmt(ts, { day: "2-digit", month: "short", year: "numeric" });
}

// "Mon 3 Nov" — the compact form used on badges next to a time.
function gregDayMonthStr(ts) {
  return gregFmt(ts, { weekday: "short", day: "numeric", month: "short" });
}

// "Monday 3 November 2026" — the day headers on the schedule ahead.
function gregLongDateStr(ts) {
  return gregFmt(ts, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

// "03 Nov 2026, 14:30" — for the exported spreadsheet, where a cell has to
// carry the whole stamp on its own.
function gregDateTimeStr(ts) {
  return gregFmt(ts, {
    day: "2-digit", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
  });
}

// "3 Nov, 14:30" — call cards, where the year is noise.
function gregShortDateTimeStr(ts) {
  return gregFmt(ts, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false });
}

function nowTime() {
  return clockStr(Date.now());
}

// One note, gated by its own envelope. The whole sequence used to share a
// single oscillator held at a constant gain, which had two consequences: a rest
// between notes was only a pitch change inside one unbroken tone, and any note
// written with a `start` offset was preceded by the oscillator's default 440Hz
// for the length of that offset — audibly wrong on the routine chime, which is
// two notes with a gap. A gain node per note fixes both: notes start and stop
// where they say they do, and silence between them is real silence.
function scheduleNote(ctx, t0, note, type, peak) {
  const gain = ctx.createGain();
  gain.connect(ctx.destination);
  const osc = ctx.createOscillator();
  osc.type = type || "square";
  const start = t0 + (note.start || 0);
  const end = start + note.dur;
  // Set on the node and again on the timeline: some engines ignore a bare
  // `.value` once the node is scheduled, others need it before the first event.
  osc.frequency.value = note.freq;
  osc.frequency.setValueAtTime(note.freq, start);
  osc.connect(gain);
  // Short attack and release rather than a hard gate — a square wave switched
  // on at full gain clicks, and a click on every repeat of an alarm that runs
  // until it is acknowledged gets tiring fast.
  const attack = Math.min(0.02, note.dur / 4);
  const release = Math.min(0.03, note.dur / 4);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(peak, start + attack);
  gain.gain.setValueAtTime(peak, Math.max(start + attack, end - release));
  gain.gain.exponentialRampToValueAtTime(0.0001, end);
  osc.start(start);
  osc.stop(end + 0.02);
}

function scheduleTone(ctx, notes, type, gainPeak) {
  // Scaled by this device's chosen loudness. A silenced device never reaches
  // here — the entry points below turn back first — so the peak is always a
  // real, positive number and the exponential ramps stay valid.
  const peak = (gainPeak || 0.16) * soundGain();
  if (peak <= 0.0002) return;
  // A context that was suspended a moment ago can report a currentTime the
  // scheduler has already passed, and anything scheduled in the past is simply
  // dropped. A short lead is inaudible as a delay and keeps the first note.
  const t0 = ctx.currentTime + 0.03;
  notes.forEach((n) => scheduleNote(ctx, t0, n, type, peak));
}

// Each call priority gets a distinct, recognizable alert tone.
function playAlertTone(ctx, priority) {
  try {
    if (!ctx) return;
    if (priority === "critical") {
      // fast alternating wail - most urgent
      scheduleTone(ctx, [
        { freq: 950, start: 0, dur: 0.15 },
        { freq: 650, start: 0.15, dur: 0.15 },
        { freq: 950, start: 0.3, dur: 0.15 },
        { freq: 650, start: 0.45, dur: 0.15 },
        { freq: 950, start: 0.6, dur: 0.15 },
        { freq: 650, start: 0.75, dur: 0.15 },
      ], "square", 0.22);
    } else if (priority === "urgent") {
      // two rising beeps, with a gap so they read as two
      scheduleTone(ctx, [
        { freq: 700, start: 0, dur: 0.34 },
        { freq: 1000, start: 0.42, dur: 0.34 },
      ], "square", 0.18);
    } else {
      // gentle two-note chime — anything that isn't critical or urgent lands
      // here, so an unrecognised priority still makes a noise
      scheduleTone(ctx, [
        { freq: 784, start: 0, dur: 0.3 },
        { freq: 1046, start: 0.32, dur: 0.35 },
      ], "sine", 0.14);
    }
  } catch (e) {
    // audio not available; ignore
  }
}

// A booking coming due in a quarter of an hour is a reminder, not an emergency,
// and it plays on the dispatch desk of a control room where the same speakers
// carry the call alarm. So it gets a sound of its own that can never be
// mistaken for one: two soft sine notes a fifth apart, faded in over a tenth of
// a second and left to ring out, at roughly a third of the loudness of a
// routine call tone. Audible across a quiet room, ignorable mid-sentence.
function softTone(ctx, freq, startOffset, dur, peak) {
  const level = peak * soundGain();
  if (level <= 0.0002) return;
  const gain = ctx.createGain();
  gain.connect(ctx.destination);
  const osc = ctx.createOscillator();
  osc.type = "sine";
  osc.frequency.value = freq;
  osc.connect(gain);
  const t0 = ctx.currentTime + startOffset;
  const end = t0 + dur;
  // A slow attack is what keeps it from reading as an alarm: no click, no edge.
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(level, t0 + 0.12);
  gain.gain.exponentialRampToValueAtTime(0.0001, end);
  osc.start(t0);
  osc.stop(end + 0.02);
}

function playSoftReminderTone(ctx) {
  try {
    if (!ctx) return;
    softTone(ctx, 587.33, 0, 0.75, 0.05); // D5
    softTone(ctx, 880.0, 0.28, 0.95, 0.045); // A5
  } catch (e) {
    // audio not available; ignore
  }
}

// Every path that makes a noise needs the same three things first: a context,
// that context awake, and the notes scheduled only once it is. A browser
// suspends audio whenever the tab goes to the background, and a tab that has
// never been touched has no context at all — so this is done at the moment of
// playing, on every repeat, rather than once at sign-in. Without it the first
// alarm of a shift on a restored session can be silent.
function ensureAudioCtx(audioCtxRef) {
  if (!audioCtxRef) return null;
  try {
    if (!audioCtxRef.current) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtxRef.current = new Ctx();
    }
  } catch (e) {
    return null;
  }
  return audioCtxRef.current;
}

// Resume, then play. resume() is a promise, and notes written into a clock that
// was still frozen when they were laid down get dropped — which is how a call
// arriving on a backgrounded tab used to lose its first alert entirely.
function playWhenAwake(ctx, play) {
  if (!ctx) return;
  try {
    if (ctx.state === "suspended") {
      const resumed = ctx.resume();
      if (resumed && typeof resumed.then === "function") {
        resumed.then(() => play(ctx)).catch(() => {});
        return;
      }
    }
    play(ctx);
  } catch (e) {
    // audio not available; ignore
  }
}

// The one entry point for a call alert: critical, urgent and routine all come
// through here, so all three get the same guarantees about being heard — and
// the one place a silenced device turns back, so all three are silenced
// together and nothing has to remember to check twice.
function soundCallAlert(audioCtxRef, priority) {
  if (soundSilenced()) return;
  playWhenAwake(ensureAudioCtx(audioCtxRef), (ctx) => playAlertTone(ctx, priority));
}

function soundReminderTone(audioCtxRef) {
  if (soundSilenced()) return;
  playWhenAwake(ensureAudioCtx(audioCtxRef), (ctx) => playSoftReminderTone(ctx));
}

// ---------- reaching the crew when the page isn't in front of them ----------
//
// The in-page overlay and the repeating tone only alert someone who is looking
// at the tab. A crew tablet is usually locked, on another app, or on another
// tab, so an assignment also has to arrive as a system notification and a buzz.
// Every one of these is best-effort: an old browser, a denied permission or an
// insecure origin must never stop the rest of the alarm from working.

function alertsSupported() {
  return typeof window !== "undefined" && "Notification" in window;
}

const CALL_ALERT_TAG = "ems-incoming-call";
// One tag per booking, so a stack of reminders for different bookings is
// possible and none of them ever displaces the incoming-call notification.
const SCHED_ALERT_TAG_PREFIX = "ems-booking-soon-";
// One tag per call asking for a second ambulance, for the same reason.
const ASSIST_ALERT_TAG_PREFIX = "ems-assist-needed-";
// One tag per escalated issue, so a stack of them can sit on an admin's lock
// screen without any of them displacing a live call.
const ESCALATION_ALERT_TAG_PREFIX = "ems-escalation-";
// The service worker registration used to raise notifications where a page
// isn't allowed to, and the plain Notification when it is. Only one of the two
// is ever in play on a given device.
let alertWorker = null;
let directNotification = null;

function registerAlertWorker() {
  try {
    if (!("serviceWorker" in navigator)) return;
    navigator.serviceWorker
      .register("/sw.js")
      .then((reg) => {
        alertWorker = reg;
      })
      .catch(() => {
        // no worker: fall back to page-level notifications
      });
  } catch (e) {
    // ignore
  }
}

// Browsers only grant this off the back of a real interaction, which is why it
// is asked for from the click that finishes sign-in and from the first tap on a
// session that came back from a refresh.
function requestAlertPermission() {
  try {
    if (!alertsSupported()) return;
    if (Notification.permission === "default") {
      const result = Notification.requestPermission();
      if (result && typeof result.catch === "function") result.catch(() => {});
    }
  } catch (e) {
    // ignore
  }
}

function notifyAssignedCall(request, unitName) {
  try {
    if (!alertsSupported() || Notification.permission !== "granted") return null;
    const priority = PRIORITY[request.priority] ? PRIORITY[request.priority].label : "CALL";
    const title = `${priority} — ${unitName || "your team"}`;
    const options = {
      body: `${request.nature}\n${callRoute(request)}`,
      // A crew only ever has one call at a time, so a fixed tag means a repeat
      // replaces the notification instead of stacking a pile of them up.
      tag: CALL_ALERT_TAG,
      renotify: true,
      requireInteraction: true,
    };
    // Android — and anything else that refuses `new Notification()` from a page
    // — can only raise one through a service worker registration.
    if (alertWorker && alertWorker.showNotification) {
      const shown = alertWorker.showNotification(title, options);
      if (shown && typeof shown.catch === "function") shown.catch(() => {});
      return null;
    }
    clearCallAlert();
    directNotification = new Notification(title, options);
    directNotification.onclick = () => {
      try {
        window.focus();
        directNotification.close();
      } catch (e) {
        // ignore
      }
    };
    return null;
  } catch (e) {
    return null;
  }
}

// The same delivery route, used for the quarter-hour reminder on a booking
// rather than for a call going out — so a dispatcher who has the roster on
// another tab still gets it. Deliberately unlike the call notification: its own
// tag per booking (a reminder must not replace a live call on the lock screen),
// no interaction required, and it disappears on its own.
function notifyBookingSoon(entry, minutesOut) {
  try {
    if (!alertsSupported() || Notification.permission !== "granted") return;
    const title = `Booking due in ${minutesOut} min — ${hhmm(entry.scheduledFor)}`;
    const options = {
      body: `${entry.nature}\n${callRoute(entry)}`,
      tag: `${SCHED_ALERT_TAG_PREFIX}${entry.id}`,
      renotify: false,
      requireInteraction: false,
    };
    if (alertWorker && alertWorker.showNotification) {
      const shown = alertWorker.showNotification(title, options);
      if (shown && typeof shown.catch === "function") shown.catch(() => {});
      return;
    }
    const n = new Notification(title, options);
    n.onclick = () => {
      try {
        window.focus();
        n.close();
      } catch (e) {
        // ignore
      }
    };
  } catch (e) {
    // ignore
  }
}

// A crew on scene asking for a second ambulance. This one goes to the dispatch
// desk, not to a crew, and it stays on screen until someone deals with it: a
// team is standing in a room they can't clear on their own, so a notification
// that fades away by itself is no use. Its own tag per call keeps it clear of
// the incoming-call alert and of the booking reminders.
function notifyAssistRequest(request, unitName) {
  try {
    if (!alertsSupported() || Notification.permission !== "granted") return;
    const title = `ASSISTANCE NEEDED — ${unitName || "a team"}`;
    const options = {
      body: `Second ambulance requested\n${request.nature}\n${callRoute(request)}`,
      tag: `${ASSIST_ALERT_TAG_PREFIX}${request.id}`,
      renotify: true,
      requireInteraction: true,
    };
    if (alertWorker && alertWorker.showNotification) {
      const shown = alertWorker.showNotification(title, options);
      if (shown && typeof shown.catch === "function") shown.catch(() => {});
      return;
    }
    const n = new Notification(title, options);
    n.onclick = () => {
      try {
        window.focus();
        n.close();
      } catch (e) {
        // ignore
      }
    };
  } catch (e) {
    // ignore
  }
}
// A crew raising a problem on a call. This one only ever goes to an admin
// board, and it does not require interaction: an issue is not an emergency and
// must not sit on the screen the way an unanswered assistance request does.
// The body carries the medic and the call, never the text of the issue —
// notifications are read off a lock screen in a corridor.
function notifyEscalation(request, esc) {
  try {
    if (!alertsSupported() || Notification.permission !== "granted") return;
    const title = `ISSUE ESCALATED — ${(esc && esc.unitName) || "a team"}`;
    const options = {
      body: `${request.nature}\n${callRoute(request)}\nOpen the admin board to read and reply.`,
      tag: `${ESCALATION_ALERT_TAG_PREFIX}${esc ? esc.id : request.id}`,
      renotify: false,
      requireInteraction: false,
    };
    if (alertWorker && alertWorker.showNotification) {
      const shown = alertWorker.showNotification(title, options);
      if (shown && typeof shown.catch === "function") shown.catch(() => {});
      return;
    }
    const n = new Notification(title, options);
    n.onclick = () => {
      try {
        window.focus();
        n.close();
      } catch (e) {
        // ignore
      }
    };
  } catch (e) {
    // ignore
  }
}


// Takes down whatever is on screen, whichever route put it there.
function clearCallAlert() {
  try {
    if (directNotification) directNotification.close();
  } catch (e) {
    // ignore
  }
  directNotification = null;
  try {
    if (alertWorker && alertWorker.getNotifications) {
      alertWorker
        .getNotifications({ tag: CALL_ALERT_TAG })
        .then((list) => {
          list.forEach((n) => {
            try {
              n.close();
            } catch (e) {
              // ignore
            }
          });
        })
        .catch(() => {});
    }
  } catch (e) {
    // ignore
  }
}

function buzz(pattern) {
  try {
    if (navigator.vibrate) navigator.vibrate(pattern);
  } catch (e) {
    // ignore
  }
}

const BASE_TITLE = typeof document !== "undefined" ? document.title : "";

function clockStr(ts) {
  if (!ts) return "";
  return gregFmt(ts, { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
}

function msDurationStr(ms) {
  if (!ms || ms < 0) ms = 0;
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return [h, m, s].map((n) => String(n).padStart(2, "0")).join(":");
}

function durationStr(startTs, endTs) {
  if (!startTs || !endTs) return "";
  return msDurationStr(endTs - startTs);
}

// Compact form for badges, where HH:MM:SS is more precision than anyone needs.
function shortDurationStr(ms) {
  if (!ms || ms < 0) ms = 0;
  const totalMin = Math.floor(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return h > 0 ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m`;
}

// ---------- shift helpers ----------

function hhmm(ts) {
  if (!ts) return "—";
  return gregFmt(ts, { hour: "2-digit", minute: "2-digit", hour12: false });
}

function seatLabel(slot) {
  return slot === "alpha" ? "Alpha" : slot === "bravo" ? "Bravo" : "";
}

function shiftMeta(shiftKey) {
  return SHIFTS[shiftKey] || null;
}

// What the wall clock says the shift is right now. Used to pre-select the
// likely answer at sign-in and to label the board — never to override what
// someone actually told us they're working.
function scheduledShiftKey(ts) {
  const h = new Date(ts).getHours();
  return h >= SHIFTS.day.startHour && h < SHIFTS.night.startHour ? "day" : "night";
}

// The 12-hour window of `shiftKey` nearest to `ts`: the one containing it if
// there is one, otherwise whichever edge is closest. So a night crew signing
// on at 08:00 is booked against the night that has just ended — which is what
// carrying a call past 07:00 looks like, and it reads as overtime straight
// away — while one signing on at 18:00 is booked against the night ahead.
function shiftWindowFor(shiftKey, ts) {
  const shift = shiftMeta(shiftKey) || SHIFTS.day;
  const windows = [-1, 0, 1].map((dayOffset) => {
    const start = new Date(ts);
    start.setDate(start.getDate() + dayOffset);
    start.setHours(shift.startHour, 0, 0, 0);
    return { start: start.getTime(), end: start.getTime() + SHIFT_MS };
  });
  const distance = (w) =>
    ts >= w.start && ts < w.end ? 0 : Math.min(Math.abs(ts - w.start), Math.abs(ts - w.end));
  return windows.reduce((best, w) => (distance(w) < distance(best) ? w : best));
}

// The shift record stamped on a session, and on the crew seat that session
// holds, so every device reading the board sees the same shift for that person.
function shiftAssignment(shiftKey, ts) {
  const w = shiftWindowFor(shiftKey, ts);
  return { shift: shiftKey, shiftStart: w.start, shiftEnd: w.end, signedOnAt: ts };
}

function shiftWindowStr(a) {
  if (!a || !a.shiftStart) return "";
  return `${hhmm(a.shiftStart)} – ${hhmm(a.shiftEnd)}`;
}

// "DAY SHIFT (07:00 – 19:00)" — the phrase every shift log line is built from.
function shiftPhrase(a) {
  const meta = shiftMeta(a && a.shift);
  if (!meta) return "an unrecorded shift";
  return `${meta.label} (${shiftWindowStr(a) || meta.window})`;
}

// The same phrase from a shift key alone. Every Shift column in the export
// carries it rather than the bare word, so the two 12-hour windows the service
// actually runs — 07:00–19:00 and 19:00–07:00 — are written on the sheet
// instead of being something the reader has to already know.
function shiftLabelWithWindow(shiftKey) {
  const meta = shiftMeta(shiftKey);
  return meta ? `${meta.label} (${meta.window})` : "";
}

// The 12-hour window a moment falls in by the wall clock, whatever anyone
// signed on for. The night shift crosses midnight, so a call stamped at 02:00
// belongs to the window that opened at 19:00 the evening before — the returned
// window starts on the previous day, which is what makes the export sort into
// shifts rather than into calendar days.
function shiftWindowAt(ts) {
  const key = scheduledShiftKey(ts);
  const start = new Date(ts);
  if (key === "night" && start.getHours() < SHIFTS.night.startHour) {
    start.setDate(start.getDate() - 1);
  }
  start.setHours(SHIFTS[key].startHour, 0, 0, 0);
  return { key, meta: SHIFTS[key], start: start.getTime(), end: start.getTime() + SHIFT_MS };
}

// The stretch of time one crew member's own shift covers, for scoping what
// they are shown to the work they were actually there for. It is built from
// the 12-hour window they signed on for — not the window the wall clock says,
// which can be a different one for a night crew who came in at 18:30 — and it
// is stretched at both ends to the real edges of their tour: back to the
// moment they actually signed on, and forward to now while they are still
// working. Relief here is loose on purpose, so a crew who came in early or a
// call that closes on overtime both land on the shift they were worked on
// rather than falling into a gap between two windows.
//
// `windowStr` stays the nominal 07:00 – 19:00 (or 19:00 – 07:00) so what is
// written on the screen is still the shift as the roster names it.
//
// A session saved before shifts were recorded falls back to the scheduled
// window around now, which is the best guess available for it.
function crewShiftWindow(person, now) {
  const fallback = shiftWindowAt(now);
  const nominalStart = person && person.shiftStart ? person.shiftStart : fallback.start;
  const nominalEnd = person && person.shiftEnd ? person.shiftEnd : fallback.end;
  const signedOnAt = person && person.signedOnAt ? person.signedOnAt : nominalStart;
  return {
    start: Math.min(nominalStart, signedOnAt),
    end: Math.max(nominalEnd, now),
    windowStr: `${hhmm(nominalStart)} – ${hhmm(nominalEnd)}`,
    meta: shiftMeta(person && person.shift) || fallback.meta,
  };
}

// The date a shift is filed under: the day it started. A night shift that runs
// to 07:00 belongs to the evening it began, not the morning it ended.
function shiftDateOf(windowStart) {
  return windowStart ? gregDateStr(windowStart) : "";
}

// Time worked past the end of the 12 hours that were signed on for. Overtime
// is routine here — a call running at 19:00 doesn't stop at 19:00 — so it is
// only ever measured, shown, and recorded. Nothing blocks on it.
function overtimeMs(a, now) {
  if (!a || !a.shiftEnd) return 0;
  return Math.max(0, now - a.shiftEnd);
}

function shiftRemainingMs(a, now) {
  if (!a || !a.shiftEnd) return 0;
  return Math.max(0, a.shiftEnd - now);
}

// Everyone seated on the board right now, with how far past their shift end
// they are. Drives the "on overtime" count above the log sheet.
function crewOnDuty(units) {
  const rows = [];
  units.forEach((u) => {
    ["alpha", "bravo"].forEach((slot) => {
      if (u[slot]) rows.push({ unit: u, slot, member: u[slot] });
    });
  });
  return rows;
}

// "John (DAY), Sara (NIGHT · 40m OT)" — who is holding this unit's seats and
// on which shift, for the team picker and the roster cards.
function crewShiftSummary(unit, now) {
  const at = now || Date.now();
  return ["alpha", "bravo"]
    .map((slot) => unit[slot])
    .filter(Boolean)
    .map((m) => {
      const meta = shiftMeta(m.shift);
      const ot = overtimeMs(m, at);
      const tags = [meta ? meta.short : null, ot > 0 ? `${shortDurationStr(ot)} OT` : null].filter(Boolean);
      return tags.length > 0 ? `${m.name} (${tags.join(" · ")})` : m.name;
    })
    .join(", ");
}

// ---------- log sheet name stamps ----------
//
// Nobody is permanently attached to a medic or to the dispatch desk here: crews
// pick the unit they are working at every sign-on and the desk changes hands
// through the day. That makes "MEDIC 3 went en route" half a record — by next
// week that seat belongs to someone else, and the log sheet is what a
// supervisor reads back weeks later. So every line is stamped with the person
// who was signed in when it was written, captured at that moment and never
// recomputed from who happens to be sitting there now.
function actorStamp(session) {
  if (!session) return null;
  const name = session.name || session.accountId || "";
  if (!name) return null;
  return {
    name,
    role: session.role || null,
    accountId: session.accountId || null,
    // Which station the person was working when they did this. It is what lets
    // a station's log sheet be its own, and it is on the stamp rather than on
    // the message so it survives into the spreadsheet as a column.
    station: session.station || null,
    unitName: session.role === "team" ? session.unitName || "" : "",
    seat: session.role === "team" ? session.slot || null : null,
  };
}

// Where the stamped person was posted: "MEDIC 3 · ALPHA" for a crew member,
// "DISPATCH" or "ADMIN" for whoever was working the desk.
function actorPost(actor) {
  if (!actor) return "";
  if (actor.role === "team") {
    return [actor.unitName || "TEAM", seatLabel(actor.seat).toUpperCase()].filter(Boolean).join(" · ");
  }
  if (actor.role === "dispatcher") return "DISPATCH";
  if (actor.role === "admin") return "ADMIN";
  return "";
}

// "R. Chen (MEDIC 3 · ALPHA)" — the stamp as one string, for the spreadsheet.
function actorStampText(actor) {
  if (!actor || !actor.name) return "";
  const post = actorPost(actor);
  return post ? `${actor.name} (${post})` : actor.name;
}

// The same stamp for someone who held a seat on a medic, built from a unit name
// and a crew record rather than from a live session.
function crewStampText(unitName, person) {
  if (!person || !person.name) return "";
  return actorStampText({ role: "team", name: person.name, unitName: unitName || "", seat: person.seat || null });
}

// ---------- who was signed into each medic ----------
//
// A medic number is not a person. Across one day the same MEDIC 3 can be worked
// by a day crew, then a night crew, then whoever swapped in when one of them ran
// into overtime — so a spreadsheet line that says only "MEDIC 3" is unsigned,
// and a supervisor reading the export back weeks later has no way to tell which
// of them it belongs to. Every medic in the export therefore carries a name
// stamp, and a medic that was signed in by more than one employee is listed
// again for each of them instead of squashing the names into one cell.
//
// The board itself only holds who is sitting in a seat right now, plus the last
// person to leave it (unit.lastCrew), so the full occupancy of a medic is
// reconstructed from the shift lines on the log sheet: SIGNED ON and a takeover
// SHIFT SWAP open a stay, SIGNED OFF closes it, OVERTIME records time carried
// past the shift end. The live seats and lastCrew are then folded in on top,
// which covers a board whose sign-on line was written before the log window
// currently held in memory.
function medicCrewStamps(unit, log, now) {
  const at = now || Date.now();
  const stays = new Map();

  // One stay per employee, per seat, per shift they worked that seat. A crew
  // member who swapped from day to night without leaving the truck really did
  // work two shifts on that medic, so they are listed for both.
  const keyOf = (p) => [p.accountId || p.name || "?", p.seat || "", p.shift || ""].join("|");

  const earlier = (a, b) => (a && b ? Math.min(a, b) : a || b || null);
  const later = (a, b) => (a && b ? Math.max(a, b) : a || b || null);

  const record = (p) => {
    if (!p || !p.name) return;
    const key = keyOf(p);
    const prev = stays.get(key);
    if (!prev) {
      stays.set(key, { ...p });
      return;
    }
    // A stay is pieced together from several lines (sign-on, overtime, sign-off),
    // each carrying only part of it — so a known value is never overwritten with
    // a blank one from another line.
    stays.set(key, {
      name: prev.name || p.name,
      accountId: prev.accountId || p.accountId,
      seat: prev.seat || p.seat,
      shift: prev.shift || p.shift,
      shiftStart: prev.shiftStart || p.shiftStart,
      shiftEnd: prev.shiftEnd || p.shiftEnd,
      signedOnAt: earlier(prev.signedOnAt, p.signedOnAt),
      signedOffAt: later(prev.signedOffAt, p.signedOffAt),
      overtimeMs: Math.max(prev.overtimeMs || 0, p.overtimeMs || 0),
      onDutyNow: prev.onDutyNow || p.onDutyNow,
    });
  };

  const blank = (d) => ({
    name: d.name || "",
    accountId: d.accountId || "",
    seat: d.seat || null,
    shift: d.shift || null,
    shiftStart: d.shiftStart || null,
    shiftEnd: d.shiftEnd || null,
    signedOnAt: null,
    signedOffAt: null,
    overtimeMs: d.overtimeMs || 0,
    onDutyNow: false,
  });

  (log || [])
    .filter((e) => e.type === "shift" && e.detail && e.detail.role === "team")
    // Matched on the unit's id, not its name.
    //
    // Both stations run a MEDIC 1. Matching on the name alone meant a crew at
    // CCC could be counted against the Main Office truck of the same name, and
    // — worse for the statistics — anybody whose sign-on line carried an id but
    // a slightly different name string matched nothing at all and vanished from
    // the figures entirely. They had done the calls; they simply were not
    // findable. The id is the thing that is actually unique, so it decides, and
    // the name is only a fallback for older lines that predate it.
    .filter((e) =>
      e.detail.unitId && unit.id
        ? e.detail.unitId === unit.id
        : (e.detail.unitName || "") === unit.name
    )
    .slice()
    .sort((a, b) => (a.ts || 0) - (b.ts || 0))
    .forEach((e) => {
      const d = e.detail;
      if (d.kind === "off") {
        record({ ...blank(d), signedOffAt: e.ts || null });
        return;
      }
      // A swap that names the shift it came from is one person re-basing their
      // own window mid-seat, so it also closes the stay they were on before it.
      // The overtime on that line was worked past the end of the shift being
      // left, so it stays with that stay rather than opening the new one an hour
      // already in hand.
      if (d.kind === "swap" && d.fromShift && d.fromShift !== d.shift) {
        record({ ...blank(d), shift: d.fromShift, shiftStart: null, shiftEnd: null, signedOffAt: e.ts || null });
        record({ ...blank(d), overtimeMs: 0, signedOnAt: e.ts || null });
        return;
      }
      record({ ...blank(d), signedOnAt: e.ts || null });
    });

  ["alpha", "bravo"].forEach((slot) => {
    const seated = unit[slot];
    if (seated) {
      record({
        ...blank({ ...seated, seat: slot }),
        signedOnAt: seated.signedOnAt || null,
        overtimeMs: overtimeMs(seated, at),
        onDutyNow: true,
      });
    }
    const last = unit.lastCrew ? unit.lastCrew[slot] : null;
    if (last) {
      record({
        ...blank({ ...last, seat: slot }),
        signedOnAt: last.signedOnAt || null,
        signedOffAt: last.signedOffAt || null,
      });
    }
  });

  // Oldest stay first, so the medic's rows read down the sheet in the order the
  // seats actually changed hands. Anything with no recorded sign-on time sorts
  // last rather than pretending to be the first crew of the day.
  return Array.from(stays.values())
    // Someone who signed off and then took the same seat again on the same shift
    // is one stay holding an old sign-off time. They are sitting there now, so
    // the sign-off is dropped rather than left contradicting the duty column.
    .map((p) => (p.onDutyNow ? { ...p, signedOffAt: null } : p))
    .sort((a, b) => {
      const on = (p) => (p.signedOnAt == null ? Infinity : p.signedOnAt);
      if (on(a) !== on(b)) return on(a) - on(b);
      return String(a.seat).localeCompare(String(b.seat));
    });
}

// When a stay held the medic, for lining crew up against the calls they ran. A
// stay still open runs to the moment the export was taken.
function stayWindow(person, now) {
  const start = person.signedOnAt || person.shiftStart || null;
  const end = person.signedOffAt || (person.onDutyNow ? now : person.shiftEnd) || now;
  return { start, end };
}

// Every medic's crew stays, worked out once and reused for each call row rather
// than rebuilt from the log for each of them.
function medicCrewIndex(units, log, now) {
  return new Map(units.map((u) => [u.id, medicCrewStamps(u, log, now)]));
}

// The name stamps of whoever was signed into this medic while a call was running.
// A stay with no recorded sign-on time can't be placed against a call, so it is
// left out here rather than attributed to a call it may have had nothing to do
// with — the medic sheet still lists it in full.
function medicCrewStampsDuring(unit, crewIndex, from, to, now) {
  if (!unit || !from) return "";
  return (crewIndex.get(unit.id) || [])
    .filter((p) => {
      const w = stayWindow(p, now);
      return w.start && w.start <= (to || from) && w.end >= from;
    })
    .map((p) => crewStampText(unit.name, p))
    .filter(Boolean)
    .join(" / ");
}

// ---------- UHU (unit hour utilization) ----------
//
// UHU here is the straightforward "how long was this team tied up on calls"
// total: for every call a unit was assigned, the stretch from the moment
// dispatch assigned it until the crew went back in service. A call that is
// still running counts up to right now, so the total ticks live while a team
// is out.

// A unit's clock starts when dispatch assigns the call. Boards created before
// times.assigned existed fall back to when the call was created — the same
// instant for anything that was assigned as it was logged.
function callStartTs(req) {
  return (req.times && req.times.assigned) || req.createdAt || null;
}

function isCallLive(req) {
  return req.status !== "completed";
}

// Normally "Back in Service". If dispatch closed the call before the crew
// finished the timeline, the last stamp they did record is the honest end
// (and if there is none, the call contributed no measurable time) — anything
// else would leave an abandoned call inflating the total forever.
function callEndTs(req, now) {
  const t = req.times || {};
  if (t.backInService) return t.backInService;
  if (isCallLive(req)) return now;
  const stamps = TIME_STEPS.map((s) => t[s.timeKey]).filter(Boolean);
  return stamps.length > 0 ? Math.max(...stamps) : callStartTs(req);
}

function callBusyMs(req, now) {
  const start = callStartTs(req);
  if (!start) return 0;
  return Math.max(0, callEndTs(req, now) - start);
}

// One row per unit: total time on call, how many calls that covers, and the
// call it is on right now (if any) with that call's running time.
//
// A call a team was sent to as the second ambulance counts too — the truck was
// out and the crew were working, which is the whole point of the measure — but
// only for the stretch they were actually on it, not the call's full length.
// UHU is a measure of this shift, not of all time.
//
// It used to count every call on the board, so a fleet total read "18 calls"
// at the start of a shift that had run one — the rest were the shift before's.
// It also meant a crew who signed out and came back on overtime carried their
// old hours into their new tour, when for the purposes of the next shift they
// are a fresh crew starting at zero.
//
// So: only calls raised inside the current 12-hour window count, and the clock
// starts again at every changeover.
function uhuWindowStart(now) {
  return shiftWindowAt(now).start;
}

function computeUhu(units, requests, now) {
  const from = uhuWindowStart(now);
  const inShift = (requests || []).filter((r) => r && r.createdAt >= from);
  requests = inShift;
  return units.map((unit) => {
    const mine = requests.filter((r) => r.assignedUnitId === unit.id);
    const assisted = requests.filter(
      (r) => r.assignedUnitId !== unit.id && assistTeams(r).some((t) => t.unitId === unit.id)
    );
    const live = mine.find((r) => isCallLive(r)) || assisted.find((r) => isCallLive(r)) || null;
    const assistedMs = assisted.reduce((sum, r) => sum + assistBusyMs(r, unit.id, now), 0);
    return {
      unit,
      calls: mine.length + assisted.length,
      assistCalls: assisted.length,
      totalMs: mine.reduce((sum, r) => sum + callBusyMs(r, now), 0) + assistedMs,
      activeCall: live,
      activeMs: live
        ? live.assignedUnitId === unit.id
          ? callBusyMs(live, now)
          : assistBusyMs(live, unit.id, now)
        : 0,
    };
  });
}

// Builds a sheet matching the column layout of the hospital's own
// "DISPATCH LOG" template (FROM / TO / PT. MRN. / MEDIC TEAM / TRUCK / ...).
// FROM and TO are the pickup point and the destination the call was raised
// with; APPT. TIME is filled in for a call that came off the scheduled board
// and is blank for one phoned in on the spot. PCR AUTHOR is the crew member the
// team named as writing the patient care report for that call, stamped with the
// seat they were in. CAT. OF CALL and KILO METER carry the codes the desk or the
// crew put on the call (A/B/C/D/E/NA and the 1–5 loaded-distance band), as bare
// codes, because that is what the template's own columns expect — a call nobody
// coded leaves them blank exactly as before. The two columns this app still
// doesn't collect (TYPE OF SERVICE, ADDED SERVICE) are
// left blank for the same row so the sheet can still be completed by hand
// afterward. Five extra columns (Priority, Requirements, Shift, Shift Date, and
// the name stamps of the crew who were signed into that medic while the call
// ran) are appended at the end since they don't exist in the original template
// but are data this app already has. SHIFT names the 12-hour window the call
// belongs to and spells the window out — DAY (07:00 – 19:00) or
// NIGHT (19:00 – 07:00) — and SHIFT DATE is the day that window opened, so a
// night that runs past midnight stays one block on the sheet rather than
// splitting across two dates. MEDIC TEAM on its own only names a truck, so the
// stamp column is what ties each line to the people who ran it. The rest follow
// them for what the original sheet has no room for and a supervisor still has to
// be able to read back: whether anyone was actually transported, when the
// patient refused, any second team that was sent to help, the day the call ran
// (the time columns are clock times, and an export can cover more than one day),
// where the call stands, and — for a call that came off the scheduled board —
// the booking behind it.
//
// This is the one sheet in the export that carries a call. Everything the app
// holds about one goes on its row here and is not repeated on another sheet.
// The dispatch log, laid out as the department's own sheet lays it out.
//
// Column order, headings and spelling are taken from the log sheet in use, so a
// month exported from here drops into the same place in the same order as a
// month typed by hand. Where the app knows something the sheet asks for, it is
// filled; where it does not, the cell is left empty rather than guessed at.
//
// The night shift is shaded. A call raised after 19:00 belongs to the night, and
// on a printed month the two shifts were indistinguishable without reading every
// time — so the night's rows carry a black fill and white figures, which is how
// the department already marks them by hand.
function isNightCall(req) {
  return scheduledShiftKey(req && req.createdAt ? req.createdAt : 0) === "night";
}

// The service the call was run as, in the sheet's own vocabulary.
function serviceTypeFor(req) {
  const t = callTypeOf(req);
  if (!t) return "";
  if (t === "A") return "ALS";
  if (t === "B") return "BLS";
  if (t === "C") return "CCT";
  if (t === "D") return "E";
  if (t === "E") return "NA";
  return t;
}

// Fill a set of rows with a colour and a legible figure colour.
function paintRows(sheet, rows, offset, bg, fg) {
  if (!rows || !rows.length || !sheet["!ref"]) return sheet;
  const range = XLSX.utils.decode_range(sheet["!ref"]);
  rows.forEach((r) => {
    const rowIdx = r + (offset || 0);
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = sheet[XLSX.utils.encode_cell({ r: rowIdx, c })];
      if (!cell) continue;
      cell.s = {
        ...(cell.s || {}),
        fill: { patternType: "solid", fgColor: { rgb: bg } },
        font: { ...((cell.s || {}).font || {}), color: { rgb: fg }, bold: true },
      };
    }
  });
  return sheet;
}

// Paint the night shift. The row indices come back on the AOA itself, because
// only the builder knows which call belongs to which shift — by the time it is a
// sheet the times are strings.
function shadeNightRows(sheet, aoa, offset) {
  paintRows(sheet, (aoa && aoa.coverageRows) || [], offset, "FFC00000", "FFFFFFFF");
  const rows = (aoa && aoa.nightRows) || [];
  if (!rows.length) return sheet;
  const ref = sheet["!ref"];
  if (!ref) return sheet;
  const range = XLSX.utils.decode_range(ref);
  rows.forEach((r) => {
    const rowIdx = r + (offset || 0);
    for (let c = range.s.c; c <= range.e.c; c++) {
      const addr = XLSX.utils.encode_cell({ r: rowIdx, c });
      const cell = sheet[addr];
      if (!cell) continue;
      cell.s = {
        ...(cell.s || {}),
        fill: { patternType: "solid", fgColor: { rgb: "FF000000" } },
        font: { ...((cell.s || {}).font || {}), color: { rgb: "FFFFFFFF" }, bold: false },
      };
    }
  });
  return sheet;
}

function buildDispatchLogAOA(requests, units, crewIndex, scheduled, now, station, coverage) {
  // Section 1 as the sheet has it, with the two changes asked for: where the
  // patient is coming from leads the sheet rather than trailing it, and the call
  // category sits immediately after the category of call it qualifies.
  const header = [
    "Location where the patient is coming from",
    "Coming from?",
    "Transported to?",
    "MRN",
    "App. Time",
    "Dispatch time",
    "En-route time",
    "On-scene time",
    "Departure time",
    "Arrived on destination",
    "Back in service",
    "MEDIC TEAM",
    "TRUCK",
    "TYPE OF SERVICE",
    "KILO METER",
    "ADDED SERVICE",
    "CAT. OF CALL",
    "CALL CATEGORY",
    "CODES AND EMERGENCIES",
    "E-PCR AUTHOR",
    "BRAVO",
    // The derived intervals the sheet calculates for itself.
    "App to Dispatch",
    "Dispatch to En-route",
    "En-route to On-scene",
    "On-scene to Depart",
    "Departure to Arrival",
    "Arrival to Inservice",
    "Total Time",
    "RESPONSE TIME",
    "DISPATCH DATA ENTRY STATUS",
    // What the app records that the sheet has no column for, kept at the end so
    // the department's own columns stay exactly where they are.
    "SHIFT",
    "SHIFT DATE",
    "CALL DATE",
    "STATUS",
    "OUTCOME",
    "PT. REFUSED TIME",
    "REFUSED BY (NAME)",
    "REFUSED BY (NATIONAL ID)",
    "REFUSED BY (RELATION)",
    "RECEIVED BY (NAME)",
    "RECEIVER ID",
    "RECEIVER RECORDED BY",
    "REQUIREMENTS",
    "MEDIC CREW (NAME STAMPS)",
    "ASSISTING TEAM(S)",
    "ASSIST REQ. TIME",
    "ASSIST REQ. BY",
    "ASSIST STATUS",
    "BOOKED BY",
    "BOOKED AT",
    "READY CALL TAKEN",
    "BOOKING NOTES",
    "CLOSED BY",
    "CLOSE REASON",
    "STATION",
  ];

  const rowFor = (r) => {
    const unit = units.find((u) => u.id === r.assignedUnitId) || {};
    const t = r.times || {};
    const assist = assistOf(r);
    const shiftKey = scheduledShiftKey(r.createdAt);
    const shiftRun = shiftWindowFor(shiftKey, r.createdAt);
    const shift = shiftMeta(shiftKey);
    return [
      r.patientOrigin || "",
      callFrom(r),
      callTo(r),
      r.mrn || "",
      clockStr(r.scheduledFor),
      clockStr(r.createdAt),
      clockStr(t.enroute),
      clockStr(t.arrival),
      clockStr(t.departure),
      clockStr(t.arrivalDestination),
      clockStr(t.backInService),
      unit.name || "",
      unit.ambulanceNumber || "",
      serviceTypeFor(r),
      loadedKmOf(r) || "",
      r.addedService || "",
      r.callType || "",
      r.callCategory || "",
      r.emergencyCode || "",
      pcrAuthorStamp(r, unit),
      r.pcrAuthor && r.pcrAuthor.seat === "alpha"
        ? (unit.bravo ? unit.bravo.name : "")
        : (unit.alpha ? unit.alpha.name : ""),
      durationStr(r.scheduledFor, r.createdAt),
      durationStr(r.createdAt, t.enroute),
      durationStr(t.enroute, t.arrival),
      durationStr(t.arrival, t.departure),
      durationStr(t.departure, t.arrivalDestination),
      durationStr(t.arrivalDestination, t.backInService),
      durationStr(callStartTs(r), callEndTs(r, now)),
      durationStr(r.createdAt, t.arrival),
      // The sheet's own completeness check: a row with every time on it is done.
      t.enroute && t.arrival && t.backInService ? "Completed" : "Incomplete",
      shift ? `${shift.short} (${shift.window})` : "",
      shiftDateOf(shiftRun.start),
      gregDateStr(r.createdAt),
      r.status ? REQ_STATUS[r.status].label : "",
      callOutcomeLabel(r),
      clockStr(t[REFUSAL_TIME_KEY]),
      r.refusal ? r.refusal.name : "",
      r.refusal ? r.refusal.nationalId : "",
      r.refusal ? r.refusal.relation : "",
      r.receiver ? r.receiver.name : "",
      r.receiver ? r.receiver.receiverId : "",
      r.receiver ? r.receiver.takenBy : "",
      reqLabels(r).join(", "),
      medicCrewStampsDuring(unit, crewIndex, callStartTs(r), callEndTs(r, now), now),
      assistTeamNames(r, units),
      assist ? clockStr(assist.requestedAt) : "",
      assist ? assist.requestedByUnitName || assist.requestedBy || "" : "",
      assist ? (assist.status || "").toUpperCase() : "",
      r.scheduledBy || "",
      r.bookingCreatedAt ? gregDateTimeStr(r.bookingCreatedAt) : "",
      r.readyCalledAt ? gregDateTimeStr(r.readyCalledAt) : "",
      r.bookingNotes || "",
      r.closedBy || "",
      r.status === "completed" ? callCloseReason(r) || "Not recorded" : "",
      stationLabel(stationOf(r)),
    ];
  };

  const sorted = (requests || []).slice().sort((a, b) => a.createdAt - b.createdAt);

  // An export covering both stations keeps them apart on the page: the Main
  // Office's calls run first as their own numbered block, then CCC underneath as
  // a second one. Interleaving them by time made a sheet nobody could read down.
  const groups = station
    ? [{ key: station, rows: sorted }]
    : STATIONS.map((st) => ({ key: st.key, rows: sorted.filter((r) => stationOf(r) === st.key) })).filter(
        (g) => g.rows.length
      );

  const out = [
    [
      station
        ? `KFSH&RC AMBULANCE DISPATCH LOG — ${stationLabel(station).toUpperCase()}`
        : "KFSH&RC AMBULANCE DISPATCH LOG — ALL STATIONS",
    ],
    [],
  ];

  // Which rows are night calls, so the sheet can be shaded after it is built.
  const nightRows = [];
  // And which are periods with no ambulance available — these are the rows the
  // department will be asked about, so they are marked in red and carry the
  // sheet's own NO COVERAGE category rather than being invented as a new idea.
  const coverageRows = [];

  groups.forEach((g, gi) => {
    if (gi > 0) out.push([]);
    out.push([`${stationLabel(g.key).toUpperCase()} — ${g.rows.length} call${g.rows.length === 1 ? "" : "s"}`]);
    out.push(["#", ...header]);
    g.rows.forEach((r, idx) => {
      if (isNightCall(r)) nightRows.push(out.length);
      out.push([idx + 1, ...rowFor(r)]);
    });

    // The gaps for this station, under its calls, in the order they happened.
    const gaps = (coverage || []).filter((c) => c && c.station === g.key)
      .sort((a, b) => a.startedAt - b.startedAt);
    if (gaps.length) {
      out.push([]);
      out.push([`${stationLabel(g.key).toUpperCase()} — NO COVERAGE`]);
      out.push([
        "#", "STARTED", "ENDED", "DURATION", "TEAMS OUT", "DECLARED BY", "ENDED BY", "CALL CATEGORY", "DATE",
      ]);
      gaps.forEach((c, idx) => {
        coverageRows.push(out.length);
        out.push([
          idx + 1,
          clockStr(c.startedAt),
          c.endedAt ? clockStr(c.endedAt) : "STILL RUNNING",
          c.endedAt ? durationStr(c.startedAt, c.endedAt) : "",
          (c.unitsOut || []).join(", "),
          c.startedBy || "",
          c.endedBy || "",
          "NO COVERAGE",
          gregDateStr(c.startedAt),
        ]);
      });
    }
  });

  out.nightRows = nightRows;
  out.coverageRows = coverageRows;
  out.headerRows = [];
  return out;
}

// Every shift sign-on, sign-off, swap and overtime crossing, in the order it
// happened — the spreadsheet form of the log sheet's Shift Swaps tab, so a
// supervisor reading the export can see who handed over to whom and how much
// of it ran past the 12 hours.
function buildShiftHandoverRows(log) {
  return log
    .filter((e) => e.type === "shift")
    .slice()
    .reverse()
    .map((e) => {
      const d = e.detail || {};
      const from = shiftMeta(d.fromShift);
      const relieved = shiftMeta(d.relievedShift);
      return {
        Timestamp: e.ts ? gregDateTimeStr(e.ts) : e.time,
        Event: SHIFT_EVENTS[d.kind] ? SHIFT_EVENTS[d.kind].label : "SHIFT",
        Role: d.role === "team" ? "Crew" : d.role === "dispatcher" ? "Dispatcher" : "",
        Name: d.name || "",
        Team: d.unitName || "",
        Seat: d.seat ? seatLabel(d.seat) : "",
        Shift: shiftLabelWithWindow(d.shift),
        "Shift Date": shiftDateOf(d.shiftStart),
        "Shift Start": d.shiftStart ? gregDateTimeStr(d.shiftStart) : "",
        "Shift End": d.shiftEnd ? gregDateTimeStr(d.shiftEnd) : "",
        Overtime: d.overtimeMs ? msDurationStr(d.overtimeMs) : "",
        "Swapped From": from ? shiftLabelWithWindow(from.key) : "",
        Relieved: d.relievedName || "",
        "Relieved Shift": relieved ? shiftLabelWithWindow(relieved.key) : "",
        "Relieved Overtime": d.relievedOvertimeMs ? msDurationStr(d.relievedOvertimeMs) : "",
        Details: e.message || "",
      };
    });
}

// ---------- making the export readable when it opens ----------
//
// A generated sheet opens at Excel's default column width, which is about eight
// characters — narrower than a single timestamp, let alone a name stamp or a
// call comment. Every column in the export would land either clipped or spilling
// across its neighbour, and a supervisor would have to drag twenty-seven column
// edges before they could read the thing. So every sheet is measured before the
// workbook is written: each column takes the width of its longest value plus a
// small margin, and each row is given a little more height than the cramped
// default so text sits off the gridline.

// Breathing room either side of the longest value in a column.
const XL_COL_PADDING = 2.5;
// Nothing narrower than this, so a column of one-character values still shows
// its own heading, and nothing wider than this — one long free-text comment
// should not push the other twenty columns off the screen.
const XL_COL_MIN_WIDTH = 9;
const XL_COL_MAX_WIDTH = 80;
// Excel's default row is 15pt, which puts the text flush against the gridline.
const XL_ROW_HEIGHT = 17;
const XL_HEADER_ROW_HEIGHT = 19;

// What Excel will actually show in the cell: the formatted text where there is
// one, the raw value otherwise.
function xlCellText(cell) {
  if (!cell) return "";
  if (cell.w) return cell.w;
  if (cell.v === null || cell.v === undefined) return "";
  return String(cell.v);
}

// Capitals and digits are wider than lowercase in Excel's default font, and the
// headings in this export are all caps — measured at face value they are the
// first thing to get clipped.
function xlTextWidth(text) {
  let width = 0;
  for (const ch of text) width += /[A-Z0-9@#%&]/.test(ch) ? 1.15 : 1;
  return width;
}

// headerRow is the index of the row holding the column captions (0 for the
// sheets built from objects; further down on the DISPATCH LOG sheet, which
// carries a title and a date above its header). That row and anything above it
// get the taller height.
function autoFitSheet(ws, headerRow) {
  if (!ws || !ws["!ref"]) return ws;
  const range = XLSX.utils.decode_range(ws["!ref"]);
  const heading = headerRow || 0;

  const cols = [];
  for (let c = range.s.c; c <= range.e.c; c++) {
    let widest = 0;
    for (let r = range.s.r; r <= range.e.r; r++) {
      const text = xlCellText(ws[XLSX.utils.encode_cell({ r, c })]);
      if (text) widest = Math.max(widest, xlTextWidth(text));
    }
    cols.push({
      wch: Math.min(XL_COL_MAX_WIDTH, Math.max(XL_COL_MIN_WIDTH, Math.ceil(widest + XL_COL_PADDING))),
    });
  }
  ws["!cols"] = cols;

  const rows = [];
  for (let r = range.s.r; r <= range.e.r; r++) {
    rows.push({ hpt: r <= heading ? XL_HEADER_ROW_HEIGHT : XL_ROW_HEIGHT });
  }
  ws["!rows"] = rows;

  return ws;
}

// `station` is the station whose book this is, or null for an administrator
// exporting the department as a whole. When it is set, every sheet below is
// that station's and nothing else — the two stations keep separate log sheets,
// so an export that quietly mixed them would be worse than no export at all.
async function exportAndShareLog(log, requests, units, scheduled, station, coverage) {
  if (station) {
    units = atStation(units, station);
    requests = atStation(requests, station);
    scheduled = atStation(scheduled, station);
    // A log line belongs to the station of whoever wrote it. Lines written
    // before stations existed carry none, and belong to the Main Office.
    log = (log || []).filter((e) => stationOf(e) === station);
  }
  const wb = XLSX.utils.book_new();
  // A call still running, and a seat still held, are both measured up to the
  // moment the export was taken.
  const exportedAt = Date.now();
  // Who was signed into each medic, and when — every sheet that names a medic
  // stamps it from here.
  const crewIndex = medicCrewIndex(units, log, exportedAt);

  // ---------- one fact, one place ----------
  //
  // Each sheet below owns a different record: the calls, the event feed, the
  // medic utilisation, the shift changes, the forward book. Nothing that has
  // already been written on one of them is written again on another — a
  // supervisor reading the export should not have to work out which of five
  // tabs is the current one, and a duplicated column is a column that can
  // disagree with itself once anything is filtered or edited. Where a sheet
  // needs something another one owns, it says where to look instead of
  // repeating it.

  // Sheet 1: every call. Matches the hospital's own DISPATCH LOG template column
  // layout, with the fields the template has no room for appended after it. Its
  // captions sit on the fifth row, under the title, the export stamp and the
  // line naming the two shift windows.
  const dispatchAoa = buildDispatchLogAOA(requests, units, crewIndex, scheduled, exportedAt, station, coverage);
  const dispatchLogSheet = shadeNightRows(
    autoFitSheet(XLSX.utils.aoa_to_sheet(dispatchAoa), 4),
    dispatchAoa,
    0
  );
  XLSX.utils.book_append_sheet(wb, dispatchLogSheet, "DISPATCH LOG");

  // Sheet 2: the chronological event feed (assignments, status changes, etc),
  // each line carrying the name stamp of whoever was signed in when it was
  // written — the spreadsheet form of the log sheet's name stamps.
  //
  // This is now the full record rather than a copy of one. The log sheet on the
  // boards only shows acknowledgements and en-route stamps, so everything else
  // dispatch and the crews did during the shift is read back here and nowhere
  // else. Each line is filed against the 12-hour window it happened in — day
  // 07:00–19:00, night 19:00–07:00 the next morning — and against the date that
  // window opened, so sorting or filtering on Shift Date gives one shift at a
  // time even when the night crosses midnight. "On Log Sheet" marks the lines
  // that were also visible live on the board.
  //
  // Shift lines are left out here: the Shift Handover sheet already carries
  // every one of them, message and all, broken out into columns. They are on
  // that sheet, not on both.
  const logRows = log
    .slice()
    .reverse()
    .filter((entry) => entry.type !== "shift")
    .map((entry) => {
      const ts = entry.ts || null;
      const w = ts ? shiftWindowAt(ts) : null;
      return {
        Timestamp: ts ? gregDateTimeStr(ts) : entry.time,
        Shift: w ? shiftLabelWithWindow(w.key) : "",
        "Shift Date": w ? shiftDateOf(w.start) : "",
        "Shift Ran": w ? `${gregDateTimeStr(w.start)} – ${gregDateTimeStr(w.end)}` : "",
        Type: entry.type || "",
        Message: entry.message || "",
        "On Log Sheet": isBoardLogEntry(entry) ? "Yes" : "No",
        "Logged By": entry.actor && entry.actor.name ? entry.actor.name : "",
        Post: actorPost(entry.actor),
        Station: stationLabel(stationOf(entry)),
      };
    });
  const eventLogSheet = autoFitSheet(
    logRows.length > 0
      ? XLSX.utils.json_to_sheet(logRows)
      : XLSX.utils.aoa_to_sheet([["Nothing logged yet apart from shift changes — see the Shift Handover sheet."]]),
    0
  );
  XLSX.utils.book_append_sheet(wb, eventLogSheet, "Event Log");

  // Sheet 3: UHU — how long each medic was tied up on calls, with a name stamp
  // against every one of them. A call still running is counted up to the moment
  // the export was taken.
  //
  // One row per medic per employee who was signed into it: a medic number worked
  // by two crews over the day is listed twice, once under each name, rather than
  // collapsing them into a single cell nobody can read back. The medic's own
  // totals (calls, time on call) sit on the first of its rows only — repeating
  // them down the group would make a plain SUM of the column count the same
  // minutes once per crew member.
  //
  // There is no Seat column: the seat is part of the name stamp already
  // ("R. CHEN (MEDIC 3 · ALPHA)"), and writing it twice on one row is one more
  // cell that can be filtered out of agreement with the other.
  //
  // The sign-on, sign-off and overtime of each stay do stay here even though the
  // Shift Handover sheet also records shift events, because a stay can be
  // reconstructed from a seat that is filled right now, or from unit.lastCrew,
  // with no shift line behind it — for those this sheet is the only record there
  // is, and dropping the columns would lose them rather than deduplicate them.
  const uhuRows = [];
  computeUhu(units, requests, exportedAt).forEach((row) => {
    const stamps = crewIndex.get(row.unit.id) || [];
    const totals = {
      Calls: row.calls,
      "Total Time On Call": msDurationStr(row.totalMs),
      "Total Minutes On Call": Math.round(row.totalMs / 60000),
      "On A Call Now": row.activeCall ? "Yes" : "No",
    };
    const blankTotals = { Calls: "", "Total Time On Call": "", "Total Minutes On Call": "", "On A Call Now": "" };
    const identity = {
      Medic: row.unit.name,
      "Ambulance Number": row.unit.ambulanceNumber || "",
    };

    // A medic nobody has ever signed into still gets its line, said plainly, so
    // an empty stamp is never mistaken for a missing row.
    if (stamps.length === 0) {
      uhuRows.push({
        ...identity,
        "Name Stamp": "No crew signed in",
        "Crew Member": "",
        "Employee ID": "",
        Shift: "",
        "Shift Date": "",
        "Signed On": "",
        "Signed Off": "",
        Overtime: "",
        "On Duty Now": "No",
        ...totals,
      });
      return;
    }

    stamps.forEach((p, i) => {
      uhuRows.push({
        ...identity,
        "Name Stamp": crewStampText(row.unit.name, p),
        "Crew Member": p.name,
        "Employee ID": p.accountId || "",
        Shift: shiftLabelWithWindow(p.shift),
        "Shift Date": shiftDateOf(p.shiftStart),
        "Signed On": p.signedOnAt ? gregDateTimeStr(p.signedOnAt) : "",
        "Signed Off": p.signedOffAt ? gregDateTimeStr(p.signedOffAt) : p.onDutyNow ? "Still signed on" : "",
        Overtime: p.overtimeMs ? msDurationStr(p.overtimeMs) : "",
        "On Duty Now": p.onDutyNow ? "Yes" : "No",
        ...(i === 0 ? totals : blankTotals),
      });
    });
  });
  const uhuSheet = autoFitSheet(XLSX.utils.json_to_sheet(uhuRows), 0);
  XLSX.utils.book_append_sheet(wb, uhuSheet, "UHU & Name Stamps");

  // Sheet 4: shift sign-ons, sign-offs, swaps and overtime — who was on which
  // shift, and who handed over to whom. The only place in the export that
  // carries a shift line.
  const handoverRows = buildShiftHandoverRows(log);
  const handoverSheet = autoFitSheet(
    handoverRows.length > 0
      ? XLSX.utils.json_to_sheet(handoverRows)
      : XLSX.utils.aoa_to_sheet([["No shift changes recorded yet."]]),
    0
  );
  XLSX.utils.book_append_sheet(wb, handoverSheet, "Shift Handover");

  // Sheet 5: the forward book — the bookings that have not gone out yet, the
  // ones still waiting on the ward's phone call, and the ones that were
  // cancelled before an ambulance was raised.
  //
  // A booking that has already been dispatched is a call, and its whole row is
  // on the DISPATCH LOG sheet — transfer details and booking side alike (booked
  // by, booked at, the ready call, the notes). Those are left out here rather
  // than written a second time under a different heading, so a transfer is only
  // ever on one sheet: on this one while it is still planned, on the DISPATCH
  // LOG once it has actually gone out.
  const onDispatchLog = (s) =>
    requests.some((r) => r && (r.scheduledId === s.id || (s.releasedRequestId && r.id === s.releasedRequestId)));
  const scheduledRows = (scheduled || [])
    .filter((s) => s && !onDispatchLog(s))
    .slice()
    .sort((a, b) => (a.scheduledFor || 0) - (b.scheduledFor || 0))
    .map((s) => {
      const unit = units.find((u) => u.id === (s.releasedUnitId || s.assignedUnitId));
      // A booking taken without a time belongs to no shift until the ward calls,
      // so both columns say so rather than guessing at one.
      const shiftKey = s.scheduledFor ? s.shift || scheduledShiftKey(s.scheduledFor) : null;
