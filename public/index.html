}

// ---------- completed calls ----------
//
// Closing a call used to take it off the board completely: the card vanished
// from the desk and the crew's screen, and the only trace left was a sentence
// on the log sheet. Nothing was ever deleted — every call raised is still in
// `ems:requests` — so completed calls are kept on the board instead, where
// dispatch and admin can go back over the shift with the full timeline, the
// team that ran the call and how long it tied them up. Crews still only see
// the call they are on now.
// ---------- the escalation banner and its thread ----------
//
// The banner sits in the top-right corner of the call card, beside the priority
// pill — the one part of every card that is the same everywhere, so a crew
// looking for it always look in the same place whether the call is live on
// their tablet or three weeks deep in their history. It is deliberately quiet
// until there is something on it: an escalation is rare, and a loud red button
// on every card would be pressed by accident on a moving ambulance.
function EscalationChip({ req, viewer, open, onToggle }) {
  if (!viewer) return null;
  const mine = visibleEscalations(req, viewer);
  const canRaise = canRaiseEscalationOn(req, viewer);
  if (mine.length === 0 && !canRaise) return null;

  // What the chip reports is the issue that still wants something doing: the
  // oldest one nobody has closed. Only once they are all resolved does it fall
  // back to the last thing that happened.
  const unresolved = mine.filter(escalationIsOpen);
  const headline = unresolved[0] || mine[mine.length - 1];
  const meta = headline ? escalationStateMeta(headline, viewer.role) : null;
  const extra = mine.length > 1 ? ` ·${mine.length}` : "";

  if (!headline) {
    return (
      <button style={styles.escChipQuiet} onClick={onToggle} title="Report a problem with this call to the admins">
        <ShieldAlert size={11} /> {open ? "CLOSE" : "ESCALATE"}
      </button>
    );
  }
  return (
    <button
      style={{ ...styles.escChip, borderColor: meta.color, color: meta.color, background: `${meta.color}1F` }}
      onClick={onToggle}
      title={`${mine.length} issue${mine.length === 1 ? "" : "s"} escalated on this call`}
    >
      <ShieldAlert size={11} /> ISSUE {meta.label}{extra}
    </button>
  );
}

// The thread itself, opened from the chip and drawn at the foot of the card it
// belongs to. Everything about one call's issues is here: what was raised, who
// raised it, what the admins said back, and — for an admin — the reply box and
// the button that closes it off.
function EscalationThread({ req, viewer, requests, saveRequests, addLog, onClose }) {
  const [draft, setDraft] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [replyFor, setReplyFor] = useState(null);
  const [replyDraft, setReplyDraft] = useState("");

  if (!viewer) return null;
  const mine = visibleEscalations(req, viewer);
  const canRaise = canRaiseEscalationOn(req, viewer);
  const isAdmin = viewer.role === "admin";

  async function submitNew() {
    const text = draft.trim();
    if (!text) {
      setError("Write what went wrong before sending it.");
      return;
    }
    setBusy(true);
    setError("");
    const ok = await raiseEscalation({ req, message: text, viewer, requests, saveRequests, addLog });
    setBusy(false);
    if (!ok) {
      setError("That didn't send. Try again.");
      return;
    }
    setDraft("");
  }

  async function submitReply(escId) {
    const text = replyDraft.trim();
    if (!text) return;
    setBusy(true);
    await replyToEscalation({ req, escId, message: text, viewer, requests, saveRequests, addLog });
    setBusy(false);
    setReplyDraft("");
    setReplyFor(null);
  }

  async function toggleResolved(esc) {
    setBusy(true);
    await setEscalationResolution({
      req,
      escId: esc.id,
      resolved: escalationIsOpen(esc),
      viewer,
      requests,
      saveRequests,
      addLog,
    });
    setBusy(false);
  }

  return (
    <div style={styles.escPanel}>
      <div style={styles.escPanelHead}>
        <span style={styles.escPanelTitle}>
          <ShieldAlert size={12} /> ESCALATED TO ADMIN
        </span>
        {onClose && (
          <button style={styles.ghostBtnSm} onClick={onClose}>
            Close
          </button>
        )}
      </div>

      {mine.length === 0 && (
        <div style={styles.escEmpty}>
          Nothing has been escalated on this call.
        </div>
      )}

      {mine.map((esc) => {
        const meta = escalationStateMeta(esc, viewer.role);
        const replies = escalationReplies(esc);
        return (
          <div key={esc.id} style={styles.escItem}>
            <div style={styles.escItemHead}>
              <span style={{ ...styles.escStatePill, borderColor: meta.color, color: meta.color }}>{meta.label}</span>
              <span style={styles.escItemWhen}>{gregShortDateTimeStr(esc.raisedAt)}</span>
              <span style={styles.escItemWho}>
                {esc.unitName || "—"}
                {esc.by && esc.by.name ? ` · ${esc.by.name}` : ""}
                {esc.by && esc.by.seat ? ` (${seatLabel(esc.by.seat)})` : ""}
              </span>
              {esc.afterClose && <span style={styles.escAfterTag}>RAISED AFTER THE CALL CLOSED</span>}
            </div>
            <div style={styles.escMessage}>{esc.message}</div>

            {replies.length > 0 && (
              <div style={styles.escReplies}>
                {replies.map((r) => (
                  <div key={r.id} style={r.role === "admin" ? styles.escReplyAdmin : styles.escReplyTeam}>
                    <div style={styles.escReplyHead}>
                      {r.role === "admin" ? "ADMIN" : "TEAM"}
                      {r.byName ? ` · ${r.byName}` : ""} · {gregShortDateTimeStr(r.ts)}
                    </div>
                    <div style={styles.escReplyBody}>{r.message}</div>
                  </div>
                ))}
              </div>
            )}

            {!escalationIsOpen(esc) && (
              <div style={styles.escResolvedNote}>
                Closed off{esc.resolvedBy ? ` by ${esc.resolvedBy}` : ""}
                {esc.resolvedAt ? ` · ${gregShortDateTimeStr(esc.resolvedAt)}` : ""}
              </div>
            )}

            <div style={styles.escItemActions}>
              {replyFor === esc.id ? (
                <React.Fragment>
                  <textarea
                    style={styles.escTextarea}
                    rows={2}
                    maxLength={ESCALATION_MAX}
                    value={replyDraft}
                    onChange={(e) => setReplyDraft(e.target.value)}
                    placeholder={isAdmin ? "Your reply to the crew…" : "Add to what you reported…"}
                  />
                  <button style={styles.primaryBtnSm} disabled={busy} onClick={() => submitReply(esc.id)}>
                    Send reply
                  </button>
                  <button
                    style={styles.ghostBtnSm}
                    onClick={() => {
                      setReplyFor(null);
                      setReplyDraft("");
                    }}
                  >
                    Cancel
                  </button>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <button
                    style={styles.ghostBtnSm}
                    onClick={() => {
                      setReplyFor(esc.id);
                      setReplyDraft("");
                    }}
                  >
                    <Reply size={12} /> {isAdmin ? "Reply to the crew" : "Add a note"}
                  </button>
                  {isAdmin && (
                    <button style={styles.ghostBtnSm} disabled={busy} onClick={() => toggleResolved(esc)}>
                      {escalationIsOpen(esc) ? (
                        <React.Fragment>
                          <CheckCircle2 size={12} /> Mark resolved
                        </React.Fragment>
                      ) : (
                        "Reopen"
                      )}
                    </button>
                  )}
                </React.Fragment>
              )}
            </div>
          </div>
        );
      })}

      {canRaise && (
        <div style={styles.escComposer}>
          <div style={styles.escComposerHead}>
            {mine.length > 0 ? "RAISE ANOTHER ISSUE ON THIS CALL" : "WHAT WENT WRONG ON THIS CALL?"}
          </div>
          {mine.length > 0 && (
            <div style={styles.escPrivacyNote}>
              This starts a brand-new issue, separate from the one(s) above. To continue an existing
              conversation instead, use "{isAdmin ? "Reply to the crew" : "Add a note"}" on that issue.
            </div>
          )}
          <textarea
            style={styles.escTextarea}
            rows={3}
            maxLength={ESCALATION_MAX}
            value={draft}
            onChange={(e) => setDraft(e.target.value)}
            placeholder="e.g. Ward would not release the patient for 40 minutes and the lift was out of service."
          />
          {error && <div style={styles.loginError}>{error}</div>}
          <div style={styles.escComposerActions}>
            <span style={styles.escPrivacyNote}>
              Goes to the admins only. Dispatch and the other teams never see it. You'll see their reply
              here on this call.
            </span>
            <button style={styles.primaryBtnSm} disabled={busy || !draft.trim()} onClick={submitNew}>
              <ShieldAlert size={13} /> Escalate to admin
            </button>
          </div>
        </div>
      )}

      {!canRaise && isAdmin && mine.length > 0 && (
        <div style={styles.escPrivacyNote}>
          Only the crew member who raised each issue can read your reply. It is not on the dispatch log
          and it is not on the shared spreadsheet.
        </div>
      )}
    </div>
  );
}

// Every open issue on the board, on the admin's screen, without them having to
// find the call it was raised on first. An issue raised on a call that closed
// last month would otherwise be somewhere near the bottom of a list of
// hundreds — which is exactly how a complaint goes unanswered.
function EscalationInbox({ requests, units, viewer, saveRequests, addLog }) {
  const [openFor, setOpenFor] = useState(null);
  const [busyFor, setBusyFor] = useState(null);
  const seenRef = useRef(null);

  // What still needs the admin and nothing else. An issue they have already
  // answered, and an issue they have closed off, are both dealt with as far as
  // this screen is concerned, and keeping either here buries the two that still
  // need a reply under a fortnight of ones that don't — an inbox that never
  // empties stops being read. Answering or resolving one takes it off this
  // screen the moment it happens, and nothing is lost by that: the issue stays
  // on the call it was raised on, with its whole thread, and the call list
  // further down finds it again under "Escalated only" — live calls included.
  // If the crew write back after the admin's reply, it returns here — that is
  // the case where something is genuinely waiting again.
  const rows = escalatedCalls(requests, viewer, { pendingOnly: true });
  const pendingCount = pendingEscalationCount(requests, viewer);

  // The one thread the admin has unfolded stays on screen even after it stops
  // waiting on them — a card vanishing out from under the reply that was just
  // sent is disorienting, and they may still want to close it off before they
  // move on. It goes the moment they close the thread.
  const openRow =
    openFor && !rows.some((r) => r.req.id === openFor)
      ? escalatedCalls(requests, viewer).find((r) => r.req.id === openFor)
      : null;
  const shownRows = openRow ? rows.concat([openRow]) : rows;

  // A new issue landing while an admin is looking at something else. The first
  // pass only records what is already there — signing in to a fortnight of
  // history must not set off a fortnight of notifications. It follows the same
  // "waiting on the admin" rule as the list, so a crew coming back on a thread
  // the admin had answered is announced the same way the first message was.
  useEffect(() => {
    if (!viewer || viewer.role !== "admin") return;
    const ids = new Set();
    const fresh = [];
    (requests || []).forEach((req) => {
      escalationsOf(req)
        .filter(escalationAwaitsAdmin)
        .forEach((esc) => {
          ids.add(esc.id);
          if (seenRef.current && !seenRef.current.has(esc.id)) fresh.push({ req, esc });
        });
    });
    if (seenRef.current) fresh.forEach(({ req, esc }) => notifyEscalation(req, esc));
    seenRef.current = ids;
  }, [requests, viewer && viewer.role]);

  if (!viewer || viewer.role !== "admin") return null;

  // Closing an issue off without opening the thread first. Most of them are
  // read on the card and want nothing back, and making an admin unfold a thread
  // to press one button is how an inbox fills up.
  async function resolveAll(req, escalations) {
    setBusyFor(req.id);
    for (const esc of escalations.filter(escalationIsOpen)) {
      await setEscalationResolution({
        req,
        escId: esc.id,
        resolved: true,
        viewer,
        requests,
        saveRequests,
        addLog,
      });
    }
    setBusyFor(null);
  }

  return (
    <div>
      <div style={styles.sectionHeaderRow}>
        <div style={{ ...styles.sectionHeader, margin: 0 }}>
          <ShieldAlert size={14} style={{ marginRight: 6, verticalAlign: -2 }} /> ESCALATED ISSUES
          {pendingCount > 0 ? ` (${pendingCount} WAITING)` : ""}
        </div>
      </div>

      {shownRows.length === 0 ? (
        <div style={styles.emptyState}>
          Nothing waiting. Anything a crew escalates on a call — live or closed — lands here and drops
          off again as soon as you reply to it or mark it resolved. Answered and resolved issues stay on
          their call and are found under "Escalated only" in the call list below, whether that call is
          still running or long since closed.
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {shownRows.map(({ req, escalations }) => {
            const unit = units.find((u) => u.id === req.assignedUnitId);
            const isOpen = openFor === req.id;
            const headline =
              escalations.filter(escalationAwaitsAdmin)[0] ||
              escalations.filter(escalationIsOpen)[0] ||
              escalations[escalations.length - 1];
            const meta = escalationStateMeta(headline, "admin");
            return (
              <div key={req.id} style={{ ...styles.callCard, borderLeftColor: meta.color }}>
                <div style={styles.callCardTop}>
                  <div style={styles.callCardNature}>{req.nature}</div>
                  <div style={styles.callCardTopRight}>
                    <span style={{ ...styles.escStatePill, borderColor: meta.color, color: meta.color }}>
                      {meta.label}
                      {escalations.length > 1 ? ` ·${escalations.length}` : ""}
                    </span>
                  </div>
                </div>
                <div style={styles.callCardMeta}>
                  <CallRoute req={req} />
                  <span style={styles.callCardMetaItem}>
                    <Clock size={12} /> {gregShortDateTimeStr(headline.raisedAt)}
                  </span>
                  <span style={styles.assignedTag}>{headline.unitName || (unit ? unit.name : "—")}</span>
                  {headline.by && headline.by.name && (
                    <span style={styles.escByTag}>{headline.by.name}</span>
                  )}
                  <span style={{ ...styles.pill, background: REQ_STATUS[req.status] ? REQ_STATUS[req.status].color : "#64748B" }}>
                    {REQ_STATUS[req.status] ? REQ_STATUS[req.status].label : "—"}
                  </span>
                </div>
                {!isOpen && <div style={styles.escPreview}>{headline.message}</div>}
                <div style={styles.callCardActions}>
                  <button style={styles.ghostBtnSm} onClick={() => setOpenFor(isOpen ? null : req.id)}>
                    <MessageSquare size={12} /> {isOpen ? "Hide the thread" : "Open and reply"}
                  </button>
                  {!isOpen && (
                    <button
                      style={styles.ghostBtnSm}
                      disabled={busyFor === req.id}
                      onClick={() => resolveAll(req, escalations)}
                      title="Close this off and take it off the inbox"
                    >
                      <CheckCircle2 size={12} />{" "}
                      {escalations.length > 1 ? `Mark all ${escalations.length} resolved` : "Mark resolved"}
                    </button>
                  )}
                </div>
                {isOpen && (
                  <EscalationThread
                    req={req}
                    viewer={viewer}
                    requests={requests}
                    saveRequests={saveRequests}
                    addLog={addLog}
                    onClose={() => setOpenFor(null)}
                  />
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

const HISTORY_PAGE = 15;

// When a call actually finished: the crew's "Back in Service" stamp, or the
// moment the desk closed it, or — for a call abandoned part-way through — the
// last thing that was stamped on it.
function callClosedTs(req) {
  const t = req.times || {};
  if (t.backInService) return t.backInService;
  if (req.closedAt) return req.closedAt;
  const stamps = TIME_STEPS.map((s) => t[s.timeKey]).filter(Boolean);
  return stamps.length > 0 ? Math.max(...stamps) : req.createdAt || 0;
}

// A closed call is still an unfinished row on the sheet if nobody put a call
// type or a distance on it. `saveRequests`/`addLog`/`user` are optional: hand
// them in from a desk that is allowed to correct the record (dispatch, admin)
// and each closed card grows the same coding picker the live cards have; leave
// them out and the history stays exactly as read-only as it was.
//
// `unitId` narrows the list to the calls one medic ran or assisted on. Crews
// used to lose a call the moment it closed, which left them with no way to
// check back on a timeline they had just stamped — a crew asked about a
// transfer an hour later had to phone the desk. With it set they get their own
// closed calls, read-only: the record is theirs to look at, not to rewrite.
//
// `shiftWindow` narrows it further, to calls that closed inside one 12-hour
// window. A medic number is not a crew: the same MEDIC 3 is worked by two or
// three different pairs across a day, so the unfiltered history of a truck is
// mostly other people's work. A crew reading back what they ran wants this
// shift and nothing else, so their tablet passes their own window in and the
// list starts open — it is short enough to read without unfolding anything.
// The desk passes nothing and keeps the whole history, which is the record.
// "2026-08-01" for whatever day this timestamp fell on locally — the key the
// history filter compares against, and the key the day picker below hands back.
function localDayKey(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const m = `${d.getMonth() + 1}`.padStart(2, "0");
  const day = `${d.getDate()}`.padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}

// And back again, to local midnight. Parsed by hand rather than handed to
// `new Date("2026-08-01")`, which the language reads as UTC — a desk on +03
// would get the evening before.
function dayKeyToTs(key) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key || "");
  if (!m) return 0;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 0, 0, 0, 0).getTime();
}

// Picking the day to search the history on.
//
// This was an <input type="date">, and the browser draws that one in whatever
// calendar the device is set to: on a Mac or a tablet set to an Arabic locale
// the admin and the crews got a Hijri picker reading "19 Safar 1448", while the
// dispatcher booking a transfer two panels away was picking "2 August 2026" out
// of a Gregorian grid. One board, one day, two calendars, and no way to line
// them up. So this is the dispatcher's own month grid — the same helpers, the
// same Gregorian month labels and Latin digits — cut down to a date on its own
// and used by every side of the board.
function DayPicker({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const selectedTs = dayKeyToTs(value);
  const [monthAnchor, setMonthAnchor] = useState(() => startOfMonth(selectedTs || Date.now()));
  const wrapRef = useRef(null);

  // Follow the value when it is set from somewhere else — "Clear filters" up in
  // the toolbar, or a day chosen while the grid was showing another month.
  useEffect(() => {
    if (selectedTs) setMonthAnchor(startOfMonth(selectedTs));
  }, [selectedTs]);

  // Anywhere else on the page closes it. A popover over a list of calls that
  // stays up until you press it again is in the way of the thing you opened it
  // to look at.
  useEffect(() => {
    if (!open) return undefined;
    function onDown(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", onDown);
    return () => document.removeEventListener("mousedown", onDown);
  }, [open]);

  const today = startOfDay(Date.now());

  function pick(dayTs) {
    onChange(localDayKey(dayTs));
    setOpen(false);
  }

  return (
    <div style={styles.dayPickerWrap} ref={wrapRef}>
      <button
        type="button"
        style={value ? styles.dayPickerBtnOn : styles.dayPickerBtn}
        onClick={() => setOpen((o) => !o)}
        title="Calls that closed on this date"
      >
        <CalendarClock size={11} /> {value ? gregDateStr(selectedTs) : "Any date"}
      </button>

      {open && (
        <div style={styles.dayPickerPop}>
          <div style={styles.calHeader}>
            <button
              type="button"
              style={styles.calNavBtn}
              onClick={() => setMonthAnchor((m) => addMonths(m, -1))}
              aria-label="Previous month"
            >
              ‹
            </button>
            <div style={styles.calMonthLabel}>
              {MONTH_LABELS[new Date(monthAnchor).getMonth()]} {new Date(monthAnchor).getFullYear()}
            </div>
            <button
              type="button"
              style={styles.calNavBtn}
              onClick={() => setMonthAnchor((m) => addMonths(m, 1))}
              aria-label="Next month"
            >
              ›
            </button>
          </div>
          <div style={styles.calWeekRow}>
            {WEEKDAY_LABELS.map((d) => (
              <div key={d} style={styles.calWeekday}>{d.slice(0, 2)}</div>
            ))}
          </div>
          {monthGrid(monthAnchor).map((week, i) => (
            <div key={i} style={styles.calWeekRow}>
              {week.map((dayTs) => {
                const inMonth = new Date(dayTs).getMonth() === new Date(monthAnchor).getMonth();
                // Nothing has closed tomorrow, so tomorrow is not a search.
                const ahead = dayTs > today;
                return (
                  <button
                    type="button"
                    key={dayTs}
                    disabled={ahead}
                    onClick={() => pick(dayTs)}
                    style={{
                      ...styles.calDay,
                      ...(inMonth ? null : styles.calDayOutside),
                      ...(ahead ? styles.calDayPast : null),
                      ...(dayTs === today ? styles.calDayToday : null),
                      ...(selectedTs === dayTs ? styles.calDaySelected : null),
                    }}
                  >
                    {new Date(dayTs).getDate()}
                  </button>
                );
              })}
            </div>
          ))}
          <div style={styles.quickPickRow}>
            <button type="button" style={styles.quickPickBtn} onClick={() => pick(today)}>
              Today
            </button>
            <button type="button" style={styles.quickPickBtn} onClick={() => pick(today - 86400000)}>
              Yesterday
            </button>
            <button
              type="button"
              style={styles.quickPickBtn}
              onClick={() => {
                onChange("");
                setOpen(false);
              }}
            >
              Any date
            </button>
            <span style={styles.whenCalTag}>Gregorian</span>
          </div>
        </div>
      )}
    </div>
  );
}

// Everything about a call that somebody might type into the history search.
// Names are the point of it: "who was on it" is how a call is remembered a week
// later, and the names this board actually holds against a call are the one on
// the patient care report, whoever closed it, whoever recorded a refusal, and
// whoever escalated an issue on it. The medic and the ambulance number are in
// here too, so a search for "MEDIC 3" or an amb number works the same way.
function callSearchText(req, units, escalations) {
  const unit = (units || []).find((u) => u.id === req.assignedUnitId);
  const parts = [
    req.nature,
    callFrom(req),
    callTo(req),
    req.mrn,
    req.notes,
    unit ? unit.name : "",
    unit && unit.ambulanceNumber ? `amb ${unit.ambulanceNumber}` : "",
    pcrAuthorText(req),
    req.closedBy,
    req.refusedBy,
    callCloseReason(req),
    assistTeamNames(req, units),
    gregDateStr(callClosedTs(req)),
  ];
  (escalations || []).forEach((e) => {
    parts.push(e.message, e.unitName, e.by && e.by.name, e.resolvedBy);
    escalationReplies(e).forEach((r) => parts.push(r.message, r.byName));
  });
  return parts.filter(Boolean).join(" ").toLowerCase();
}

function CompletedCalls({ requests, units, saveRequests, addLog, user, unitId, shiftWindow, viewer, canCorrect }) {
  const [open, setOpen] = useState(!!shiftWindow);
  // The reminder starts open — it is worth reading once — and folds away
  // for the rest of the shift once the desk has taken it in.
  const [bulbOpen, setBulbOpen] = useState(true);
  const [shown, setShown] = useState(HISTORY_PAGE);
  const [codingFor, setCodingFor] = useState(null);
  // Which call has the correction form open, keyed by id for the same reason
  // the coding picker is: this list is a map over calls.
  const [editFor, setEditFor] = useState(null);

  async function applyEdits(req, changes, note) {
    const ok = await applyCallEditsTo({
      req, changes, note,
      who: user && user.name ? user.name : "Dispatch",
      requests, saveRequests, addLog,
    });
    if (ok) setEditFor(null);
  }

  async function proposeEdits(req, changes, note) {
    const ok = await proposeCallEditsTo({
      req, changes, note, viewer,
      requests, saveRequests, addLog,
    });
    if (ok) setEditFor(null);
  }

  // The handover, recorded on a call that has already closed. Unlike the coded
  // fields this is not a correction to something the desk decided — it is the
  // crew stating who they handed the patient to, which only they can know. It is
  // stamped with whoever entered it either way.
  // Which of these calls the sheet still wants something from.
  //
  // A desk is answerable for its own twelve hours and no more. Showing them
  // every gap the department has ever left turns the banner into wallpaper —
  // and the gaps from Tuesday night belong to the desk that worked Tuesday
  // night, who are the only people who can still remember the call.
  //
  // Administration is the exception: they are looking at the department rather
  // than a shift, and the point of their view is to see what is outstanding
  // across all of it.
  const incomplete = React.useMemo(() => {
    if (!canCorrect) return [];
    const all = callsNeedingDetail(requests);
    if (!user || user.role !== "dispatcher") return all;
    const from = user.shiftStart || shiftWindowAt(Date.now()).start;
    const to = user.shiftEnd || from + SHIFT_MS;
    return all.filter((r) => r.createdAt >= from && r.createdAt < to);
  }, [requests, canCorrect, user && user.shiftStart, user && user.shiftEnd, user && user.role]);

  async function saveReceiverOn(req, { name, receiverId }) {
    const who = user && user.name ? user.name : "Crew";
    const fresh = await readKey("ems:requests", requests);
    await saveRequests(
      fresh.map((r) =>
        r.id === req.id
          ? {
              ...r,
              receiver: {
                name,
                receiverId,
                takenBy: who,
                takenAt: Date.now(),
                unitName: viewer ? viewer.unitName || "" : "",
                afterClose: true,
              },
            }
          : r
      )
    );
    await addLog(
      `${who} recorded the receiver for "${req.nature}" after the call closed — ${name} (ID ${receiverId})`,
      "status"
    );
  }

  async function verifyEdit(req, entry, accept) {
    await verifyCallEditOn({
      req, entry, accept,
      who: user && user.name ? user.name : "Dispatch",
      requests, saveRequests, addLog,
    });
  }

  // The escalation thread is opened one call at a time, keyed by call id — the
  // same shape the coding picker uses, and for the same reason: this list is a
  // map over calls, so the state that belongs to a row has to live up here.
  const [escFor, setEscFor] = useState(null);

  // The four ways of finding a call again: a word (a name, a medic, a ward, a
  // nature), the day it closed on, whether an issue was ever raised on it, and
  // whether it was called off rather than run.
  const [query, setQuery] = useState("");
  const [day, setDay] = useState("");
  const [escOnly, setEscOnly] = useState(false);
  const [cancelledOnly, setCancelledOnly] = useState(false);
  // A crew's list is their current shift by default, because that is what they
  // want nine times in ten. This is the door out of it.
  const [allHistory, setAllHistory] = useState(false);

  const q = query.trim().toLowerCase();
  const filtering = !!q || !!day || escOnly || cancelledOnly;
  // Searching is pointless inside a twelve-hour window, so any search opens the
  // whole record this crew is allowed to see.
  const windowed = !!shiftWindow && !allHistory && !filtering;

  // Correcting a closed call stays a desk job. The crew's list is handed the
  // same two writers now — they need them to escalate an issue on a call they
  // have already closed — so the coding picker is gated on the role rather than
  // on whether a writer happened to be passed in.
  const canCode =
    typeof saveRequests === "function" &&
    typeof addLog === "function" &&
    !!user &&
    (user.role === "admin" || user.role === "dispatcher");
  const canThread = typeof saveRequests === "function" && typeof addLog === "function" && !!viewer;

  useEffect(() => {
    setShown(HISTORY_PAGE);
  }, [query, day, escOnly, cancelledOnly, allHistory]);

  async function setCoding(reqId, field, value) {
    if (!canCode) return;
    await applyCallCoding({ reqId, field, value, requests, saveRequests, addLog, actor: user });
  }

  const completed = requests
    .filter((r) => !!r)
    .map((r) => ({
      req: r,
      live: r.status !== "completed",
      closedAt: callClosedTs(r),
      escalations: visibleEscalations(r, viewer),
    }))
    // A call that is still running is not history and stays off this list — with
    // one exception, and it is the whole reason the filter beside it exists. An
    // issue is usually raised while the call is still going: it is answered from
    // the inbox above, drops off it the moment it is answered or resolved, and
    // if this list only ever held closed calls then pressing "Escalated only"
    // straight afterwards said there was nothing there — while the crew were
    // still on the job and the thread was sitting on a live call nobody could
    // filter to. So the escalated filter reaches into the live board as well,
    // and those cards say what the call is actually doing instead of pretending
    // it is closed.
    .filter(({ live, escalations }) => !live || (escOnly && escalations.length > 0))
    // A crew's list is the calls their medic ran or helped on — plus any call
    // carrying an issue they raised themselves, which may well have been run
    // from a different truck on a different day.
    .filter(
      ({ req, escalations }) =>
        !unitId || req.assignedUnitId === unitId || isAssistingUnit(req, unitId) || escalations.length > 0
    )
    // Scoped by when the call closed rather than when it was raised: a transfer
    // that came in at 06:50 and finished at 07:40 was worked by the crew who
    // are on now, and it is their list it belongs on. A live call has no closing
    // time to scope by, and it only ever reaches this list through a filter,
    // which opens the whole record anyway.
    .filter(({ live, closedAt }) => !windowed || live || (closedAt >= shiftWindow.start && closedAt <= shiftWindow.end))
    // "Escalated only" is every call carrying an issue a team raised, and that
    // is the only test it applies. How the call ended is a separate question:
    // a job that was stood down and then complained about is still a complaint,
    // and hiding it here left the one filter meant to find issues as the one
    // place the issue could not be found. Cancelled calls that carry one show up
    // under both filters, with the CANCELLED tag on the card saying which it is.
    .filter(({ escalations }) => !escOnly || escalations.length > 0)
    .filter(({ req, live }) => !cancelledOnly || (!live && callWasCancelled(req)))
    .filter(({ closedAt }) => !day || localDayKey(closedAt) === day)
    .filter(({ req, escalations }) => !q || callSearchText(req, units, escalations).includes(q))
    // Anything still running goes to the top: it is the one thing on this list
    // that can still be acted on.
    .sort((a, b) => (a.live === b.live ? b.closedAt - a.closedAt : a.live ? -1 : 1));

  const midnight = new Date();
  midnight.setHours(0, 0, 0, 0);
  const todayCount = completed.filter((c) => !c.live && c.closedAt >= midnight.getTime()).length;
  // Coding is a closed-call job — a call still running is coded from the live
  // card above, so it is not counted as an unfinished row on the sheet here.
  const uncoded = completed.filter(({ req, live }) => !live && (!callTypeOf(req) || !loadedKmOf(req))).length;
  const escalatedCount = completed.filter(({ escalations }) => escalations.length > 0).length;
  const cancelledCount = completed.filter(({ req, live }) => !live && callWasCancelled(req)).length;
  // How many of the rows on screen are calls that have not finished yet, which
  // only ever happens under "Escalated only".
  const liveCount = completed.filter((c) => c.live).length;
  // A crew reads this list as their own work; a desk reads it as the board's.
  const shiftLabel = shiftWindow && shiftWindow.meta ? shiftWindow.meta.label : "";
  const shiftHours = shiftWindow ? shiftWindow.windowStr || "" : "";
  const myUnitName = unitId ? (units.find((u) => u.id === unitId) || {}).name || "" : "";
  const isOpen = open || filtering || allHistory;

  function clearFilters() {
    setQuery("");
    setDay("");
    setEscOnly(false);
    setCancelledOnly(false);
    setAllHistory(false);
  }

  return (
    <div>
      <div style={styles.sectionHeaderRow}>
        <div style={{ ...styles.sectionHeader, margin: 0 }}>
          <Archive size={14} style={{ marginRight: 6, verticalAlign: -2 }} />{" "}
          {escOnly
            ? "ESCALATED CALLS"
            : filtering || allHistory
              ? unitId
                ? "YOUR CALL HISTORY"
                : "CALL HISTORY"
              : shiftWindow
                ? `${myUnitName || "YOUR MEDIC"} — CLOSED THIS SHIFT`
                : unitId
                  ? "YOUR CLOSED CALLS"
                  : "COMPLETED CALLS"}
          {completed.length > 0 ? ` (${completed.length})` : ""}

        {(completed.length > 0 || filtering) && (

      {/* The sheet's outstanding questions, said once at the top rather than
          left to be discovered at the end of the month by somebody reading four
          hundred rows looking for blanks. Only the desk sees it — filling these

      {incomplete.length > 0 && (
        <div style={styles.needsDetail}>

            style={styles.needsDetailHeadBtn}

            {user && user.role === "dispatcher" ? "on your shift" : "on the board"} still
            {incomplete.length === 1 ? " needs" : " need"} information before the log is finished
            <ChevronRight
              size={13}

                marginLeft: "auto",
                flex: "none",

      {/* Finding a call again. The desk searches hundreds of them; a crew

        <button

      <div style={styles.historyNote}>

                  <div style={styles.callCardMeta}>

                    <span style={styles.callCardMetaItem}>

                    {shift && (

                    {unit && (

                    {req.scheduledFor && (

                  {req.mrn ? (

                  {req.requirements && req.requirements.length > 0 && (
                    <div style={styles.checklistRow}>
                      {reqLabels(req).map((label, i) => (

                  {/* The same flag on the card, so a call is identifiable once

                  {canCorrect && missingLogFields(req).length > 0 && (
                    <div style={styles.needsDetailTag}>
                      💡 needs: {missingLogFields(req).map((f) => f.label).join(", ")}

                  )}

                  {/* Who took the patient, recorded after the fact.

                  {!isNoTransport(req) && (req.times || {}).arrivalDestination && (
                    <ReceiverBanner

                  {canCorrect && (
                    <>
                      <PendingEditReview
                        req={req}
                        onVerify={(e) => verifyEdit(req, e, true)}

                      <EditHistory req={req} />
                      {editFor === req.id ? (
                        <CallEditForm
                          req={req}

                      ) : (
                        <button style={styles.editOpenBtn} onClick={() => setEditFor(req.id)}>
                          <PencilLine size={12} /> Correct call details

                      )}
                    </>
                  )}
                  {!canCorrect && canProposeEditOn(req, viewer) && (
                    <>
                      {pendingCallEdits(req).length > 0 && (
                        <div style={styles.editPendingNote}>

                            .map((e) => `${editFieldLabel(e.field)} → ${editValueText(e.to, e.field)}`)
                            .join(", ")}

                      <EditHistory req={req} />
                      {editFor === req.id ? (
                        <CallEditForm
                          req={req}
                          mode="propose"

                          onCancel={() => setEditFor(null)}

                      ) : (
                        <button style={styles.editOpenBtn} onClick={() => setEditFor(req.id)}>

                  )}

                  <CallTimes times={req.times} />
                  <AssistStatusLine req={req} units={units} />
                  {/* Coding a call is a closed-call job — a call still running
                      is coded from the live board above, where the crew are
                      still stamping times on it. */}
                  {canCode &&
                    !live &&
                    (codingFor === req.id ? (
                      <React.Fragment>
                        <CallCodingBlock
                          req={req}
                          onSet={(field, value) => setCoding(req.id, field, value)}
                          title="CODE THIS CLOSED CALL"

                        />
                        <div style={styles.codingClosedRow}>

                            Done coding

                      </React.Fragment>
                    ) : (
                      <div style={styles.codingClosedRow}>
                        {!callTypeOf(req) && <span style={styles.codeMissingTag}>TYPE NOT SET</span>}
                        {!loadedKmOf(req) && <span style={styles.codeMissingTag}>LOADED KM NOT SET</span>}
                        <button style={styles.ghostBtnSm} onClick={() => setCodingFor(req.id)}>
                          <Tag size={12} />{" "}
                          {callTypeOf(req) && loadedKmOf(req) ? "Change call type / km" : "Code this call"}
                        </button>
                      </div>
                    ))}
                  {/* Who ended the call and what they said it ended as. A call
                      closed before the desk was asked for a reason keeps its
                      line and says nothing more, rather than reading as an
                      unanswered question. */}
                  {(req.closedBy || callCloseReason(req)) && (
                    <div style={styles.historyClosedBy}>
                      {req.closedBy ? `Closed by ${req.closedBy}` : "Closed"}
                      {callCloseReason(req) && (
                        <span style={styles.cancelReasonSaid}> — {callCloseReason(req)}</span>
                      )}
                    </div>
                  )}
                  {canThread && escFor === req.id && (
                    <EscalationThread
                      req={req}
                      viewer={viewer}
                      requests={requests}
                      saveRequests={saveRequests}
                      addLog={addLog}
                      onClose={() => setEscFor(null)}
                    />
                  )}
                </div>
              );
            })}
          </div>
          {shown < completed.length && (
            <button style={{ ...styles.ghostBtnSm, marginTop: 10 }} onClick={() => setShown((s) => s + HISTORY_PAGE)}>
              Show {Math.min(HISTORY_PAGE, completed.length - shown)} older
            </button>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

// ---------- scheduled (future) requests ----------
//
// Not every transfer is an emergency. A good part of the work is booked ahead:
// an appointment on the next shift, a discharge tomorrow morning, a theatre
// transfer at a known time. Those live on their own board key (`ems:scheduled`)
// rather than in the live call list, so a booking made for 07:00 tomorrow can
// be planned and given a team today without showing up as an active call or
// setting a crew's alarm off. When its time arrives the booking is turned into
// an ordinary call — at which point every existing path takes over: the team
// pre-assigned to it is dispatched, their screen alarms, and the call runs
// through the normal timeline.
const SCHED_STATUS = {
  scheduled: { label: "SCHEDULED", color: "#35C4E8" },
  releasing: { label: "DISPATCHING…", color: "#FFB020" },
  released: { label: "DISPATCHED", color: "#3DDC97" },
  cancelled: { label: "CANCELLED", color: "#64748B" },
};

// ---------- why a booking was cancelled ----------
//
// A cancelled booking is the one thing on the forward book with no times
// against it to explain itself: it was taken, it never went out, and the row on
// the export carries nothing but a name. So the desk is asked for the reason at
// the moment it cancels — the banner on the card will not let the cancellation
// through without one — and the answer is kept on the booking, said on the card,
// written into the event log and carried out onto the Scheduled Requests sheet
// of the shared workbook.
//
// The list below is the reasons the desk actually gives, one press each on a
// touchscreen at three in the morning. Anything not on it is typed into the same
// box: the chips fill the box rather than replacing it, so a picked reason can
// still be added to.
const SCHED_CANCEL_REASONS = [
  "Patient no longer requires transfer",
  "Ward cancelled the request",
  "Appointment cancelled",
  "Patient discharged",
  "Patient deceased",
  "Patient not fit to travel",
  "Transferred by other means",
  "Booked in error / duplicate",
];

// The longest a reason can be. Long enough for a sentence explaining an unusual
// cancellation, short enough that the export column stays readable.
const SCHED_CANCEL_REASON_MAX = 200;

// What the record says a booking was cancelled for. Bookings cancelled before
// this was asked for have no reason on them, and the export says so plainly
// rather than leaving the cell blank next to a name — a blank reads as "nobody
// filled it in", which is a different thing from "this was never asked".
function schedCancelReason(s) {
  const reason = s && typeof s.cancelReason === "string" ? s.cancelReason.trim() : "";
  return reason;
}

// Anything inside this window of its dispatch time is flagged on the desk.
const SCHED_DUE_SOON_MS = 30 * 60 * 1000;

// How far ahead of its time a booking chimes on the dispatch desk. A quarter of
// an hour is long enough to raise a crew on the radio, confirm the patient is
// ready and hand the job over — and short enough that the reminder still means
// "now" rather than "later today".
const SCHED_PREALERT_MS = 15 * 60 * 1000;

// The reminder is checked on its own clock rather than off the board poll, so
// it fires within a few seconds of T-15 even on a desk nobody is touching.
const SCHED_PREALERT_TICK_MS = 10000;

// Releasing a booking is a read, a write and a read-back: whichever open board
// writes its own id last owns the release, so five dispatch screens polling at
// once raise one call rather than five. A claim older than this is treated as
// abandoned (the board that took it was closed or lost its connection
// mid-release) and the booking becomes releasable again — otherwise a single
// dropped write would strand the booking forever.
const SCHED_CLAIM_MS = 20000;

function schedStatusMeta(status) {
  return SCHED_STATUS[status] || SCHED_STATUS.scheduled;
}

// Still waiting to go out: either untouched, or left behind by a board that
// claimed it and never finished.
function schedOpen(s, now) {
  if (!s) return false;
  if (s.status === "scheduled") return true;
  return s.status === "releasing" && now - (s.claimedAt || 0) > SCHED_CLAIM_MS;
}

// A booking with no time on it: the ward could not say when the patient will be
// ready and will phone the desk instead. It sits on the schedule waiting for
// that call and is never released by the clock — only by someone pressing
// "patient ready" on the desk, which stamps a time on it and sends it out.
function schedAwaitCall(s) {
  return !!s && !s.scheduledFor;
}

// Due out now. A booking awaiting a phone call has no time to fall due, so it is
// excluded here rather than being treated as a booking for 1970 and released the
// second it is saved.
function schedDue(s, now) {
  if (schedAwaitCall(s)) return false;
  return schedOpen(s, now) && (s.scheduledFor || 0) <= now;
}

// "Today 14:30" / "Tomorrow 07:00" / "Mon 3 Nov 19:00" — the dispatch time in
// the shortest form that is still unambiguous. Gregorian throughout, by way of
// gregDayMonthStr.
function whenStr(ts) {
  if (!ts) return "—";
  const days = dayOffset(ts, Date.now());
  const time = hhmm(ts);
  if (days === 0) return `Today ${time}`;
  if (days === 1) return `Tomorrow ${time}`;
  if (days === -1) return `Yesterday ${time}`;
  return `${gregDayMonthStr(ts)} ${time}`;
}

// Whole calendar days between two instants, counted off midnight rather than
// by dividing the gap — so 23:50 to 00:10 is one day apart, not none.
function dayOffset(ts, from) {
  return Math.round((startOfDay(ts) - startOfDay(from)) / 86400000);
}

function startOfDay(ts) {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

// "Today · Saturday 1 August 2026" — the day headings the schedule ahead is
// broken up by, so a week of bookings reads as a calendar rather than a list.
function dayHeadingStr(ts, now) {
  const days = dayOffset(ts, now);
  const long = gregLongDateStr(ts);
  if (days === 0) return `Today · ${long}`;
  if (days === 1) return `Tomorrow · ${long}`;
  if (days === -1) return `Yesterday · ${long}`;
  return long;
}

// "in 2h 15m" / "6m overdue" — how long until (or since) a booking is due out.
function untilStr(ts, now) {
  if (!ts) return "";
  const delta = ts - now;
  if (delta <= 0) return `${shortDurationStr(-delta)} overdue`;
  return `in ${shortDurationStr(delta)}`;
}

// The next time `shiftKey` starts after `from` — what the "next day shift" /
// "next night shift" quick picks on the booking form fill in.
function nextShiftStartTs(shiftKey, from) {
  const shift = shiftMeta(shiftKey) || SHIFTS.day;
  const d = new Date(from);
  d.setHours(shift.startHour, 0, 0, 0);
  if (d.getTime() <= from) d.setDate(d.getDate() + 1);
  return d.getTime();
}

// Rounded up to the next quarter hour, an hour out — the form's opening value.
function defaultScheduleTs(now) {
  const d = new Date(now + 60 * 60 * 1000);
  d.setSeconds(0, 0);
  d.setMinutes(Math.ceil(d.getMinutes() / 15) * 15);
  return d.getTime();
}

// ---------- picking a date and a time ----------
//
// The browser's own <input type="datetime-local"> was doing this job, and it is
// the wrong tool here for two reasons. It renders in the device's calendar — on
// a tablet set to an Arabic locale that means a Hijri picker, so two desks
// booking the same transfer were reading two different dates — and it hides the
// time behind a spinner that is fiddly to nudge by a quarter of an hour on a
// touchscreen. What follows is a plain Gregorian month grid with the time on
// its own controls, so the date is unambiguous on every device and the time can
// be changed on its own without touching the date.

// Whole five-minute steps: a booking is a slot in a day's work, not a
// stopwatch, and a finer step only makes the minute list longer to scroll.
const TIME_STEP_MIN = 5;

// The near hours of today — the case the desk hits most: a transfer phoned
// through for later this afternoon rather than for another day.
const RELATIVE_PICKS = [
  { label: "+30 min", ms: 30 * 60 * 1000 },
  { label: "+1 hour", ms: 60 * 60 * 1000 },
  { label: "+2 hours", ms: 2 * 60 * 60 * 1000 },
  { label: "+4 hours", ms: 4 * 60 * 60 * 1000 },
];

// A booking has to be at least this far ahead. A time that has already gone
// would be released the instant it was saved, which is a call phoned in, not
// something booked — and it could never give the desk its quarter-hour warning.
const MIN_LEAD_MS = 60 * 1000;

function startOfMonth(ts) {
  const d = new Date(ts);
  d.setDate(1);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function addMonths(ts, n) {
  const d = new Date(startOfMonth(ts));
  d.setMonth(d.getMonth() + n);
  return d.getTime();
}

// The six-week block a month is drawn in: from the Sunday on or before the 1st
// to the Saturday on or after the last day, so the grid never changes height as
// the desk pages through months.
function monthGrid(monthTs) {
  const first = new Date(startOfMonth(monthTs));
  const start = new Date(first);
  start.setDate(1 - first.getDay());
  const weeks = [];
  for (let w = 0; w < 6; w++) {
    const week = [];
    for (let d = 0; d < 7; d++) {
      const cell = new Date(start);
      cell.setDate(start.getDate() + w * 7 + d);
      week.push(cell.getTime());
    }
    weeks.push(week);
  }
  return weeks;
}

// A date from one place and a time from another, which is exactly how the
// picker is used: page to a day, then set the hour.
function withTimeOfDay(dayTs, hours, minutes) {
  const d = new Date(dayTs);
  d.setHours(hours, minutes, 0, 0);
  return d.getTime();
}

function roundUpToStep(ts) {
  const d = new Date(ts);
  d.setSeconds(0, 0);
  d.setMinutes(Math.ceil(d.getMinutes() / TIME_STEP_MIN) * TIME_STEP_MIN);
  return d.getTime();
}

// The earliest slot that can still be booked — used to snap a same-day pick
// forward when the hour that was already in the form has since passed.
function earliestBookableTs(now) {
  return roundUpToStep(now + MIN_LEAD_MS);
}

// A Gregorian month grid plus the hour and minute of the day, over one
// timestamp. `value` is a number of milliseconds or null; every change comes
// back through onChange as a number.
function WhenPicker({ value, onChange, now, hint }) {
  const [monthAnchor, setMonthAnchor] = useState(() => startOfMonth(value || now));
  const monthOfValue = value ? startOfMonth(value) : 0;

  // Quick picks and the relative chips can land in another month; the grid
  // follows them rather than leaving the chosen day off screen.
  useEffect(() => {
    if (monthOfValue) setMonthAnchor(monthOfValue);
  }, [monthOfValue]);

  const selected = value || null;
  const selectedDay = selected ? startOfDay(selected) : null;
  const today = startOfDay(now);
  const current = new Date(selected || earliestBookableTs(now));
  const hours = current.getHours();
  const minutes = current.getMinutes();

  function pickDay(dayTs) {
    // Keep the time that was already set and just move the date. If that lands
    // in the past — picking today when the hour on the form has gone by — the
    // time moves up to the next bookable slot instead of quietly saving
    // something that would fire immediately.
    const next = withTimeOfDay(dayTs, hours, minutes);
    onChange(next < now + MIN_LEAD_MS ? earliestBookableTs(now) : next);
  }

  function setTime(h, m) {
    onChange(withTimeOfDay(selectedDay || today, h, m));
  }

  // The ± buttons walk the time in quarters and hours — how a booking is
  // usually adjusted once it exists ("push it back an hour"). Walking backwards
  // stops at the earliest slot still bookable rather than going into the past.
  function nudge(mins) {
    const next = (selected || earliestBookableTs(now)) + mins * 60000;
    onChange(Math.max(next, earliestBookableTs(now)));
  }

  const minuteOptions = [];
  for (let m = 0; m < 60; m += TIME_STEP_MIN) minuteOptions.push(m);
  // A minute that isn't on the step (an older booking saved at 14:37) stays
  // selectable rather than being silently rounded on open.
  if (!minuteOptions.includes(minutes)) minuteOptions.push(minutes);
  minuteOptions.sort((a, b) => a - b);

  return (
    <div style={styles.whenPicker}>
      <div style={styles.whenReadoutRow}>
        <div>
          <div style={styles.whenReadoutTime}>{selected ? hhmm(selected) : "--:--"}</div>
          <div style={styles.whenReadoutDate}>
            {selected ? gregLongDateStr(selected) : "No date picked"}
            <span style={styles.whenCalTag}>Gregorian</span>
          </div>
        </div>
        {selected && (
          <div style={styles.whenReadoutSide}>
            <div style={selected <= now ? styles.staffingWarn : styles.whenReadoutUntil}>
              {untilStr(selected, now)}
            </div>
            {(() => {
              const meta = shiftMeta(scheduledShiftKey(selected));
              return meta ? (
                <div style={{ ...styles.shiftTag, color: meta.color, borderColor: meta.color }}>
                  {meta.glyph} {meta.label}
                </div>
              ) : null;
            })()}
          </div>
        )}
      </div>

      <div style={styles.whenSection}>
        <div style={styles.whenSectionLabel}>Date</div>
        <div style={styles.calHeader}>
          <button
            type="button"
            style={styles.calNavBtn}
            onClick={() => setMonthAnchor((m) => addMonths(m, -1))}
            aria-label="Previous month"
          >
            ‹
          </button>
          <div style={styles.calMonthLabel}>
            {MONTH_LABELS[new Date(monthAnchor).getMonth()]} {new Date(monthAnchor).getFullYear()}
          </div>
          <button
            type="button"
            style={styles.calNavBtn}
            onClick={() => setMonthAnchor((m) => addMonths(m, 1))}
            aria-label="Next month"
          >
            ›
          </button>
        </div>
        <div style={styles.calWeekRow}>
          {WEEKDAY_LABELS.map((d) => (
            <div key={d} style={styles.calWeekday}>{d.slice(0, 2)}</div>
          ))}
        </div>
        {monthGrid(monthAnchor).map((week, i) => (
          <div key={i} style={styles.calWeekRow}>
            {week.map((dayTs) => {
              const inMonth = new Date(dayTs).getMonth() === new Date(monthAnchor).getMonth();
              const isPast = dayTs < today;
              const isToday = dayTs === today;
              const isSelected = selectedDay === dayTs;
              return (
                <button
                  type="button"
                  key={dayTs}
                  disabled={isPast}
                  onClick={() => pickDay(dayTs)}
                  style={{
                    ...styles.calDay,
                    ...(inMonth ? null : styles.calDayOutside),
                    ...(isPast ? styles.calDayPast : null),
                    ...(isToday ? styles.calDayToday : null),
                    ...(isSelected ? styles.calDaySelected : null),
                  }}
                >
                  {new Date(dayTs).getDate()}
                </button>
              );
            })}
          </div>
        ))}
        <div style={styles.quickPickRow}>
          <button type="button" style={styles.quickPickBtn} onClick={() => pickDay(today)}>
            Today
          </button>
          <button type="button" style={styles.quickPickBtn} onClick={() => pickDay(today + 86400000)}>
            Tomorrow
          </button>
          <button
            type="button"
            style={styles.quickPickBtn}
            onClick={() => setMonthAnchor(startOfMonth(now))}
          >
            This month
          </button>
        </div>
      </div>

      <div style={styles.whenSection}>
        <div style={styles.whenSectionLabel}>Time (24h)</div>
        <div style={styles.whenTimeRow}>
          <select
            style={styles.whenTimeSelect}
            value={hours}
            onChange={(e) => setTime(Number(e.target.value), minutes)}
            aria-label="Hour"
          >
            {Array.from({ length: 24 }, (_, h) => (
              <option key={h} value={h}>{String(h).padStart(2, "0")}</option>
            ))}
          </select>
          <span style={styles.whenTimeColon}>:</span>
          <select
            style={styles.whenTimeSelect}
            value={minutes}
            onChange={(e) => setTime(hours, Number(e.target.value))}
            aria-label="Minute"
          >
            {minuteOptions.map((m) => (
              <option key={m} value={m}>{String(m).padStart(2, "0")}</option>
            ))}
          </select>
          <div style={styles.whenNudgeGroup}>
            {[-60, -15, 15, 60].map((mins) => (
              <button
                type="button"
                key={mins}
                style={styles.whenNudgeBtn}
                onClick={() => nudge(mins)}
              >
                {mins > 0 ? `+${mins}m` : `${mins}m`}
              </button>
            ))}
          </div>
        </div>
        <div style={styles.quickPickRow}>
          {RELATIVE_PICKS.map((p) => (
            <button
              type="button"
              key={p.label}
              style={styles.quickPickBtn}
              onClick={() => onChange(roundUpToStep(now + p.ms))}
            >
              {p.label}
            </button>
          ))}
          <button
            type="button"
            style={styles.quickPickBtn}
            onClick={() => onChange(nextShiftStartTs("day", now))}
          >
            {SHIFTS.day.glyph} Next day shift
          </button>
          <button
            type="button"
            style={styles.quickPickBtn}
            onClick={() => onChange(nextShiftStartTs("night", now))}
          >
            {SHIFTS.night.glyph} Next night shift
          </button>
        </div>
      </div>

      {hint && <InfoNote>{hint}</InfoNote>}
    </div>
  );
}

// ---------- the quarter-hour reminder ----------
//
// A booking that goes out on its own is fine for a transfer nobody has to
// prepare for, but most of them need a word on the radio first: the crew told,
// the ward told, a porter found. So the desk gets a reminder a quarter of an
// hour out — but only for bookings falling inside the shift the person reading
// the board is actually signed on for, because a booking three shifts away is
// not their problem and a desk that chimes for other people's work stops being
// listened to.

// The shift window the dispatcher signed on for, against the one the booking
// falls in. Sessions carry their own window; a session from an older build that
// doesn't gets compared by shift key instead.
function bookingInUserShift(entry, user) {
  if (!entry || !user) return false;
  const ts = entry.scheduledFor || 0;
  if (!ts) return false;
  if (user.shiftStart && user.shiftEnd) return ts >= user.shiftStart && ts < user.shiftEnd;
  if (!user.shift) return false;
  return scheduledShiftKey(ts) === user.shift;
}

// Which reminders this device has already played. Kept on the device, not on
// the board: five desks are five people, and each of them needs to hear it —
// while the same desk must not chime twice for one booking, however many times
// the page re-renders or is refreshed. Keyed by time as well as id, so moving a
// booking arms a fresh reminder for its new time.
const PREALERT_KEY = "ems:prealerted";
const PREALERT_TTL_MS = 24 * 60 * 60 * 1000;

function preAlertKey(entry) {
  return `${entry.id}@${entry.scheduledFor || 0}`;
}

function readPreAlerted() {
  try {
    const raw = window.localStorage.getItem(PREALERT_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    return parsed && typeof parsed === "object" ? parsed : {};
  } catch (e) {
    return {};
  }
}

function markPreAlerted(key, now) {
  try {
    const current = readPreAlerted();
    const next = {};
    // Yesterday's reminders are dropped on the way past, so a desk that is
    // never closed doesn't accumulate a year of keys.
    Object.keys(current).forEach((k) => {
      if (now - current[k] < PREALERT_TTL_MS) next[k] = current[k];
    });
    next[key] = now;
    window.localStorage.setItem(PREALERT_KEY, JSON.stringify(next));
  } catch (e) {
    // private browsing or a full quota: worst case the reminder repeats
  }
}

// Watches the schedule on its own ten-second clock and returns the bookings
// currently inside the reminder window that haven't been dismissed. The chime,
// the buzz and the system notification are fired here, once each, at the moment
// a booking crosses T-15.
function useSchedulePreAlerts(user, scheduled, audioCtxRef) {
  const [active, setActive] = useState([]);
  const latest = useRef({ user, scheduled });
  latest.current = { user, scheduled };
  const dismissed = useRef(new Set());

  useEffect(() => {
    function check() {
      const { user: u, scheduled: list } = latest.current;
      if (!u || (u.role !== "dispatcher" && u.role !== "admin")) {
        setActive((prev) => (prev.length ? [] : prev));
        return;
      }
      const now = Date.now();
      const fired = readPreAlerted();
      const showing = [];
      let chime = false;
      (list || []).forEach((entry) => {
        if (!entry || !schedOpen(entry, now)) return;
        const delta = (entry.scheduledFor || 0) - now;
        if (delta <= 0 || delta > SCHED_PREALERT_MS) return;
        if (!bookingInUserShift(entry, u)) return;
        const key = preAlertKey(entry);
        if (!fired[key]) {
          markPreAlerted(key, now);
          chime = true;
          notifyBookingSoon(entry, Math.max(1, Math.round(delta / 60000)));
        }
        if (!dismissed.current.has(key)) showing.push(entry);
      });
      // Two bookings crossing the line together get one chime between them, not
      // a pile of overlapping tones.
      if (chime) {
        soundReminderTone(audioCtxRef);
        buzz([90, 70, 90]);
      }
      setActive((prev) => {
        const same =
          prev.length === showing.length && prev.every((p, i) => preAlertKey(p) === preAlertKey(showing[i]));
        return same ? prev : showing;
      });
    }
    check();
    const t = setInterval(check, SCHED_PREALERT_TICK_MS);
    return () => clearInterval(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const dismiss = useCallback(() => {
    setActive((prev) => {
      prev.forEach((entry) => dismissed.current.add(preAlertKey(entry)));
      return [];
    });
  }, []);

  return { active, dismiss };
}

// The reminder itself: on screen until it is dismissed or the booking goes out,
// so a chime heard from across the room can still be acted on a minute later.
function SchedulePreAlert({ entries, units, now, onDismiss, audioCtxRef }) {
  // Read before the early return: a hook that is only sometimes called is a
  // hook React cannot keep track of.
  const level = useSoundLevel();
  if (!entries || entries.length === 0) return null;
  const silenced = soundLevelMeta(level).gain <= 0;
  const ctx = audioCtxRef ? audioCtxRef.current : null;
  const browserBlocked = !ctx || ctx.state !== "running";

  async function armSound() {
    if (silenced) setSoundLevel("full");
    try {
      const ctx = ensureAudioCtx(audioCtxRef);
      if (ctx) await ctx.resume();
    } catch (e) {
      // audio not available; ignore
    }
    soundReminderTone(audioCtxRef);
  }

  return (
    <div style={styles.preAlert}>
      <div style={styles.preAlertHead}>
        <span style={styles.preAlertTitle}>
          <Bell size={13} /> DUE THIS SHIFT
        </span>
        <span style={styles.preAlertCount}>
          {entries.length === 1 ? "1 booking" : `${entries.length} bookings`} inside 15 minutes
        </span>
        <button style={styles.preAlertDismiss} onClick={onDismiss}>
          Dismiss
        </button>
      </div>
      {entries.map((entry) => {
        const unit = units.find((u) => u.id === entry.assignedUnitId);
        const mins = Math.max(0, Math.round(((entry.scheduledFor || 0) - now) / 60000));
        return (
          <div key={entry.id} style={styles.preAlertRow}>
            <span style={styles.preAlertTime}>{hhmm(entry.scheduledFor)}</span>
            <span style={styles.preAlertIn}>in {mins} min</span>
            <span style={styles.preAlertNature}>{entry.nature}</span>
            <span style={styles.preAlertRoute}>{callRoute(entry)}</span>
            <span style={unit ? styles.assignedTag : styles.staffingWarn}>
              {unit ? unit.name : "no team assigned"}
            </span>
          </div>
        );
      })}
      <div style={styles.preAlertFoot}>
        {gregLongDateStr(now)} · the booking is dispatched automatically at its time.
        {silenced
          ? " This desk is silenced, so this reminder arrived without a tone — "
          : browserBlocked
          ? " This browser is holding the reminder tone — "
          : ""}
        {(silenced || browserBlocked) && (
          <button style={styles.preAlertArmBtn} onClick={armSound}>
            turn the tone on
          </button>
        )}
      </div>
    </div>
  );
}

// The scheduling desk. Dispatchers and admins only — it is rendered from those
// two views and nowhere else, and refuses to draw anything for any other role.
// Crews never see a booking: the first they know of one is the call arriving on
// their screen at its dispatch time, exactly like any other call.
function ScheduledRequests({ user, units, requests, scheduled, allScheduled, saveScheduled, addLog, audioCtxRef }) {
  const [open, setOpen] = useState(false);
  const [tab, setTab] = useState("upcoming");
  const [showForm, setShowForm] = useState(false);
  const [locationFrom, setLocationFrom] = useState("");
  const [locationTo, setLocationTo] = useState("");
  const [nature, setNature] = useState("");
  const [priority, setPriority] = useState("routine");
  const [mrn, setMrn] = useState("");
  const [requirements, setRequirements] = useState([]);
  const [team, setTeam] = useState("");
  const [notes, setNotes] = useState("");
  // Coded ahead where the desk already knows. A booked transfer is usually the
  // one case where both codes can be answered before the truck moves.
  const [callType, setCallType] = useState("");
  const [loadedKm, setLoadedKm] = useState("");
  // A timestamp, not the string an <input type="datetime-local"> hands back —
  // see WhenPicker for why that input is no longer used here.
  const [when, setWhen] = useState(() => defaultScheduleTs(Date.now()));
  // Set when the ward can't say when the patient will be ready and will phone
  // the desk instead. The booking is then held with no time on it.
  const [awaitCall, setAwaitCall] = useState(false);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editWhen, setEditWhen] = useState(null);
  const [editError, setEditError] = useState("");
  // The booking the desk has pressed cancel on, and the reason being typed
  // against it. Nothing is written while these are set: the cancellation only
  // happens when a reason has been given.
  const [cancellingId, setCancellingId] = useState(null);
  const [cancelReason, setCancelReason] = useState("");
  const [cancelError, setCancelError] = useState("");

  const preAlerts = useSchedulePreAlerts(user, scheduled, audioCtxRef);

  // A booking crossing the quarter-hour line opens the schedule, so whoever
  // heard the chime is looking at the booking rather than hunting for it.
  const alertCount = preAlerts.active.length;
  useEffect(() => {
    if (alertCount > 0) setOpen(true);
  }, [alertCount]);

  if (!user || (user.role !== "dispatcher" && user.role !== "admin")) return null;

  const now = Date.now();
  // `list` is this station's bookings, for reading. `saveFallback` is every
  // station's, because a write here replaces the whole stored array — if a
  // read ever fails and we fall back to the filtered list, the other
  // station's bookings would be written out of existence.
  const list = scheduled || [];
  const saveFallback = allScheduled || scheduled || [];
  const upcoming = list
    .filter((s) => s && schedOpen(s, now))
    .sort((a, b) => (a.scheduledFor || 0) - (b.scheduledFor || 0));
  const past = list
    .filter((s) => s && !schedOpen(s, now))
    .sort((a, b) => (b.scheduledFor || 0) - (a.scheduledFor || 0));
  // Bookings waiting on a phone call are held apart from the timed ones: they
  // have no time to be due at, so they can't be "due within the half hour" and
  // they don't belong under any day on the calendar.
  const awaiting = upcoming.filter(schedAwaitCall);
  const timed = upcoming.filter((s) => !schedAwaitCall(s));
  const dueSoon = timed.filter((s) => (s.scheduledFor || 0) - now <= SCHED_DUE_SOON_MS);
  const unassigned = upcoming.filter((s) => !s.assignedUnitId);
  const shown = tab === "upcoming" ? upcoming : past;
  // The upcoming list is read as a calendar: bookings under the Gregorian day
  // they go out on, today first, with anything waiting on a phone call held
  // above the calendar because it could be any of those days. Dispatched and
  // cancelled ones stay as a flat list — that tab is history, not a plan.
  const dayGroups =
    tab === "upcoming"
      ? [
          ...(awaiting.length > 0
            ? [{ key: "awaiting", heading: "Waiting on their call · no time yet", entries: awaiting }]
            : []),
          ...timed.reduce((groups, entry) => {
            const day = startOfDay(entry.scheduledFor || now);
            const last = groups[groups.length - 1];
            if (last && last.day === day) last.entries.push(entry);
            else groups.push({ key: String(day), day, heading: dayHeadingStr(day, now), entries: [entry] });
            return groups;
          }, []),
        ]
      : [{ key: "all", heading: null, entries: shown }];

  function toggleRequirement(key) {
    setRequirements((r) => (r.includes(key) ? r.filter((x) => x !== key) : [...r, key]));
  }

  function resetForm() {
    setLocationFrom("");
    setLocationTo("");
    setNature("");
    setPriority("routine");
    setMrn("");
    setRequirements([]);
    setTeam("");
    setNotes("");
    setCallType("");
    setLoadedKm("");
    setWhen(defaultScheduleTs(Date.now()));
    setAwaitCall(false);
    setError("");
  }

  async function book() {
    const ts = awaitCall ? null : when;
    if (!locationFrom.trim() || !nature.trim()) {
      setError("A pick-up location and the nature of the call are both needed.");
      return;
    }
    // A booking with no time is deliberate — the ward is going to phone — so the
    // time checks below only apply to one that is going out at a set time.
    if (!awaitCall) {
      if (!ts) {
        setError("Pick the date and time the ambulance is needed, or say the time isn't known yet.");
        return;
      }
      // Later today is exactly what this form is for; a time that has already
      // gone is not, because it would be released the moment it was saved.
      if (ts < Date.now() + MIN_LEAD_MS) {
        setError(
          `${hhmm(ts)} on ${gregLongDateStr(ts)} has already passed. Pick a later time — anything from a minute out, including later today.`
        );
        return;
      }
    }
    setBusy(true);
    setError("");
    const createdAt = Date.now();
    const entry = {
      id: uid("sch"),
      station: user && user.station ? user.station : DEFAULT_STATION,
      locationFrom: locationFrom.trim(),
      locationTo: locationTo.trim(),
      nature: nature.trim(),
      priority,
      mrn: mrn.trim(),
      requirements,
      notes: notes.trim(),
      callType: callTypeMeta(callType) ? callType : null,
      loadedKm: loadedKmMeta(loadedKm) ? loadedKm : null,
      scheduledFor: ts,
      // No time yet: the ward calls when the patient is ready and the desk sends
      // it out then. Nothing about it is automatic, which is the whole point.
      awaitCall: !!awaitCall,
      // The shift the booking falls in, so it can be read a shift at a time —
      // this is the shift that will be working when it goes out, not the one
      // the desk is on while booking it. A booking with no time belongs to no
      // shift until the call comes in.
      shift: ts ? scheduledShiftKey(ts) : null,
      assignedUnitId: team || null,
      status: "scheduled",
      createdAt,
      createdBy: user.name || "Dispatch",
    };
    // Fresh read before writing: two desks booking at the same moment must not
    // overwrite each other's booking.
    const fresh = await readKey("ems:scheduled", saveFallback);
    await saveScheduled([...fresh, entry]);
    const teamName = team ? (units.find((u) => u.id === team) || {}).name || "" : "";
    await addLog(
      (awaitCall
        ? `Future request booked with no time — the ward will call when the patient is ready — ${entry.nature} (${callRoute(entry)})`
        : `Future request booked for ${whenStr(ts)} — ${entry.nature} (${callRoute(entry)})`) +
        (teamName ? ` · ${teamName} pencilled in` : " · no team yet"),
      "call"
    );
    resetForm();
    setShowForm(false);
    setBusy(false);
    setOpen(true);
    setTab("upcoming");
  }

  async function patchBooking(id, patch, logLine) {
    const fresh = await readKey("ems:scheduled", saveFallback);
    const target = fresh.find((s) => s && s.id === id);
    if (!target) return;
    await saveScheduled(fresh.map((s) => (s && s.id === id ? { ...s, ...patch } : s)));
    if (logLine) await addLog(logLine, "assign");
  }

  async function assignTeam(entry, unitId) {
    const unit = units.find((u) => u.id === unitId);
    await patchBooking(
      entry.id,
      { assignedUnitId: unitId || null, assignedBy: user.name || "Dispatch", assignedAt: Date.now() },
      unit
        ? `${unit.name} assigned to the ${whenStr(entry.scheduledFor)} booking — ${entry.nature} (${callRoute(entry)}). They'll be alerted when it goes out.`
        : `Team stood down from the ${whenStr(entry.scheduledFor)} booking — ${entry.nature}`
    );
  }

  // Changing the time on a booking that is already on the board. Same picker as
  // the booking form, so a time can be nudged by a quarter of an hour or moved
  // to another day without re-entering anything else. Used as well to put a
  // time on a booking that was taken without one.
  async function reschedule(entry) {
    const ts = editWhen;
    if (!ts) return;
    if (ts < Date.now() + MIN_LEAD_MS) {
      setEditError(`${hhmm(ts)} on ${gregLongDateStr(ts)} has already passed — pick a later time.`);
      return;
    }
    const wasAwaiting = schedAwaitCall(entry);
    setEditingId(null);
    setEditError("");
    await patchBooking(
      entry.id,
      {
        scheduledFor: ts,
        shift: scheduledShiftKey(ts),
        awaitCall: false,
        rescheduledAt: Date.now(),
        rescheduledBy: user.name || "Dispatch",
      },
      wasAwaiting
        ? `Booking that was waiting on a call now set for ${whenStr(ts)} — ${entry.nature}`
        : `Booking moved from ${whenStr(entry.scheduledFor)} to ${whenStr(ts)} — ${entry.nature}`
    );
  }

  // The reverse: a booked time the ward can no longer hold to. The booking stays
  // on the schedule with no time on it, waiting for their call, instead of being
  // cancelled and re-taken.
  async function clearBookingTime(entry) {
    setEditingId(null);
    setEditError("");
    await patchBooking(
      entry.id,
      {
        scheduledFor: null,
        shift: null,
        awaitCall: true,
        rescheduledAt: Date.now(),
        rescheduledBy: user.name || "Dispatch",
      },
      `Booking for ${whenStr(entry.scheduledFor)} held with no time — the ward will call when the patient is ready — ${entry.nature}`
    );
  }

  // The ward has called: the patient is ready. Stamping now on the booking is
  // all it takes — the release loop every open desk is already running raises the
  // call within seconds, assigns the team pencilled in and alerts them, exactly
  // as it would for a booking whose time had come round.
  async function markReady(entry) {
    const ts = Date.now();
    await patchBooking(
      entry.id,
      {
        scheduledFor: ts,
        shift: scheduledShiftKey(ts),
        awaitCall: false,
        readyCalledAt: ts,
        readyCalledBy: user.name || "Dispatch",
      },
      `Ward called — patient ready for ${entry.nature} (${callRoute(entry)}); the booking is going out now`
    );
  }

  // Cancelling a booking is two presses, not one. The first opens the banner on
  // the card asking what happened; nothing is written until a reason has been
  // given. A transfer that vanishes off the forward book with no reason on it is
  // one nobody can account for the next morning — and the reason is exactly what
  // the supervisor reading the exported workbook is looking for — so it is
  // required here rather than left to the notes.
  function openCancel(entry) {
    setCancellingId(entry.id);
    setCancelReason("");
    setCancelError("");
    // The reschedule box and the cancel banner are two answers to the same
    // question, so opening one closes the other.
    setEditingId(null);
    setEditError("");
  }
