<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PulseOps — Where Every Second Matters</title>
<meta name="description" content="PulseOps — the ambulance dispatch board for Emergency Medical Services." />
<meta name="apple-mobile-web-app-title" content="PulseOps" />
<meta name="application-name" content="PulseOps" />
<!-- Navy, off the mark: the colour the phone paints round the app. -->
<meta name="theme-color" content="#070A11" />
<!-- The mark, inline, so the tab and the home screen carry it without a file
     to deploy, cache-bust and keep inside the native bundle as well. -->
<link rel="icon" href="./brand/pulseops-mark-192.png" />
<link rel="apple-touch-icon" href="./brand/pulseops-mark-512.png" />
<style>
  html, body, #root { height: 100%; margin: 0; background: #070A11; }
  * { box-sizing: border-box; }
</style>

<!--
  THIS FILE IS GENERATED. Edit src/ and run `npm run build`.

  FOR IT — THESE THREE FILES MUST BE SERVED LOCALLY.

  The app itself is built ahead of time and inlined below, so nothing is
  compiled in the browser any more. Three libraries are still loaded from a
  public CDN (unpkg.com). On an internal server with no internet access they
  will never arrive, and the app will not start. Download each one, place it
  beside this file, and change the three src attributes below to relative
  paths:

      react.production.min.js       →  src="./vendor/react.production.min.js"
      react-dom.production.min.js   →  src="./vendor/react-dom.production.min.js"
      xlsx.bundle.js                →  src="./vendor/xlsx.bundle.js"

  Nothing else in the application reaches outside the hospital network.
-->

<!-- React -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Spreadsheet export -->
<!--
  xlsx-js-style, not the plain xlsx build.

  The community SheetJS build reads cell styles but does not write them: every
  fill and font colour set on a cell is silently discarded when the workbook is
  saved. That is why the night-shift shading and the category colours never
  appeared, however correctly they were set. This fork is the same library with
  the same API and style writing restored.

  For the internal deployment this should be served from the hospital's own
  server rather than a public CDN, like everything else the app loads.
-->
<script src="https://unpkg.com/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<!--
  Map, for the live position of a truck that is out on a call.

  Leaflet with OpenStreetMap tiles: no API key, no billing account, and no
  third party named as a data recipient beyond the tile host itself. The
  tiles are the ONLY thing here that reaches a server outside the hospital
  besides the three scripts above.

  If the hospital network blocks the tile host, the map still works — the
  ambulances sit in the right places on a blank ground, and the panel says
  the background could not be loaded rather than pretending the trucks are
  missing. Same note as the others: for the internal deployment these should
  be served from the hospital's own server.
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

/* A heading stranded at the foot of a page with its table overleaf is the one
   thing that makes a printed report look unfinished. Sections are kept whole
   where they fit; where a table is too long, its header row repeats on each

.section h2{break-after:avoid;page-break-after:avoid}
.section>table,.section>p,.section>div{break-before:avoid;page-break-before:avoid}

.portrait{width:46pt;height:46pt;border-radius:50%;overflow:hidden;background:#EEF3F7;border:1pt solid #DCE3E9;margin-bottom:7pt}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait svg{width:100%;height:100%;fill:#C2CFDA}
.award-title{font-size:7.6pt;letter-spacing:1.2pt;text-transform:uppercase;color:#8A6D1F;font-weight:800}
.award-name{font-size:12.5pt;font-weight:800;margin-top:3pt;letter-spacing:-.3pt}
.award-id{font-size:8pt;color:#5A6B7B}
.award-figure{font-size:10.5pt;font-weight:700;color:#0A5540;margin-top:5pt}
.award-note{font-size:8.2pt;color:#5A6B7B;margin-top:2pt;line-height:1.4}

table{width:100%;border-collapse:collapse;margin:7pt 0 10pt;font-size:8.8pt}
th{text-align:left;background:#0A5540;color:#fff;padding:5pt 6pt;font-size:7.6pt;letter-spacing:.6pt;text-transform:uppercase;font-weight:800}
td{padding:4.5pt 6pt;border-bottom:0.6pt solid #DCE3E9}
tr:nth-child(even) td{background:#F5F8FA}
tr{page-break-inside:avoid}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

.bar{height:7pt;background:#EEF3F7;border-radius:4pt;overflow:hidden;min-width:60pt}
.bar i{display:block;height:100%;background:#0A5540}
.mixbar{display:flex;height:11pt;border-radius:6pt;overflow:hidden;margin:8pt 0 10pt}
.mixbar span{display:block;height:100%}

.callout{background:#F2F6F9;border-left:3pt solid #0A5540;padding:8pt 10pt;margin:9pt 0;font-size:9pt}
.foot{margin-top:15pt;border-top:0.8pt solid #C9D4DD;padding-top:7pt;font-size:7.8pt;color:#6C7B89}
.pb{page-break-before:always}

      * { box-sizing: border-box; }
      body { margin: 0; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #28323D; border-radius: 4px; }
      button:focus-visible, select:focus-visible, input:focus-visible {
        outline: 2px solid #0A84FF;
        outline-offset: 2px;
      }
      /* The ambulance on the map. Built by Leaflet from an HTML string, so it
         cannot use the styles object and lives here instead. */
      .amb-icon { background: none; border: none; }
      .amb-marker {
        display: flex; flex-direction: column; align-items: center;
        line-height: 1; pointer-events: auto;
      }
      .amb-glyph {
        font-size: 26px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
        transform-origin: center;
      }
      .amb-label {
        margin-top: 2px; font-size: 10px; font-weight: 800; letter-spacing: .4px;
        color: #FFFFFF; background: rgba(10,14,20,.82); border-radius: 999px;
        padding: 2px 7px; white-space: nowrap;
      }
      /* A fix nobody has refreshed for three minutes stops looking certain. */
      .amb-stale { opacity: .45; }
      .amb-stale .amb-label { background: rgba(90,103,117,.9); }
      /* Leaflet paints its own controls light; the popup is made to match the
         board rather than the library. */
      .leaflet-popup-content-wrapper, .leaflet-popup-tip {
        background: #141A21; color: #F7F9FB;
      }
      .leaflet-popup-content { font-size: 12.5px; line-height: 1.5; }

      /* The two themes, as one set of tokens with two sets of values.
         Nothing in a component knows which is running: the attribute on the
         root element changes all of it at once. */
      :root {
        /* PulseOps. Navy, red and white, taken off the mark.
           The brand tokens are deliberately separate from the status ones. A
           board where red means "critical call" cannot also have red mean
           "our logo" in the same glance, so the brand red is used on the
           wordmark, the rules and the chrome \u2014 never to say something about a
           call. Status keeps its own five colours, untouched. */
        --brand:#E02B20; --brand-2:#F4564C; --brand-navy:#1E3A6E;
        --brand-navy-2:#2B54A0; --brand-deep:#132749;
        --ground:#070A11; --panel:#0D1219; --raised:#131A24; --inset:#101720;
        --inset-2:#16232F; --hair:#1B242F; --hair-2:#27323F; --hair-3:#33475A;
        --ink:#F7F9FB; --ink-alt:#F5F7FA; --ink-2:#D3DCE5; --ink-3:#93A2B1; --ink-4:#5A6775;
        --ok:#30D158; --flow:#0A84FF; --hold:#FF9F0A; --crit:#FF453A;
        --info:#5AC8FA; --gold:#E9C46A; --crit-2:#FF7A86; --hold-2:#FFC24D;
        --hold-3:#FFD98A; --flow-2:#93C5FD; --info-2:#6FD6F0; --move:#A78BFA; --land:#2DD4BF;
        --logo-plate:rgba(255,255,255,.94); --logo-pad:6px 10px; --logo-radius:10px;
        --veil:rgba(255,255,255,.055); --veil-2:rgba(255,255,255,.10);
        --lift:rgba(0,0,0,.38); --lift-2:rgba(0,0,0,.55);
        --bar:rgba(13,18,25,.78);
        color-scheme: dark;
      }
      /* Light is not the dark palette inverted \u2014 that gives grey text on grey.
         The surfaces go white and the ink goes near-black, and the status
         colours are darkened only as far as they need to read on white. */
      [data-theme="light"] {
        --brand:#C2201A; --brand-2:#9E1912; --brand-navy:#1E3A6E;
        --brand-navy-2:#2B54A0; --brand-deep:#EAF0FA;
        --ground:#F1F4F8; --panel:#FFFFFF; --raised:#FFFFFF; --inset:#EDF0F4;
        --inset-2:#E7EBF0; --hair:#DDE3EA; --hair-2:#C6D0DA; --hair-3:#AEBBC8;
        --ink:#0F1721; --ink-alt:#16202B; --ink-2:#2B3846; --ink-3:#59687A; --ink-4:#7A8798;
        --ok:#1E9E42; --flow:#0866CC; --hold:#B87200; --crit:#CC2A21;
        --info:#0E86B8; --gold:#9A7B1E; --crit-2:#C23B45; --hold-2:#9A6B00;
        --hold-3:#8A6410; --flow-2:#2563A8; --info-2:#0E7FA8; --move:#6D28D9; --land:#0F766E;
        --logo-plate:transparent; --logo-pad:0; --logo-radius:0;
        --veil:rgba(0,0,0,.07); --veil-2:rgba(0,0,0,.12);
        --lift:rgba(15,23,33,.10); --lift-2:rgba(15,23,33,.16);
        --bar:rgba(255,255,255,.82);
        color-scheme: light;
      }

      @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      /* Motion, used only where it says something.

         Tiles arrive in sequence so the board reads as loading rather than
         appearing fully formed; a press physically compresses, so a tap is
         acknowledged before the network answers; and the no-coverage panel
         breathes, because the one state that must not be scrolled past should
         not sit still. Everything here stops under reduced motion. */
      @keyframes tile-rise {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes breathe {
        0%, 100% { box-shadow: 0 0 0 1px rgba(255,77,94,.18), 0 14px 34px rgba(255,77,94,.14); }
        50%      { box-shadow: 0 0 0 1px rgba(255,77,94,.45), 0 14px 40px rgba(255,77,94,.30); }
      }
      .tile-in { animation: tile-rise .45s cubic-bezier(.22,1,.36,1) backwards; }
