// ---------- login ----------

// Maps a first-screen choice to the account role it accepts.
const ROLE_CHOICES = {
  dispatcher: { accountRole: "dispatcher", label: "Dispatcher", other: "Team or Admin" },
  team: { accountRole: "crew", label: "Team", other: "Dispatcher or Admin" },
  admin: { accountRole: "admin", label: "Admin", other: "Dispatcher or Team" },
};

function LoginScreen({ units, onLogin, saveUnits, addLog }) {
  const [role, setRole] = useState(null); // null | "dispatcher" | "team" | "admin"

  // ---- account sign-in state machine ----
  const [stage, setStage] = useState("id"); // "id" | "createPassword" | "verifyPassword" | "roleChoice" | "chooseShift" | "chooseStation" | "chooseTeam" | "chooseSeat"
  const [idInput, setIdInput] = useState("");
  const [foundAccount, setFoundAccount] = useState(null);
  const [seatUnit, setSeatUnit] = useState(null);
  const [joinTeamId, setJoinTeamId] = useState(null);
  // What this session will end up being — "dispatcher" (own desk) or "team"
  // (a seat on a unit). Set before the shift step, because that's what decides
  // whether a seat still has to be picked afterward.
  const [pendingRole, setPendingRole] = useState(null);
  const [shiftKey, setShiftKey] = useState(null);
  // Which of the two stations this session is working. Everything the
  // session then sees — calls, bookings, the log — is that station's.
  const [stationKey, setStationKey] = useState(null);
  // The partner being signed in on the same device, if there is one.
  const [partnerId, setPartnerId] = useState("");
  const [partnerError, setPartnerError] = useState("");
  const [partnerPw, setPartnerPw] = useState("");
  const [partnerOk, setPartnerOk] = useState(false);
  // Matched against the ID list the same way the person signing in was, so a
  // typo says so here rather than seating a name that does not exist.
  const [partnerAccount, setPartnerAccount] = useState(null);
  const partnerName = partnerAccount ? partnerAccount.name || partnerAccount.id : "";
  useEffect(() => {
    const q = (partnerId || "").trim().toLowerCase();
    if (!q) {
      setPartnerAccount(null);
      return;
    }
    let alive = true;
    const t = setTimeout(async () => {
      const accts = await readKey("ems:accounts", []);
      if (!alive) return;
      const hit = (accts || []).find((a) => a && a.id.toLowerCase() === q) || null;
      setPartnerAccount(hit);
      setPartnerError(hit ? "" : "That ID isn't recognised.");
    }, 400);
    return () => {
      alive = false;
      clearTimeout(t);
    };
  }, [partnerId]);

  // Checked as it is typed, so the crew know before they commit whether the
  // second seat is actually going to be taken.
  useEffect(() => {
    let alive = true;
    if (!partnerAccount || !partnerPw) {
      setPartnerOk(false);
      return;
    }
    (async () => {
      const hash = await hashPassword(partnerPw);
      if (!alive) return;
      const good = !!partnerAccount.passwordHash && hash === partnerAccount.passwordHash;
      setPartnerOk(good);
      setPartnerError(good || partnerPw.length < 4 ? "" : "That password doesn't match that ID.");
    })();
    return () => {
      alive = false;
    };
  }, [partnerAccount, partnerPw]);
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  // Dispatchers and admins get an extra step after their password: keep their
  // own view, or join a team as crew for this shift. Crew go straight on to
  // picking their shift, then the medic they're working, then a seat on it.
  const canJoinTeam = (accountRole) => accountRole === "admin" || accountRole === "dispatcher";

  async function routeAfterPassword(account) {
    if (canJoinTeam(account.role)) {
      setStage("roleChoice");
      return;
    }
    setPendingRole("team");
    setStage("chooseShift");
  }

  async function handleIdContinue() {
    if (!idInput.trim()) return;
    setBusy(true);
    setError("");
    const accts = await readKey("ems:accounts", []);
    const found = accts.find((a) => a.id.toLowerCase() === idInput.trim().toLowerCase());
    setBusy(false);
    if (!found) {
      setError("ID not recognized. Contact your admin.");
      return;
    }
    const expected = ROLE_CHOICES[role];
    if (expected && found.role !== expected.accountRole) {
      setError(`That isn't a ${expected.label.toLowerCase()} ID — try the ${expected.other} option instead.`);
      return;
    }
    setFoundAccount(found);
    setStage(found.passwordHash ? "verifyPassword" : "createPassword");
  }

  // Setting a password for the first time. The server decides whether that is
  // allowed — this screen cannot grant it.
  async function handleCreatePassword() {
    if (pw.length < 4) {
      setError("Password must be at least 4 characters.");
      return;
    }
    if (pw !== pw2) {
      setError("Passwords don't match.");
      return;
    }
    setBusy(true);
    const hash = await hashPassword(pw);
    const accts = await readKey("ems:accounts", []);
    const next = accts.map((a) => (a.id === foundAccount.id ? { ...a, passwordHash: hash } : a));
    await writeKey("ems:accounts", next);
    const updatedAccount = { ...foundAccount, passwordHash: hash };
    setFoundAccount(updatedAccount);
    setBusy(false);
    await routeAfterPassword(updatedAccount);
  }

  async function handleVerifyPassword() {
    setBusy(true);
    const hash = await hashPassword(pw);
    setBusy(false);
    if (hash !== foundAccount.passwordHash) {
      setError("Incorrect password.");
      setPw("");
      return;
    }
    await routeAfterPassword(foundAccount);
  }

  // Crew members choose their own seat at sign-in — fetch the chosen medic's
  // live occupancy so the two seats can be offered accurately, along with who
  // is sitting in them and on which shift, since a seat still held by an
  // outgoing crew member is exactly the handover case.
  async function enterSeatStage(unitId) {
    setBusy(true);
    setError("");
    const freshUnits = await readKey("ems:units", []);
    setSeatUnit(freshUnits.find((u) => u.id === unitId) || null);
    setBusy(false);
    setStage("chooseSeat");
  }

  function chooseJoinTeam(unitId) {
    setJoinTeamId(unitId);
    enterSeatStage(unitId);
  }

  // The shift step: what everyone signing on to work the board answers, since
  // the clock alone can't tell a day crew running late from a night crew
  // starting early.
  function chooseShift(key) {
    setShiftKey(key);
    setError("");
    // Then which station. Both roles answer it: the desk runs one station's
    // board, and a crew signs on to the medic they are actually working, which
    // only means anything once we know which station's medics to show them.
    setStage("chooseStation");
  }

  function chooseStation(key) {
    setStationKey(key);
    setError("");
    if (pendingRole === "dispatcher") {
      finishDispatcherLogin(foundAccount, shiftKey, key);
      return;
    }
    // Nobody is rostered to a fixed medic: the unit is chosen on the way in,
    // every time. Crews here move between medics from one shift to the next, so
    // an account that remembered a unit only ever recorded where someone used
    // to be — and put the wrong name against the wrong truck on the log sheet.
    setStage("chooseTeam");
  }

  async function finishDispatcherLogin(account, key, station) {
    setBusy(true);
    const now = Date.now();
    const assignment = shiftAssignment(key, now);
    const late = overtimeMs(assignment, now);
    const session = {
      role: "dispatcher",
      name: account.name || account.id,
      accountId: account.id,
      station: station || DEFAULT_STATION,
      ...assignment,
    };
    await addLog(
      `Dispatch — ${account.name || account.id} signed on at ${stationLabel(session.station)} for ${shiftPhrase(assignment)}` +
        (late > 0 ? ` · already ${msDurationStr(late)} past that shift's end` : ""),
      "shift",
      {
        kind: "on",
        role: "dispatcher",
        name: account.name || account.id,
        accountId: account.id,
        shift: key,
        station: session.station,
        shiftStart: assignment.shiftStart,
        shiftEnd: assignment.shiftEnd,
        overtimeMs: late,
      },
      // This device has no session yet, so the stamp comes from the person who
      // has just signed on rather than from whoever was here before them.
      actorStamp(session)
    );
    setBusy(false);
    onLogin(session);
  }

  // Taking a seat that someone is still sitting in: the outgoing crew member
  // is stood down (their own session drops back to the login screen on its next
  // poll) and the swap goes on the log sheet naming both sides.
  function takeOverSeat(seat, holder) {
    const holderMeta = shiftMeta(holder.shift);
    const ot = overtimeMs(holder, Date.now());
    const confirmed = window.confirm(
      `Take over ${seatLabel(seat)} on ${seatUnit ? seatUnit.name : "this team"}?\n\n` +
        `${holder.name} is still signed on${holderMeta ? ` for the ${holderMeta.label.toLowerCase()}` : ""}` +
        `${ot > 0 ? ` and is ${msDurationStr(ot)} into overtime` : ""}.\n\n` +
        `They will be stood down and the shift swap recorded on the log sheet.`
    );
    if (!confirmed) return;
    finishTeamLogin(foundAccount, seat);
  }

  // The other seat, taken at the same time and in the partner's own name. Only
  // ever the opposite seat to the one being signed into, and never over somebody
  // already sitting there — a crew sharing a tablet must not quietly stand down
  // whoever the board thinks is in that seat.
  async function seatPartnerIfAny(teamId, mySeat, assignment) {
    // No password, no seat. This is the whole point of asking for it.
    if (!partnerAccount || !partnerOk || !teamId) return null;
    const other = mySeat === "alpha" ? "bravo" : "alpha";
    const fresh = await readKey("ems:units", units);
    const unit = fresh.find((u) => u.id === teamId);
    if (!unit) return null;
    if (unit[other]) return { skipped: "occupied", seat: other };
    if (partnerAccount.id === (foundAccount ? foundAccount.id : "")) return { skipped: "same", seat: other };
    const member = {
      accountId: partnerAccount.id,
      name: partnerAccount.name || partnerAccount.id,
      signedOnAt: Date.now(),
      // Signed on from the other seat's device. Recorded so that when that seat
      // signs off, this one goes with it — the tablet is leaving the truck.
      viaSeat: mySeat,
      viaAccountId: foundAccount ? foundAccount.id : null,
      ...assignment,
    };
    await saveUnits(fresh.map((u) => (u.id === teamId ? { ...u, [other]: member } : u)));
    return { seated: member, seat: other };
  }

  async function finishTeamLogin(account, slot) {
    const teamId = joinTeamId;
    // The medic is always picked on the way in, so there is nothing to fall back
    // on if that step was somehow skipped — send them back to it.
    if (!teamId) {
      setStage("chooseTeam");
      return;
    }
    setBusy(true);
    const now = Date.now();
    const key = shiftKey || scheduledShiftKey(now);
    const assignment = shiftAssignment(key, now);

    // Crew (or a dispatcher/admin choosing to join a team): take the seat they
    // chose, stamped with the shift they're working. If the team was completely
    // unstaffed and idle, this also brings it back online automatically.
    const freshUnits = await readKey("ems:units", units);
    const unit = freshUnits.find((u) => u.id === teamId);
    const displaced = unit ? unit[slot] : null;
    const vacated = unit && unit.lastCrew ? unit.lastCrew[slot] : null;
    // Who this person is relieving: whoever is being taken over from right now,
    // or the last person to hold the seat if they left recently enough for it to
    // be the same handover rather than an unrelated shift days ago.
    const relieved =
      displaced ||
      (vacated && now - (vacated.signedOffAt || 0) <= HANDOVER_GRACE_MS ? vacated : null);

    // A seat whose crew are still out on a call is not taken — it is queued for.
    // They stay on it until they clear and sign out, and it transfers itself
    // then. The person arriving is on duty from now either way, so their own
    // hours start correctly.
    // Read straight from the board. This screen has no requests prop — reaching
    // for one threw before anything else could run, which stopped every crew
    // sign-on for every ID and looked like the app simply doing nothing.
    const freshRequests = (await readKey("ems:requests", [])) || [];
    const situation = reliefSituationFor(unit, slot, freshRequests, now);
    if (unit && situation === "still-out") {
      const out = unit[slot];
      const ok = window.confirm(
        `${unit.name} is still out on a call with ${out.name} in ${seatLabel(slot)}.\n\n` +
          `You will be signed on now and take the seat automatically the moment they clear and ` +
          `sign out — their overtime keeps counting until then, and the call keeps its crew.\n\n` +
          `Sign on as relief?`
      );
      if (!ok) {
        setBusy(false);
        return;
      }
      const nextUnits = freshUnits.map((u) =>
        u.id === teamId
          ? {
              ...u,
              relief: {
                ...(u.relief || {}),
                [slot]: {
                  accountId: account.id,
                  name: account.name || account.id,
                  queuedAt: now,
                  ...assignment,
                },
              },
            }
          : u
      );
      await saveUnits(nextUnits);
      const session = {
        role: "team",
        accountId: account.id,
        name: account.name || account.id,
        unitId: teamId,
        unitName: unit.name,
        station: stationOf(unit),
        slot,
        shift: key,
        ...assignment,
        // Waiting for the seat rather than sitting in it.
        awaitingRelief: true,
      };
      await addLog(
        `${unit.name} — ${session.name} signed on to relieve ${out.name} (${seatLabel(slot)}), ` +
          `who is still out on a call · takes the seat when they sign out`,
        "shift",
        {
          kind: "on",
          role: "team",
          name: session.name,
          accountId: account.id,
          unitId: teamId,
          unitName: unit.name,
          station: stationOf(unit),
          seat: slot,
          shift: key,
          shiftStart: assignment.shiftStart,
          shiftEnd: assignment.shiftEnd,
          awaitingRelief: true,
        },
        actorStamp(session)
      );
      setBusy(false);
      onLogin(session);
      return;
    }

    if (unit) {
      const bothEmptyBefore = !unit.alpha && !unit.bravo;
      // Signing on puts the team in service. Two cases need it: nobody was on
      // board (so no one can have chosen to be out of service), and a unit
      // still wearing an on-call status from a call that has already finished —
      // that second case is what left crews signed on while dispatch saw
      // nothing in service and had no team to assign a call to. A deliberate
      // "Out of service" from a crew member who is still on board is left
      // alone; their partner signing on doesn't override them.
      const staleOnCallStatus = !unit.assignedRequestId && ON_CALL_STATUSES.includes(unit.status);
      const comesIntoService =
        (bothEmptyBefore && (unit.status === "oos" || !unit.status)) || staleOnCallStatus;
      const nextUnits = freshUnits.map((u) =>
        u.id === teamId
          ? {
              ...u,
              [slot]: { accountId: account.id, name: account.name || account.id, ...assignment },
              status: comesIntoService ? "available" : u.status,
              assignedRequestId: staleOnCallStatus ? null : u.assignedRequestId,
            }
          : u
      );
      await saveUnits(nextUnits);
    }
    // Teams aren't fixed to a medic any more, so nothing about this sign-on is
    // written back to the account. Any unit left on an account from before that
    // change is cleared as its holder signs on, so the admin roster stops
    // showing a truck the person may not have worked for weeks.
    if (account.role === "crew" && account.team) {
      const accts = await readKey("ems:accounts", []);
      await writeKey(
        "ems:accounts",
        accts.map((a) => (a.id === account.id ? { ...a, team: null } : a))
      );
    }

    const unitName = unit ? unit.name : "";
    const late = overtimeMs(assignment, now);
    const relievedMeta = relieved ? shiftMeta(relieved.shift) : null;
    const relievedNote = relieved
      ? ` — ${displaced ? "taking over from" : "relieving"} ${relieved.name}` +
        (relievedMeta
          ? ` (${relievedMeta.label}${relieved.overtimeMs ? `, ${msDurationStr(relieved.overtimeMs)} overtime` : ""})`
          : "")
      : "";
    const session = {
      role: "team",
      name: account.name || account.id,
      unitId: teamId,
      unitName,
      // The station is taken from the unit itself rather than from what was
      // tapped on the way in, so a crew's session can never disagree with the
      // truck they are actually sitting in.
      station: stationOf(unit),
      slot,
      accountId: account.id,
      ...assignment,
    };
    await addLog(
      `${unitName ? `${unitName} (${stationShort(stationOf(unit))}) — ` : ""}${account.name || account.id} (${seatLabel(slot)}) ` +
        `signed on for ${shiftPhrase(assignment)}` +
        (late > 0 ? ` · already ${msDurationStr(late)} past that shift's end` : "") +
        relievedNote,
      "shift",
      {
        kind: displaced ? "swap" : "on",
        role: "team",
        name: account.name || account.id,
        accountId: account.id,
        unitName,
        station: stationOf(unit),
        seat: slot,
        shift: key,
        shiftStart: assignment.shiftStart,
        shiftEnd: assignment.shiftEnd,
        overtimeMs: late,
        relievedName: relieved ? relieved.name : null,
        relievedShift: relieved ? relieved.shift || null : null,
        relievedOvertimeMs: relieved ? relieved.overtimeMs || 0 : 0,
      },
      // Stamped from the session this sign-on creates, since the board doesn't
      // have it yet.
      actorStamp(session)
    );
    // If a partner's ID was given, they take the other seat now — recorded in
    // their own name, with the same shift, and logged as its own sign-on so the
    // sheet shows two people on the truck rather than one.
    const partnerResult = await seatPartnerIfAny(teamId, slot, assignment);
    if (partnerResult && partnerResult.seated) {
      await addLog(
        `${unitName ? `${unitName} — ` : ""}${partnerResult.seated.name} ` +
          `(${seatLabel(partnerResult.seat)}) signed on for ${shiftPhrase(assignment)} ` +
          `· signed in by ${account.name || account.id} on a shared device`,
        "shift",
        {
          kind: "on",
          role: "team",
          name: partnerResult.seated.name,
          accountId: partnerResult.seated.accountId,
          unitId: teamId,
          unitName,
          station: stationOf(unit),
          seat: partnerResult.seat,
          shift: key,
          shiftStart: assignment.shiftStart,
          shiftEnd: assignment.shiftEnd,
          sharedDevice: true,
        },
        actorStamp(session)
      );
    }

    setBusy(false);
    onLogin(session);
  }

  // Admins oversee the board around the clock and aren't rostered to either

// ---------- shift picker ----------

// The day/night question everyone working the board answers on the way in.
// Each option shows the actual 12-hour window it resolves to and whether that
// window is running now, still to come, or already over — the last case being
// someone signing on to carry a call past the end of their shift.
function ShiftPicker({ subject, busy, onPick, onBack }) {
  const now = Date.now();
  const suggested = scheduledShiftKey(now);
  return (
    <>
      <div style={styles.loginSub}>
        Which shift is {subject} working? The clock says {SHIFTS[suggested].label.toLowerCase()} right now.
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 10 }}>
        {SHIFT_KEYS.map((key) => {
          const meta = SHIFTS[key];
          const w = shiftWindowFor(key, now);
          const state =
            now < w.start
              ? `Starts ${hhmm(w.start)}`
              : now < w.end
              ? `On now — ends ${hhmm(w.end)}, ${shortDurationStr(w.end - now)} to run`
              : `Ended ${hhmm(w.end)} — signing on ${shortDurationStr(now - w.end)} into overtime`;
          return (
            <button
              key={key}
              style={{ ...styles.roleBtn, borderColor: key === suggested ? meta.color : "#26384A" }}
              disabled={busy}
              onClick={() => onPick(key)}
            >
              <div style={{ textAlign: "left" }}>
                <div style={styles.roleBtnTitle}>
                  <span style={{ color: meta.color, marginRight: 6 }}>{meta.glyph}</span>
                  {meta.label} · {meta.window}
                </div>
                <div style={styles.roleBtnSub}>{state}</div>
              </div>
              <ChevronRight size={18} color="#93A7B8" />
            </button>
          );
        })}
      </div>
      <InfoNote label="More about this">
        Working past the end of your 12 hours is fine — the board keeps counting and puts the extra
        time on the log sheet as overtime.
      </InfoNote>
      <div style={styles.loginActions}>
        <button style={styles.ghostBtn} disabled={busy} onClick={onBack}>Back</button>
      </div>
    </>
  );
}

// The volume control for this device, in the masthead where it is reachable
// from every screen without going looking for a settings page: on a crew tablet
// that has started alerting, "where do I turn this down" has to be answerable in
// one tap.
//
// It stays visibly loud about being quiet. Muted, the chip itself goes amber and
// says MUTED rather than shrinking into the bar, because the failure this
// setting can cause — a crew who silenced the board on a quiet afternoon and
// forgot — is worse than the noise it fixes.
function SoundChip() {
  const [open, setOpen] = useState(false);
  const level = useSoundLevel();
  const meta = soundLevelMeta(level);
  const muted = meta.gain <= 0;

  return (
    <div style={styles.shiftChipWrap}>
      <button
        style={{
          ...styles.soundChip,
          borderColor: muted ? "#FFB020" : "#26384A",
          color: muted ? "#FFC24D" : "#E9F1F7",
        }}
        onClick={() => setOpen((s) => !s)}
        title={
          muted
            ? "Alert tones are silenced on this device — tap to turn them back on"
            : `Alert tone volume: ${meta.label} — tap to change`
        }
      >
        {muted ? <VolumeX size={13} /> : <Volume2 size={13} />}
        <span style={{ fontWeight: 700 }}>{meta.short}</span>
      </button>

      {open && (
        <div style={styles.shiftMenu}>
          <div style={styles.shiftMenuHead}>
            ALERT TONE VOLUME — THIS DEVICE ONLY
          </div>
          {SOUND_LEVELS.map((l) => {
            const on = l.key === level;
            return (
              <button
                key={l.key}
                style={on ? styles.soundMenuBtnOn : styles.shiftMenuBtn}
                onClick={() => {
                  setSoundLevel(l.key);
                  // Play the new level back straight away, so "medium" is a
                  // loudness that has been heard rather than a word. Silent has
                  // nothing to play, and says so instead.
                  if (l.gain > 0) soundCallAlert(soundChipCtxRef, "routine");
                }}
              >
                {on ? "● " : "○ "}
                {l.label} — {l.note}
              </button>
            );
          })}
          <div style={styles.shiftMenuHint}>
            {muted
              ? "This device is silent. Calls still arrive — the full-screen alarm, the vibration and the call notification all still come through — but nothing will make a sound until you turn the tone back on."
              : "Your phone or tablet's own silent switch does not reach this board, so this is the only thing that quietens it. The setting is remembered on this device and does not affect anyone else's screen."}
          </div>
        </div>
      )}
    </div>
  );
}

// The chip's own audio context, so previewing a volume doesn't depend on being
// handed the one the app threads through the views.
const soundChipCtxRef = { current: null };

// Live readout of the shift this session signed on for: how much of the 12
// hours is left and, once that runs out, how deep into overtime it is. Opening
// it swaps the shift on the record without signing out — what a crew carrying
// a call past 19:00 (or 07:00) does when they take the next shift as well.
// Admins aren't on either shift, so they don't get a chip.
function ShiftChip({ user, onChangeShift }) {
  const [open, setOpen] = useState(false);
  const meta = shiftMeta(user.shift);
  if (!meta) return null;

  // The whole app re-renders every second off the header clock, so reading the
  // time here is enough to keep this counting down live.
  const now = Date.now();
  const ot = overtimeMs(user, now);
  const left = shiftRemainingMs(user, now);
  const starts = user.shiftStart && now < user.shiftStart;

  return (
    <div style={styles.shiftChipWrap}>
      <button
        style={{
          ...styles.shiftChip,
          borderColor: ot > 0 ? "#FF4D5E" : meta.color,
          color: ot > 0 ? "#FCA5A5" : "#E9F1F7",
        }}
        onClick={() => setOpen((s) => !s)}
        title={`${meta.label} ${shiftWindowStr(user)} — tap to swap shift`}
      >
        <span style={{ color: meta.color }}>{meta.glyph}</span>
        <span style={{ fontWeight: 700 }}>{meta.short}</span>
        <span style={styles.shiftChipTime}>
          {ot > 0
            ? `OT ${msDurationStr(ot)}`
            : starts
            ? `starts ${hhmm(user.shiftStart)}`
            : `${msDurationStr(left)} left`}
        </span>
      </button>

      {open && (
        <div style={styles.shiftMenu}>
          <div style={styles.shiftMenuHead}>
            On {meta.label} · {shiftWindowStr(user)}
            {ot > 0 ? ` · ${shortDurationStr(ot)} overtime` : ""}
          </div>
          {SHIFT_KEYS.filter((k) => k !== user.shift).map((k) => (
            <button
              key={k}
              style={styles.shiftMenuBtn}
              onClick={() => {
                setOpen(false);
                onChangeShift(k);
              }}
            >
              Swap to {SHIFTS[k].label} ({SHIFTS[k].window})
            </button>
          ))}
          <div style={styles.shiftMenuHint}>
            Swapping re-bases your 12 hours on the new shift and records the swap — with any overtime
            carried over — on the log sheet.
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- status board ----------

function StatusBoard({ units }) {
  const counts = Object.keys(STATUS).reduce((acc, k) => ({ ...acc, [k]: 0 }), {});
  units.forEach((u) => { const k = statusKey(u.status); counts[k] = (counts[k] || 0) + 1; });
  return (
    <div style={styles.statusBoard}>
      {Object.entries(STATUS).map(([key, meta]) => (
        <div key={key} style={styles.statusBoardItem}>
          <Circle size={8} fill={meta.color} color={meta.color} />
          <span style={styles.statusBoardCount}>{counts[key] || 0}</span>
          <span style={styles.statusBoardLabel}>{meta.label}</span>
        </div>
      ))}
    </div>
  );
}

// Every stamp on a call, in the order it was made: the fixed timeline steps,
// plus — sitting where it happened, between arrival and departure — the moment
// the patient refused the transfer, if they did. The refusal is picked out in
// its own colour because it is the one stamp that changes what the call was.
function callTimeChips(times) {
  const t = times || {};
  const chips = [];
  const refused = t[REFUSAL_TIME_KEY];
  let refusalPlaced = false;
  const pushRefusal = () => {
    if (refused && !refusalPlaced) {
      refusalPlaced = true;
      chips.push({ key: REFUSAL_TIME_KEY, label: REFUSAL_TIME_LABEL, ts: refused, color: NO_TRANSPORT.color });
    }
  };
  TIME_STEPS.forEach((s) => {
    if (t[s.timeKey]) chips.push({ key: s.timeKey, label: s.timeLabel, ts: t[s.timeKey] });
    // A refusal recorded without an arrival stamp (an older record, or a crew
    // who marked it before the step) still appears — just earlier in the row.
    if (s.timeKey === "arrival") pushRefusal();
  });
  pushRefusal();
  return chips;
}

function CallTimes({ times }) {
  const chips = callTimeChips(times);
  if (chips.length === 0) return null;
  return (
    <div style={styles.timesRow}>
      {chips.map((c) => (
        <div key={c.key} style={c.color ? { ...styles.timeChip, borderColor: c.color } : styles.timeChip}>
          <span style={c.color ? { ...styles.timeChipLabel, color: c.color } : styles.timeChipLabel}>{c.label}</span>
          <span style={styles.timeChipValue}>{clockStr(c.ts)}</span>
        </div>
      ))}
    </div>
  );
}

// The one-line stamp a call carries once the patient has refused the transfer:
// the ambulance responded, nobody was moved. Sits with the status pills on the
// desk, on the crew's own card, in the history and on the admin monitor, so
// there is no view of the call where the outcome has to be inferred.
function NoTransportTag({ req, style }) {
  if (!isNoTransport(req)) return null;
  const at = req.times ? req.times[REFUSAL_TIME_KEY] : null;
  const signed = req.refusal || null;
  return (
    <span
      style={{ ...styles.noTransportTag, ...style }}
      title={
        `Patient refused the transfer${at ? ` at ${clockStr(at)}` : ""}` +
        (signed ? ` — signed by ${signed.name} (${signed.relation}, National ID ${signed.nationalId})` : "")
      }
    >
      <Ban size={11} /> {NO_TRANSPORT.label}
    </span>
  );
}

// The matching stamp for a call that was never run at all — stood down, called
// off by the ward, a duplicate, nobody at the pickup point. It reads off the
// close reason, so it only ever appears on a closed call, and it is what makes
// the "Cancelled requests" filter legible: a card in that list says on its face
// why it is there instead of leaving the reason to be found three lines down.
function CancelledTag({ req, style }) {
  if (!callWasCancelled(req)) return null;
  return (
    <span style={{ ...styles.cancelledCallTag, ...style }} title={callCloseReason(req)}>
      <CircleSlash size={11} /> CANCELLED
    </span>
  );
}

// Who is writing the patient care report for this call, carried on every view
// of it: the crew's own card, the desk, the admin monitor and the history. Once
// a crew are sitting at the destination with the call still open, the missing
// name is usually the reason — so at that point the absence is shown too,
// rather than leaving a desk to guess why nobody has gone back in service.
function PcrAuthorTag({ req, style }) {
  const a = pcrAuthorOf(req);
  if (!a) {
    if (!req || req.status !== "arrived") return null;
    return (
      <span
        style={{ ...styles.pcrAuthorTagPending, ...style }}
        title="The crew have not named a PCR author yet — the call cannot go back in service until they do"
      >
        <FileSignature size={11} /> PCR AUTHOR NOT SET
      </span>
    );
  }
  return (
    <span style={{ ...styles.pcrAuthorTag, ...style }} title={`PCR author: ${pcrAuthorText(req)}`}>
      <FileSignature size={11} /> PCR: {pcrAuthorText(req)}
    </span>
  );
}

// The two codes as they read on a card: the letter or the number first, because
// that is what goes on the sheet, with what it means alongside so nobody has to
// hold the table in their head. They appear on every view of a call — the desk,
// the crew's own card, the admin monitor and the history — so a call that has
// not been coded is visibly uncoded wherever it is looked at.
function CallTypeTag({ req, style }) {
  const t = callTypeOf(req);
  if (!t) return null;
  return (
    <span
      style={{ ...styles.codeTag, borderColor: t.color, color: t.color, ...style }}
      title={`Category of call ${t.key} — ${t.desc}${req.callTypeBy ? ` · set by ${req.callTypeBy}` : ""}`}
    >
      <Tag size={11} /> TYPE {t.key} · {t.name}
    </span>
  );
}

function LoadedKmTag({ req, style }) {
  const k = loadedKmOf(req);
  if (!k) return null;
  return (
    <span
      style={{ ...styles.codeTag, borderColor: LOADED_KM_COLOR, color: LOADED_KM_COLOR, ...style }}
      title={`Loaded kilometers band ${k.key} — ${k.desc}${req.loadedKmBy ? ` · set by ${req.loadedKmBy}` : ""}`}
    >
      <Ruler size={11} /> KM {k.key} · {k.name}
    </span>
  );
}

// The picker for both codes, in one block. Wherever it is drawn — the desk's
// call card, the crew's card, the history list — it is the same block doing the
// same thing, because the desk and the crew are filling in the same two boxes on
// the same sheet and a different layout in each place would only invite them to
// be filled in differently.
//
// Wide, thumb-sized targets for the same reason the PCR seats are: this is
// pressed on a tablet in a moving vehicle.
//
// `missing` is the subset of ["callType", "loadedKm"] that is currently holding
// a call open. It is only ever passed on the crew's own card, at the last step;
// everywhere else the block is drawn quietly, because everywhere else these are
// two boxes somebody is helpfully filling in rather than the thing between a
// crew and the end of their call.
function CallCodingBlock({ req, onSet, title, hint, missing }) {
  const type = callTypeOf(req);
  const km = loadedKmOf(req);
  const suggested = type ? null : suggestedCallType(req);
  const needType = !!missing && missing.includes("callType");
  const needKm = !!missing && missing.includes("loadedKm");
  const required = needType || needKm;

  return (
    <div style={required ? styles.codingBlockRequired : styles.codingBlock}>
      <div style={required ? styles.codingHeaderRequired : styles.codingHeader}>
        <Tag size={11} /> {title || "CALL TYPE & LOADED KILOMETERS"}
        {required ? " — REQUIRED BEFORE BACK IN SERVICE" : ""}
      </div>

      <div style={needType ? styles.codingRowLabelRequired : styles.codingRowLabel}>
        CATEGORY OF CALL{needType ? " — NOT SET" : ""}
      </div>
      <div style={styles.codingChoices}>
        {CALL_TYPES.map((t) => {
          const on = !!type && type.key === t.key;
          const isSuggested = suggested === t.key;
          return (
            <button
              key={t.key}
              type="button"
              style={{
                ...(on ? styles.codeChoiceOn : styles.codeChoice),
                borderColor: on ? t.color : isSuggested ? "rgba(245,158,11,0.7)" : "#26384A",
                ...(on ? { color: t.color } : null),
              }}
              title={`${t.key} — ${t.desc}`}
              onClick={() => onSet("callType", t.key)}
            >
              <span style={styles.codeChoiceKey}>{t.key}</span>
              <span style={styles.codeChoiceName}>{t.name}</span>
            </button>
          );
        })}
      </div>
      {suggested && (
        <div style={styles.codingSuggestion}>
          This call looks like a <strong>{suggested}</strong> —{" "}
          {callTypeMeta(suggested).desc.toLowerCase()}. Tap it to record that, or pick another.
        </div>
      )}

      <div
        style={{
          ...(needKm ? styles.codingRowLabelRequired : styles.codingRowLabel),
          marginTop: 10,
        }}
      >
        LOADED KILOMETERS{needKm ? " — NOT SET" : ""}
      </div>
      <div style={styles.codingChoices}>
        {LOADED_KM.map((k) => {
          const on = !!km && km.key === k.key;
          return (
            <button
              key={k.key}
              type="button"
              style={{
                ...(on ? styles.codeChoiceOn : styles.codeChoice),
                borderColor: on ? LOADED_KM_COLOR : "#26384A",
                ...(on ? { color: LOADED_KM_COLOR } : null),
              }}
              title={`${k.key} — ${k.desc}`}
              onClick={() => onSet("loadedKm", k.key)}
            >
              <span style={styles.codeChoiceKey}>{k.key}</span>
              <span style={styles.codeChoiceName}>{k.name}</span>
            </button>
          );
        })}
      </div>

      <div style={required ? styles.codingNoteRequired : styles.codingNote}>
        {required
          ? `Set ${needType && needKm ? "both codes" : needType ? "the category of call" : "the loaded kilometers"} ` +
            "to go back in service. The dispatcher can still correct either one afterwards, but the call does not close without them."
          : hint ||
            "Either the team or the dispatcher can set these, and either can correct the other's. They go straight onto the CAT. OF CALL and KILO METER columns of the dispatch log."}
        {type && req.callTypeBy ? ` · Type ${type.key} by ${req.callTypeBy}` : ""}
        {km && req.loadedKmBy ? ` · Km ${km.key} by ${req.loadedKmBy}` : ""}
      </div>
    </div>
  );
}

// The same two codes as a pair of intake selects, for the forms where a call is
// being written down rather than worked. Optional on both: a desk taking a call
// on the radio should never be held up by a code the crew will know better in
// twenty minutes.
function CallCodingFields({ callType, setCallType, loadedKm, setLoadedKm }) {
  return (
    <div style={styles.formRow}>
      <div style={{ flex: 1, minWidth: 200 }}>
        <label style={styles.label}>Call type (CAT. OF CALL) — optional</label>
        <select style={styles.input} value={callType} onChange={(e) => setCallType(e.target.value)}>
          <option value="">Not coded yet</option>
          {CALL_TYPES.map((t) => (
            <option key={t.key} value={t.key}>
              {t.key} — {t.desc}
            </option>
          ))}
        </select>
      </div>
      <div style={{ flex: 1, minWidth: 200 }}>
        <label style={styles.label}>Loaded kilometers — optional</label>
        <select style={styles.input} value={loadedKm} onChange={(e) => setLoadedKm(e.target.value)}>
          <option value="">Not coded yet</option>
          {LOADED_KM.map((k) => (
            <option key={k.key} value={k.key}>
              {k.key} — {k.desc}
            </option>
          ))}
        </select>
      </div>
    </div>

}

// Where the ask for a second ambulance has got to, shown on the call itself.
// Read by the crew who asked (is help coming?) and by every desk (has this been
// dealt with?), which is why it says the same thing in both places.
function AssistStatusLine({ req, units }) {
  const a = assistOf(req);
  if (!a) return null;
  const helping = assistTeams(req).filter((t) => !t.clearedAt);
  const done = assistTeams(req).filter((t) => t.clearedAt);
  return (
    <div style={styles.assistStatusLine}>
      {a.status === "pending" && (
        <span style={styles.assistStatusWaiting}>
          <HandRaised size={11} /> Additional ambulance requested {clockStr(a.requestedAt)}
          {a.requestedByUnitName ? ` by ${a.requestedByUnitName}` : ""} — waiting for dispatch to send a
          team
        </span>
      )}
      {a.status === "cancelled" && (
        <span style={styles.assistStatusStood}>
          Assist request stood down{a.cancelledBy ? ` — ${a.cancelledBy}` : ""}
          {a.cancelledAt ? ` at ${clockStr(a.cancelledAt)}` : ""}
        </span>
      )}
      {helping.map((t) => {
        const u = (units || []).find((x) => x.id === t.unitId);
        return (
          <span key={t.unitId} style={styles.assistStatusHelping}>
            <Ambulance size={11} /> {t.unitName || (u ? u.name : t.unitId)} assisting since{" "}
            {clockStr(t.assignedAt)}
            {t.acknowledgedAt ? "" : " · not acknowledged yet"}
          </span>
        );
      })}
      {done.map((t) => (
        <span key={`${t.unitId}-done`} style={styles.assistStatusDone}>
          {t.unitName || t.unitId} assisted {clockStr(t.assignedAt)}–{clockStr(t.clearedAt)}
        </span>
      ))}
    </div>
  );
}

// ---------- the desk's assist tasks ----------
//
// A crew asking for a second ambulance is the one alert on this board that
// nobody can act on from a tablet: only the desk can send another team. So it
// arrives as both halves of the thing dispatch needs — a noise and a system
// notification the moment it is asked for, and a task at the top of the desk
// that does not go away until a team has been sent to that call (or the desk
// stands the request down). It is deliberately not dismissable.
const ASSIST_RENAG_MS = 2 * 60 * 1000;

// Keyed by the ask, and by which two-minute round of it we are in: a request
// still sitting unanswered chimes again, because a crew waiting for help is not
// something a desk should be able to hear once and forget.
function assistAlertKey(req, now) {
  const a = assistOf(req) || {};
  const at = a.requestedAt || 0;
  const round = at ? Math.floor(Math.max(0, now - at) / ASSIST_RENAG_MS) : 0;
  return `assist:${req.id}@${at}#${round}`;
}

function useAssistAlerts(user, requests, audioCtxRef) {
  const seesTasks = !!user && (user.role === "dispatcher" || user.role === "admin");
  const now = Date.now();
  const pending = seesTasks ? pendingAssistCalls(requests) : [];
  const keys = pending.map((r) => assistAlertKey(r, now)).join("|");
  const latest = useRef({ pending, now });
  latest.current = { pending, now };

  useEffect(() => {
    const { pending: list, now: at } = latest.current;
    if (list.length === 0) return;
    const fired = readPreAlerted();
    let chime = false;
    list.forEach((req) => {
      const key = assistAlertKey(req, at);
      if (fired[key]) return;
      markPreAlerted(key, at);
      chime = true;
      notifyAssistRequest(req, assistOf(req).requestedByUnitName);
    });
    // Several asks landing together get one noise between them.
    if (chime) {
      soundCallAlert(audioCtxRef, "critical");
      buzz([300, 150, 300, 150, 300]);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [keys]);

  return pending;
}

function AssistanceTasks({ user, units, requests, saveUnits, saveRequests, addLog, audioCtxRef }) {
  const pending = useAssistAlerts(user, requests, audioCtxRef);
  const now = Date.now();
  if (!user || (user.role !== "dispatcher" && user.role !== "admin")) return null;
  if (pending.length === 0) return null;

  const free = assignableUnits(units, requests);

  async function sendAssistUnit(reqId, unitId) {
    const freshRequests = await readKey("ems:requests", requests);
    const freshUnits = await readKey("ems:units", units);
    const req = freshRequests.find((r) => r.id === reqId);
    const unit = freshUnits.find((u) => u.id === unitId);
    if (!req || !unit) return;
    if (req.status === "completed") {
      window.alert("That call has been closed. Nothing to send a second team to.");
      return;
    }
    // The same guard the ordinary assignment uses: this dropdown may have been
    // drawn before another desk (or the crew themselves) took this team onto
    // something else.
    const busyOn = liveRequestFor(unit, freshRequests);
    if (busyOn) {
      window.alert(`${unit.name} was just put on "${busyOn.nature}". Pick another team.`);
      return;
    }
    const at = Date.now();
    const a = assistOf(req) || {};
    const nextRequests = freshRequests.map((r) =>
      r.id === reqId
        ? {
            ...r,
            assist: {
              ...a,
              status: "assigned",
              teams: [
                ...assistTeams(r),
                {
                  unitId: unit.id,
                  unitName: unit.name,
                  assignedAt: at,
                  assignedBy: user && user.name ? user.name : "Dispatch",
                  acknowledgedAt: null,
                  clearedAt: null,
                },
              ],
            },
          }
        : r
    );
    const nextUnits = freshUnits.map((u) =>
      u.id === unitId ? { ...u, status: "dispatched", assignedRequestId: reqId } : u
    );
    await saveRequests(nextRequests);
    await saveUnits(nextUnits);
    await addLog(
      `${unit.name} sent as an additional ambulance to ${req.nature} — ${callRoute(req)}${
        a.requestedByUnitName ? ` (requested by ${a.requestedByUnitName})` : ""
      }`,
      "assign"
    );
  }

  async function standDown(reqId) {
    const freshRequests = await readKey("ems:requests", requests);
    const req = freshRequests.find((r) => r.id === reqId);
    if (!req) return;
    const ok = window.confirm(
      `Stand down the request for a second ambulance on "${req.nature}"?\n\n` +
        "The crew who asked for it will see that no team is coming."
    );
    if (!ok) return;
    const at = Date.now();
    const nextRequests = freshRequests.map((r) =>
      r.id === reqId
        ? {
            ...r,
            assist: {
              ...assistOf(r),
              status: "cancelled",
              cancelledAt: at,
              cancelledBy: user && user.name ? user.name : "Dispatch",
            },
          }
        : r
    );
    await saveRequests(nextRequests);
    await addLog(
      `Assist request stood down — ${req.nature} (${callRoute(req)}) will be run by ${
        assistOf(req) && assistOf(req).requestedByUnitName ? assistOf(req).requestedByUnitName : "the assigned team"
      } alone`,
      "clear"
    );
  }

  return (
    <div style={styles.assistPanel}>
      <div style={styles.assistPanelHead}>
        <span style={styles.assistPanelTitle}>
          <HandRaised size={13} /> ASSISTANCE NEEDED
        </span>
        <span style={styles.assistPanelCount}>
          {pending.length === 1
            ? "1 team has asked for a second ambulance"
            : `${pending.length} teams have asked for a second ambulance`}{" "}
          — assign another team to the same call
        </span>
      </div>
      {pending.map((req) => {
        const a = assistOf(req);
        const asker = units.find((u) => u.id === a.requestedByUnitId);
        const waiting = Math.max(0, now - (a.requestedAt || now));
        const options = free.filter((u) => u.id !== a.requestedByUnitId);
        return (
          <div key={req.id} style={styles.assistTaskRow}>
            <div style={styles.assistTaskMain}>
              <span style={styles.assistTaskUnit}>
                {a.requestedByUnitName || (asker ? asker.name : "A team")}
              </span>
              <span style={styles.assistTaskNature}>{req.nature}</span>
              <span style={styles.assistTaskRoute}>{callRoute(req)}</span>
              <span style={{ ...styles.pill, background: REQ_STATUS[req.status] ? REQ_STATUS[req.status].color : "#64748B" }}>
                {REQ_STATUS[req.status] ? REQ_STATUS[req.status].label : req.status}
              </span>
              <span style={styles.assistTaskWaiting}>
                asked {clockStr(a.requestedAt)} · waiting {shortDurationStr(waiting)}
              </span>
            </div>
            <div style={styles.assistTaskActions}>
              {options.length > 0 ? (
                <select
                  style={styles.assignSelect}
                  defaultValue=""
                  onChange={(e) => e.target.value && sendAssistUnit(req.id, e.target.value)}
                >
                  <option value="">Send second team…</option>
                  {options.map((u) => {
                    const note = assignableNote(u);
                    return (
                      <option key={u.id} value={u.id}>
                        {u.name}{note ? ` — ${note}` : ""}
                      </option>
                    );
                  })}
                </select>
              ) : (
                <span style={styles.staffingWarn}>
                  No other team is free — the next one to clear can be sent from here.
                </span>
              )}
              <button style={styles.ghostBtnSm} onClick={() => standDown(req.id)}>
                Stand down
              </button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// The correction form. The same fields for whoever opens it — what differs is
// what happens on save, which the caller decides: the desk's changes land on
// the call, a crew's are proposed and wait. `mode` only changes the wording so
// nobody is in any doubt which of the two they are doing.
// Signing for a refusal. All three answers are required: a refusal recorded
// against nobody is not a record, and "the family" is not a name. The call is
// not stamped until this is filled in, so a crew cannot half-record it.
// Who took the patient at the other end.
//
// A transfer ends with a handover to somebody, and until now the record simply
// stopped at "arrived". Naming the person who received the patient closes the
// chain of custody: the crew stamped the time, and this says who they gave the
// patient to. It is stamped with the crew member who recorded it, so the entry
// itself is accountable.
// An explanation that stays out of the way until it is wanted.
//
// These notes are useful the first week and clutter for ever afterwards, and on
// a phone-sized card they were pushing the timeline off the screen. The dot is
// always there for whoever needs it; the words are not.
function InfoNote({ children, label }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ marginTop: 8 }}>
      <button style={styles.infoDot} onClick={() => setOpen((v) => !v)} title="What is this?">
        <span style={styles.infoGlyph}>i</span>
        {label || "What is this?"}
      </button>
      {open && <div style={styles.infoBody}>{children}</div>}
    </div>
  );
}

// A call as a tile.
//
// On a busy board the full cards ran to several screens, and finding one meant
// scrolling past nine others. The tile carries what identifies a call at a
// glance — the priority down the edge, the nature, where it is going, its team
// and its clock — and opens into the card it always was when it is tapped.
//
// Deliberately the same size and shape as the unit squares above it, so the
// board reads as one thing rather than two.
function CallTile({ req, unit, onOpen, dim }) {
  const p = PRIORITY[req.priority] || {};
  const started = callStartTs(req);
  return (
    <button
      style={{
        ...styles.callTile,
        borderLeftColor: p.color,
        opacity: dim ? 0.75 : 1,
      }}
      onClick={onOpen}
    >
      <div style={styles.callTileTop}>
        <span style={{ ...styles.callTileDot, background: p.color }} />
        <span style={styles.callTileNature}>{req.nature}</span>
      </div>
      <div style={styles.callTileRoute}>{callRoute(req)}</div>
      <div style={styles.callTileFoot}>
        <span style={styles.callTileUnit}>{unit ? unit.name : "Unassigned"}</span>
        <span style={styles.callTileTime}>{hhmm(started)}</span>
      </div>
      {/* The things that change the answer at a glance. */}
      <div style={styles.callTileTags}>
        {req.status && REQ_STATUS[req.status] && (
          <span style={{ ...styles.callTileTag, color: REQ_STATUS[req.status].color }}>
            {REQ_STATUS[req.status].label}
          </span>
        )}
        {assistPending(req) && <span style={styles.callTileAssist}>ASSIST</span>}
        {req.handover && <span style={styles.callTileHandover}>HANDED OVER</span>}
      </div>
    </button>
  );
}

// The crew's own list. Three answers per item, nothing pre-selected, and it
// cannot be filed until every item has one — a checklist with blanks in it is
// the thing everybody signs and nobody reads.
function ChecklistCard({ part, items, run, onSubmit, disabled }) {
  const [answers, setAnswers] = useState({});
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false);

  if (!items || items.length === 0) return null;

  // Already done for today, by whoever did it.
  if (run) {
    const flags = checklistFlags(run, items);
    return (
      <div style={styles.checkDone}>
        <div style={styles.checkDoneHead}>
          <CheckCircle2 size={13} style={{ verticalAlign: -2, marginRight: 6 }} />
          {part.label} done today — {run.byName} at {clockStr(run.at)}
        </div>
        {flags.length > 0 ? (
          <div style={styles.checkFlagList}>
            {flags.map((f) => (
              <div key={f.item.id} style={styles.checkFlagRow}>
                <span
                  style={{
                    ...styles.checkFlagTag,
                    color: (CHECK_ANSWERS.find((a) => a.key === f.answer) || {}).color,
                  }}
                >
                  {(CHECK_ANSWERS.find((a) => a.key === f.answer) || {}).label}
                </span>
                {f.item.text}
              </div>
            ))}
          </div>
        ) : (
          <div style={styles.checkAllGood}>Everything available.</div>
        )}
        {run.note && <div style={styles.checkNoteShown}>“{run.note}”</div>}
      </div>
    );
  }

  const answered = items.filter((it) => answers[it.id]).length;
  const ready = answered === items.length;

  return (
    <div style={styles.checkCard}>
      <div style={styles.checkHead}>
        <ClipboardList size={14} style={{ verticalAlign: -2, marginRight: 7 }} />
        {part.label.toUpperCase()} — {answered} of {items.length}
      </div>
      <div style={styles.checkSub}>
        Checked once a day for this vehicle, by the {part.who}.
      </div>

      <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>
        {items.map((it) => (
          <div key={it.id} style={styles.checkItem}>
            <div style={styles.checkItemText}>{it.text}</div>
            <div style={styles.checkItemBtns}>
              {CHECK_ANSWERS.map((a) => {
                const on = answers[it.id] === a.key;
                return (
                  <button
                    key={a.key}
                    style={{
                      ...styles.checkAnswerBtn,
                      ...(on
                        ? { background: a.color, color: "#0A1017", borderColor: a.color, fontWeight: 800 }
                        : { color: a.color, borderColor: `${a.color}66` }),
                    }}
                    onClick={() => setAnswers((v) => ({ ...v, [it.id]: a.key }))}
                  >
                    {a.label}
                  </button>
                );
              })}
            </div>
          </div>
        ))}
      </div>

      <input
        style={{ ...styles.input, marginTop: 10 }}
        value={note}
        onChange={(e) => setNote(e.target.value)}
        placeholder="Anything worth saying (optional)"
      />

      <button
        style={ready ? styles.checkSubmit : styles.checkSubmitOff}
        disabled={!ready || busy || disabled}
        onClick={async () => {
          setBusy(true);
          try {
            await onSubmit({ answers, note: note.trim() });
          } finally {
            setBusy(false);
          }
        }}
      >
        {ready
          ? busy
            ? "Filing…"
            : `File ${part.label.toLowerCase()}`
          : `${items.length - answered} still to answer`}
      </button>
    </div>
  );
}

function CallEditForm({ req, mode, onSubmit, onCancel }) {
  const [vals, setVals] = React.useState(() => {
    const o = {};
    EDITABLE_FIELDS.forEach((f) => {
      o[f.key] = req && req[f.key] !== undefined && req[f.key] !== null ? String(req[f.key]) : "";
    });
    return o;
  });
  const [note, setNote] = React.useState("");
  const [busy, setBusy] = React.useState(false);

  // Only what actually moved is worth recording — an untouched form should not
  // stamp the call with four "changes" that changed nothing.
  const changes = EDITABLE_FIELDS.map((f) => {
    const before = req && req[f.key] !== undefined && req[f.key] !== null ? String(req[f.key]) : "";
    const after = vals[f.key] || "";
    return { field: f.key, from: before.trim(), to: after.trim() };
  }).filter((c) => c.from !== c.to);

  const proposing = mode === "propose";

  async function submit() {
    if (!changes.length || busy) return;
    setBusy(true);
    try {
      await onSubmit(changes, note.trim());
    } finally {
      setBusy(false);
    }
  }

  return (
    <div style={styles.editPanel}>
      <div style={styles.editPanelHead}>
        {proposing ? "REPORT WRONG DETAILS ON THIS CALL" : "CORRECT THE CALL DETAILS"}
      </div>
      <div style={styles.editPanelNote}>
        {proposing
          ? "Change whatever is wrong and send it to the desk. Nothing on the call moves until dispatch confirms it — the details below stay as they are until then."
          : "Whatever you change here is corrected on the call straight away, and the change is recorded against your name."}
      </div>

      {EDITABLE_FIELDS.map((f) => {
        const opts = f.options ? f.options() : null;
        return (
          <div key={f.key} style={{ marginTop: 8 }}>
            <label style={styles.label}>{f.label}</label>
            {opts ? (
              <select
                style={styles.input}
                value={vals[f.key]}
                onChange={(e) => setVals((v) => ({ ...v, [f.key]: e.target.value }))}
              >
                <option value="">Not stated</option>
                {opts.map((o) => (
                  <option key={o} value={o}>{f.display ? f.display(o) : o}</option>
                ))}
              </select>
            ) : (
              <input
                style={styles.input}
                value={vals[f.key]}
                onChange={(e) => setVals((v) => ({ ...v, [f.key]: e.target.value }))}
                placeholder={f.key === "mrn" ? "Enter the National ID number if no MRN is available" : ""}
              />
            )}
          </div>
        );
      })}

      <div style={{ marginTop: 8 }}>
        <label style={styles.label}>Note (optional)</label>
        <input
          style={styles.input}
          value={note}
          onChange={(e) => setNote(e.target.value)}
          placeholder={proposing ? "e.g. ward gave us a different MRN at the bedside" : "e.g. MRN confirmed with the ward"}
        />
      </div>

      <div style={styles.editPanelActions}>
        <span style={styles.editPanelCount}>
          {changes.length === 0
            ? "Nothing changed yet."
            : `${changes.length} change${changes.length === 1 ? "" : "s"} ready.`}
        </span>
        <div style={{ display: "flex", gap: 8 }}>
          <button style={styles.ghostBtnSm} onClick={onCancel}>Cancel</button>
          <button style={styles.primaryBtnSm} disabled={!changes.length || busy} onClick={submit}>
            {proposing ? "Send to dispatch" : "Save correction"}
          </button>
        </div>
      </div>
    </div>
  );
}

// What the desk sees when a crew has reported something wrong. Each proposed

              {editFieldLabel(e.field)}
              {/* Dispatch now raises calls with only the pick-up point, so most
                  of what comes back from a crew is information the desk never
                  had rather than a correction to something it got wrong. The two
                  need answering differently, so they are labelled differently. */}
              <span style={(e.from || "").trim() ? styles.reviewChangedTag : styles.reviewNewTag}>

// The trail of corrections that were actually made, so the call always says who
// changed what and when.
function EditHistory({ req }) {
  const done = callEdits(req).filter((e) => e.status === "applied");
  if (!done.length) return null;
  return (
    <div style={styles.editHistory}>
      {done.map((e) => (
        <div key={e.id} style={styles.editHistoryRow}>

          {editFieldLabel(e.field)}: {editValueText(e.from, e.field)} → <strong>{editValueText(e.to, e.field)}</strong>
          {" · "}{e.by}{e.verifiedBy && e.verifiedBy !== e.by ? ` (confirmed by ${e.verifiedBy})` : ""}
          {" · "}{hhmm(e.verifiedAt || e.at)}

      ))}

// The two ends of a call — where the patient is collected and where they are
// taken — as one "from → to" line. A call carrying no destination (an older
// record, or one raised before the destination was known) shows the pick-up
// point on its own rather than a dangling arrow.
function CallRoute({ req, size }) {
  const from = callFrom(req);
  const to = callTo(req);
  const glyph = size || 12;
  return (
    <span style={styles.callCardMetaItem}>
      <MapPin size={glyph} />
      <span style={styles.routeFrom}>{from || "—"}</span>
      {to && (
        <React.Fragment>
          <ArrowRight size={glyph} style={{ color: "#5E7488" }} />
          <span style={styles.routeTo}>{to}</span>
        </React.Fragment>
      )}
    </span>
